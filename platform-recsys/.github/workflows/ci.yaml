name: CI - platform-recsys

on:
  push:
    branches: [main]
    paths:
      - "platform-recsys/**"
      - ".github/workflows/ci-recsys.yaml"
  pull_request:
    paths:
      - "platform-recsys/**"

jobs:
  test:
    name: Lint, Test & Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-recsys
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Check syntax (compile)
        run: make compile

      - name: Lint (ruff & black)
        run: make lint

      - name: Environment drift gate
        run: make check-env

      - name: Run PySpark-free unit tests & eval suite
        run: make test-host

      - name: Run offline evaluation CLI
        run: make eval
