      - DATABASE_URL=postgres://promotion_svc:promotion_pass@postgres-promotion:5432/promotion_db?sslmode=disable
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:9000
      - FEATURE_FLAGS_EVAL_TIMEOUT_MS=500
