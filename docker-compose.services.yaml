      - GRPC_PORT=50054
      - ENV=local
    networks:
      - platform-core_default

  team-order:
    build:
      context: ./team-order
      dockerfile: Dockerfile
    image: team-order:local
    container_name: team-order-svc
    depends_on:
      team-order-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://order_svc:order_pass@postgres-order:5432/order_db?sslmode=disable
      - UPSTREAM_DOMAIN_ADDR=team-domain-svc:50051
      - UPSTREAM_IDENTITY_ADDR=team-identity-svc:50053
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:9000
      - FEATURE_FLAGS_EVAL_TIMEOUT_MS=500
      # PaymentSettled consumer (AD4/AD1): consume payment.events, drive order→PAID
      # idempotently, park poison records on the DLQ. Keys read by
      # internal/bootstrap/kafka.go::KafkaConfigFromEnv.
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - PAYMENT_EVENTS_TOPIC=payment.events
      - ORDER_PAYMENT_CONSUMER_GROUP=team-order.payment
      - PAYMENT_EVENTS_DLQ_TOPIC=payment.events.dlq
      - UPSTREAM_PROMOTION_ADDR=team-promotion-svc:50061
      - GRPC_PORT=50055
      - ENV=local
    networks:
      - platform-core_default

  team-promotion:
