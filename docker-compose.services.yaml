name: marketplace-services

# ── DB MIGRATIONS (golang-migrate) ────────────────────────────────────────────
# Each DB-backed service applies its own migrations on startup via a one-shot
# migrate/migrate init container (the same tool each repo's `make migrate` uses),
# reaching its owned Postgres over the shared platform-core_default network. The
# app service `depends_on` its migrate step with condition
# service_completed_successfully, so the schema exists before the server boots.
# `up` is idempotent (no-op when already at the latest version). restart:
# on-failure retries until the owned Postgres is reachable.
x-migrate: &migrate-defaults
  image: migrate/migrate:v4.17.1
  restart: on-failure
  networks:
    - platform-core_default

services:
  # ── KAFKA TOPIC INIT ────────────────────────────────────────────────────────
  # Redpanda (dev-container) does not reliably auto-create on first produce, so the
  # payment-event topics are created explicitly before the producers run: the
  # team-payment outbox relayer produces PaymentSettled to payment.events, and the
  # team-order consumer parks poison records on payment.events.dlq (AD1/AD4).
  # One-shot: waits for the shared broker to be healthy, then creates the topics
  # idempotently (|| true tolerates re-runs). team-payment/team-order depend on it.
  redpanda-init:
    image: redpandadata/redpanda:v24.1.7
    container_name: redpanda-init
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until rpk cluster info -X brokers=redpanda:9092 >/dev/null 2>&1; do
          echo "waiting for redpanda..."; sleep 2;
        done
        rpk topic create payment.events payment.events.dlq promotion.events listing.events listing.events.dlq -X brokers=redpanda:9092 -p 1 -r 1 || true
        rpk topic list -X brokers=redpanda:9092
    networks:
      - platform-core_default

  # ── OWNED DBs for the 4 new services ──────────────────────────────────────────
  # platform-core/infra owns postgres for the original services (postgres-listing…
  # postgres-notification, host ports 5433–5441). These 4 new services' Postgres are
  # declared here (platform-core is read-only for this change) but mirror that pattern
  # exactly: postgres:16-alpine, isolated <name>_svc/<name>_pass/<name>_db creds, a
  # pg_<name> volume, pg_isready healthcheck, on the same external platform-core_default
  # network so each service reaches it in-network as postgres-<name>:5432. Host ports
  # continue the 543X sequence (5442–5445) with no collision with platform-core's DBs.
  postgres-referral:
    image: postgres:16-alpine
    container_name: postgres-referral
    ports: ["5442:5432"]
    environment:
      POSTGRES_DB: referral_db
      POSTGRES_USER: referral_svc
      POSTGRES_PASSWORD: referral_pass
    volumes:
      - pg_referral:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referral_svc -d referral_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform-core_default

  postgres-verification:
    image: postgres:16-alpine
    container_name: postgres-verification
    ports: ["5443:5432"]
    environment:
      POSTGRES_DB: verification_db
      POSTGRES_USER: verification_svc
      POSTGRES_PASSWORD: verification_pass
    volumes:
      - pg_verification:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verification_svc -d verification_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform-core_default

  postgres-sharing:
    image: postgres:16-alpine
    container_name: postgres-sharing
    ports: ["5444:5432"]
    environment:
      POSTGRES_DB: sharing_db
      POSTGRES_USER: sharing_svc
      POSTGRES_PASSWORD: sharing_pass
    volumes:
      - pg_sharing:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharing_svc -d sharing_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform-core_default

  postgres-audit:
    image: postgres:16-alpine
    container_name: postgres-audit
    ports: ["5445:5432"]
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit_svc
      POSTGRES_PASSWORD: audit_pass
    volumes:
      - pg_audit:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_svc -d audit_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform-core_default

  team-identity-migrate:
    <<: *migrate-defaults
    container_name: team-identity-migrate
    volumes:
      - ./team-identity/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://identity_svc:identity_pass@postgres-identity:5432/identity_db?sslmode=disable
      - up

  team-domain-migrate:
    <<: *migrate-defaults
    container_name: team-domain-migrate
    volumes:
      - ./team-domain/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://listing_svc:listing_pass@postgres-listing:5432/listing_db?sslmode=disable
      - up

  team-engagement-migrate:
    <<: *migrate-defaults
    container_name: team-engagement-migrate
    volumes:
      - ./team-engagement/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://engagement_svc:engagement_pass@postgres-engagement:5432/engagement_db?sslmode=disable
      - up

  team-order-migrate:
    <<: *migrate-defaults
    container_name: team-order-migrate
    volumes:
      - ./team-order/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://order_svc:order_pass@postgres-order:5432/order_db?sslmode=disable
      - up

  team-payment-migrate:
    <<: *migrate-defaults
    container_name: team-payment-migrate
    volumes:
      - ./team-payment/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://payment_svc:payment_pass@postgres-payment:5432/payment_db?sslmode=disable
      - up

  team-chat-migrate:
    <<: *migrate-defaults
    container_name: team-chat-migrate
    volumes:
      - ./team-chat/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://chat_svc:chat_pass@postgres-chat:5432/chat_db?sslmode=disable
      - up

  team-promotion-migrate:
    <<: *migrate-defaults
    container_name: team-promotion-migrate
    volumes:
      - ./team-promotion/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://promotion_svc:promotion_pass@postgres-promotion:5432/promotion_db?sslmode=disable
      - up

  team-notification-migrate:
    <<: *migrate-defaults
    container_name: team-notification-migrate
    volumes:
      - ./team-notification/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://notification_svc:notification_pass@postgres-notification:5432/notification_db?sslmode=disable
      - up

  team-referral-migrate:
    <<: *migrate-defaults
    container_name: team-referral-migrate
    depends_on:
      postgres-referral:
        condition: service_healthy
    volumes:
      - ./team-referral/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://referral_svc:referral_pass@postgres-referral:5432/referral_db?sslmode=disable
      - up

  team-verification-migrate:
    <<: *migrate-defaults
    container_name: team-verification-migrate
    depends_on:
      postgres-verification:
        condition: service_healthy
    volumes:
      - ./team-verification/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://verification_svc:verification_pass@postgres-verification:5432/verification_db?sslmode=disable
      - up

  team-sharing-migrate:
    <<: *migrate-defaults
    container_name: team-sharing-migrate
    depends_on:
      postgres-sharing:
        condition: service_healthy
    volumes:
      - ./team-sharing/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://sharing_svc:sharing_pass@postgres-sharing:5432/sharing_db?sslmode=disable
      - up

  team-audit-migrate:
    <<: *migrate-defaults
    container_name: team-audit-migrate
    depends_on:
