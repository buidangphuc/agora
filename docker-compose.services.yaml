  team-domain:
    build:
      context: ./team-domain
      dockerfile: Dockerfile
    image: team-domain:local
    container_name: team-domain-svc
    depends_on:
      team-domain-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://listing_svc:listing_pass@postgres-listing:5432/listing_db?sslmode=disable
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - OUTBOX_ENABLED=true
      - GRPC_PORT=50051
      - ENV=local
    networks:
      - platform-core_default

  team-search:
    build:
      context: ./team-search
      dockerfile: Dockerfile
    image: team-search:local
    container_name: team-search-svc
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://search_svc:search_pass@postgres-search:5432/search_db?sslmode=disable
      - OPENSEARCH_URL=http://opensearch:9200
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - GRPC_PORT=50052
      - ENV=local
    networks:
      - platform-core_default

  team-search-indexer:
    image: team-search:local
    container_name: team-search-indexer-svc
    entrypoint: ["/indexer"]
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://search_svc:search_pass@postgres-search:5432/search_db?sslmode=disable
      - OPENSEARCH_URL=http://opensearch:9200
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - ENV=local
    networks:
      - platform-core_default

  team-engagement:
    build:
      context: ./team-engagement
      dockerfile: Dockerfile
    image: team-engagement:local
    container_name: team-engagement-svc
    depends_on:
      team-engagement-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://engagement_svc:engagement_pass@postgres-engagement:5432/engagement_db?sslmode=disable
      # verified-purchase check: engagement calls team-order to confirm a delivered order (no cross-DB join)
