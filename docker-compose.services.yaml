      context: ./team-identity
      dockerfile: Dockerfile
    image: team-identity:local
    container_name: team-identity-svc
    depends_on:
      team-identity-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://identity_svc:identity_pass@postgres-identity:5432/identity_db?sslmode=disable
      - JWT_PRIVATE_KEY='-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCa9r1/pblm+mdm\nFH5EHODWz/KHexkPcE4uDN8Fw+FaZXlC8LwPwGLX1uuBbOHZ4Itd8leTvREihqfs\nGqtPh4Nuuw+MmZr78WtH96tI1LxFvdyZJ4D8F9L9t3VIW3HgV3acVjZNQefFQCd8\nIwF3uoeH29+eazdZsbWLN3ulkpkgaUW+CptBm4wZ55zlizR+ANy0bHjhA9Pipy5k\ncvha5t6u2wOISbLu7YTkLARouE1YP1C54FGMMFOffhPm1aJfftfwysrroZnb0nLT\nQBv2knsjm2tk9rdA4gkkUqM6C8MrsExjFyLH6dSbW1q25zY0gwulic0PPmCkJq0c\nbj00NXhlAgMBAAECggEABaZoa16J/4Cyw2yM3APniL2FPL5WwBLaruAmQ4oMTeT0\nQmYPnU1o7TC3Xn0vUOfYfQDog4j5tnYNalTgmSI6Pw/P9dLl7Ti0rieQFbQ39x0A\njY78q3Rc64ZEXvKCmOjneLTF/xQflLgNmH+YPprM9T2ljhufpYQOt/g6aGOLdLyD\nUpHTroKQP6Jifa7q+8UgGz/44QhLHwZI3oyO07a/OWhzhRDlpwsh4eMhWcJiKIde\nfWdXxhwk5nafUCf3hpedIA0418QRBWeCK5h9F1pVkiIiznhNsmp6jyEcQoYlV0W5\n7j7+b0pGS6igchb8ljj3raHvhnm+ukd1FbF9CFmsEwKBgQDT9UzHAyGyBx1fQFde\nMy0hQUpbwjVcJzqhoNSRv97z4x5ejFMJRPsuloEzqXq33VQ86lHhpg1K+ArY6XeA\nvzy3cd8HLA/9vES9oMgspMCHrNRyomJ+x9+jYehr/umHGzIqyFfu3ZriJpuVrGf4\nPY+RiOUNVGVuBxwjZxNzJQ9OVwKBgQC7KbyR8dkRR87H17oBm8GWBO+joNmzUaNO\nsm5q3KS3aGdRoYzX2HdoPxhxaIr/gAEXektnp5QdNmt8r/xnhofm//tdOJaB4NKW\nfd/xerND0ajRzhWRlfh9enSQ8UYjsyurOQwpArZ7+LHUtpBPrFNR+p2pPa8yWz1+\n0WqRS3HBowKBgQC3jkA+PJ0KopSyL3M59dHIcdVmX2p8ctCYtkJAMkxvIynisV0b\nsuxf7SDYz5Wh8v+HfVkJtBbg7KvgK1c9XN/E8c02VddHYqqZGcsgtlCxbl/RIoVv\ny8IFqL1yASDVyxyH5lYYWztNTCgC13p2hUF2xHmwMH1iaq/YjORQHDEEIwKBgG0A\naao1x82gnHUW1mWJaL0OMuKBE0i0CwASOuxRhDysuT95bqVmlGRKGtoxoIIc8oXR\n24iKuGArCX6cn8tLNmr6OlKYWk9ZuEudE4d3hl/BAyjtdPJM/WNWpfykB81S0+Ps\nXYCk69JXjHntuS4tlnjwFFI0coxJRw9Mt1vXLHExAoGBAMgolo3b0gEaH9W0Y6JV\nmCgz4IWbwv33zYsgWkDIRAqxC3Yb7+LOIWOh5WkHZ3xDv6rRu5K3jwPjtP4HgOcU\nq157I7U+g8YFCgczWUrDz9Ffcxf2mpBKGKuKFxY0vQxFijomHTPvR7m0BLronev/\nmgi+aqBmWK71t/t9R9551U39\n-----END PRIVATE KEY-----\n'
      - JWT_KID=dev-2026
