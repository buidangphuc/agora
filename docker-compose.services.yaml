name: marketplace-services

# ── DB MIGRATIONS (golang-migrate) ────────────────────────────────────────────
# Each DB-backed service applies its own migrations on startup via a one-shot
# migrate/migrate init container (the same tool each repo's `make migrate` uses),
# reaching its owned Postgres over the shared platform-core_default network. The
# app service `depends_on` its migrate step with condition
# service_completed_successfully, so the schema exists before the server boots.
# `up` is idempotent (no-op when already at the latest version). restart:
# on-failure retries until the owned Postgres is reachable.
x-migrate: &migrate-defaults
  image: migrate/migrate:v4.17.1
  restart: on-failure

services:
  # ── KAFKA TOPIC INIT ────────────────────────────────────────────────────────
  # Redpanda (dev-container) does not reliably auto-create on first produce, so the
  # payment-event topics are created explicitly before the producers run: the
  # team-payment outbox relayer produces PaymentSettled to payment.events, and the
  # team-order consumer parks poison records on payment.events.dlq (AD1/AD4), and
  # the team-order outbox relayer produces OrderPaidEvent and OrderShipped to order.events
  # (ADR-0013), team-chat produces ChatMessage to chat.events, and team-notification
  # consumes both (poison records park on <topic>.dlq).
  # One-shot: waits for the shared broker to be healthy, then creates the topics
  # idempotently (|| true tolerates re-runs). team-payment/team-order depend on it.
  redpanda-init:
    image: redpandadata/redpanda:v24.1.7
    container_name: redpanda-init
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until rpk cluster info -X brokers=redpanda:9092 >/dev/null 2>&1; do
          echo "waiting for redpanda..."; sleep 2;
        done
        rpk topic create payment.events payment.events.dlq order.events order.events.dlq order.events.payment-settlement.dlq chat.events chat.events.dlq promotion.events listing.events listing.events.dlq identity.events analytics.events engagement.events engagement.events.analytics.dlq -X brokers=redpanda:9092 -p 1 -r 1 || true
        rpk topic list -X brokers=redpanda:9092

  # ── OWNED DBs for the 4 new services ──────────────────────────────────────────
  # platform-core/infra owns postgres for the original services (postgres…
  # postgres, host ports 5433–5441). These 4 new services' Postgres are
  # declared here (platform-core is read-only for this change) but mirror that pattern
  # exactly: postgres:16-alpine, isolated <name>_svc/<name>_pass/<name>_db creds, a
  # pg_<name> volume, pg_isready healthcheck, on the same external platform-core_default
  # network so each service reaches it in-network as postgres-<name>:5432. Host ports
  # continue the 543X sequence (5442–5445) with no collision with platform-core's DBs.
  team-identity-migrate:
    <<: *migrate-defaults
    container_name: team-identity-migrate
    volumes:
      - ./team-identity/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://identity_svc:identity_pass@postgres:5432/identity_db?sslmode=disable
      - up

  team-domain-migrate:
    <<: *migrate-defaults
    container_name: team-domain-migrate
    volumes:
      - ./team-domain/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://listing_svc:listing_pass@postgres:5432/listing_db?sslmode=disable
      - up

  team-engagement-migrate:
    <<: *migrate-defaults
    container_name: team-engagement-migrate
    volumes:
      - ./team-engagement/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://engagement_svc:engagement_pass@postgres:5432/engagement_db?sslmode=disable
      - up

  team-order-migrate:
    <<: *migrate-defaults
    container_name: team-order-migrate
    volumes:
      - ./team-order/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://order_svc:order_pass@postgres:5432/order_db?sslmode=disable
      - up

  team-search-migrate:
    <<: *migrate-defaults
    container_name: team-search-migrate
    volumes:
      - ./team-search/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://search_svc:search_pass@postgres:5432/search_db?sslmode=disable
      - up

  team-payment-migrate:
    <<: *migrate-defaults
    container_name: team-payment-migrate
    volumes:
      - ./team-payment/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://payment_svc:payment_pass@postgres:5432/payment_db?sslmode=disable
      - up

  team-chat-migrate:
    <<: *migrate-defaults
    container_name: team-chat-migrate
    volumes:
      - ./team-chat/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://chat_svc:chat_pass@postgres:5432/chat_db?sslmode=disable
      - up

  team-promotion-migrate:
    <<: *migrate-defaults
    container_name: team-promotion-migrate
    volumes:
      - ./team-promotion/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://promotion_svc:promotion_pass@postgres:5432/promotion_db?sslmode=disable
      - up

  team-notification-migrate:
    <<: *migrate-defaults
    container_name: team-notification-migrate
    volumes:
      - ./team-notification/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://notification_svc:notification_pass@postgres:5432/notification_db?sslmode=disable
      - up

  team-referral-migrate:
    <<: *migrate-defaults
    container_name: team-referral-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./team-referral/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://referral_svc:referral_pass@postgres:5432/referral_db?sslmode=disable
      - up

  team-verification-migrate:
    <<: *migrate-defaults
    container_name: team-verification-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./team-verification/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://verification_svc:verification_pass@postgres:5432/verification_db?sslmode=disable
      - up

  team-sharing-migrate:
    <<: *migrate-defaults
    container_name: team-sharing-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./team-sharing/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://sharing_svc:sharing_pass@postgres:5432/sharing_db?sslmode=disable
      - up

  team-audit-migrate:
    <<: *migrate-defaults
    container_name: team-audit-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./team-audit/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://audit_svc:audit_pass@postgres:5432/audit_db?sslmode=disable
      - up

  team-identity:
    build:
      context: ./team-identity
      dockerfile: Dockerfile
    image: team-identity:local
    container_name: team-identity-svc
    depends_on:
      team-identity-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://identity_svc:identity_pass@postgres:5432/identity_db?sslmode=disable
      - JWT_PRIVATE_KEY='-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCa9r1/pblm+mdm\nFH5EHODWz/KHexkPcE4uDN8Fw+FaZXlC8LwPwGLX1uuBbOHZ4Itd8leTvREihqfs\nGqtPh4Nuuw+MmZr78WtH96tI1LxFvdyZJ4D8F9L9t3VIW3HgV3acVjZNQefFQCd8\nIwF3uoeH29+eazdZsbWLN3ulkpkgaUW+CptBm4wZ55zlizR+ANy0bHjhA9Pipy5k\ncvha5t6u2wOISbLu7YTkLARouE1YP1C54FGMMFOffhPm1aJfftfwysrroZnb0nLT\nQBv2knsjm2tk9rdA4gkkUqM6C8MrsExjFyLH6dSbW1q25zY0gwulic0PPmCkJq0c\nbj00NXhlAgMBAAECggEABaZoa16J/4Cyw2yM3APniL2FPL5WwBLaruAmQ4oMTeT0\nQmYPnU1o7TC3Xn0vUOfYfQDog4j5tnYNalTgmSI6Pw/P9dLl7Ti0rieQFbQ39x0A\njY78q3Rc64ZEXvKCmOjneLTF/xQflLgNmH+YPprM9T2ljhufpYQOt/g6aGOLdLyD\nUpHTroKQP6Jifa7q+8UgGz/44QhLHwZI3oyO07a/OWhzhRDlpwsh4eMhWcJiKIde\nfWdXxhwk5nafUCf3hpedIA0418QRBWeCK5h9F1pVkiIiznhNsmp6jyEcQoYlV0W5\n7j7+b0pGS6igchb8ljj3raHvhnm+ukd1FbF9CFmsEwKBgQDT9UzHAyGyBx1fQFde\nMy0hQUpbwjVcJzqhoNSRv97z4x5ejFMJRPsuloEzqXq33VQ86lHhpg1K+ArY6XeA\nvzy3cd8HLA/9vES9oMgspMCHrNRyomJ+x9+jYehr/umHGzIqyFfu3ZriJpuVrGf4\nPY+RiOUNVGVuBxwjZxNzJQ9OVwKBgQC7KbyR8dkRR87H17oBm8GWBO+joNmzUaNO\nsm5q3KS3aGdRoYzX2HdoPxhxaIr/gAEXektnp5QdNmt8r/xnhofm//tdOJaB4NKW\nfd/xerND0ajRzhWRlfh9enSQ8UYjsyurOQwpArZ7+LHUtpBPrFNR+p2pPa8yWz1+\n0WqRS3HBowKBgQC3jkA+PJ0KopSyL3M59dHIcdVmX2p8ctCYtkJAMkxvIynisV0b\nsuxf7SDYz5Wh8v+HfVkJtBbg7KvgK1c9XN/E8c02VddHYqqZGcsgtlCxbl/RIoVv\ny8IFqL1yASDVyxyH5lYYWztNTCgC13p2hUF2xHmwMH1iaq/YjORQHDEEIwKBgG0A\naao1x82gnHUW1mWJaL0OMuKBE0i0CwASOuxRhDysuT95bqVmlGRKGtoxoIIc8oXR\n24iKuGArCX6cn8tLNmr6OlKYWk9ZuEudE4d3hl/BAyjtdPJM/WNWpfykB81S0+Ps\nXYCk69JXjHntuS4tlnjwFFI0coxJRw9Mt1vXLHExAoGBAMgolo3b0gEaH9W0Y6JV\nmCgz4IWbwv33zYsgWkDIRAqxC3Yb7+LOIWOh5WkHZ3xDv6rRu5K3jwPjtP4HgOcU\nq157I7U+g8YFCgczWUrDz9Ffcxf2mpBKGKuKFxY0vQxFijomHTPvR7m0BLronev/\nmgi+aqBmWK71t/t9R9551U39\n-----END PRIVATE KEY-----\n'
      - JWT_KID=dev-2026
      - JWKS_HTTP_PORT=50063
      - GRPC_PORT=50053
      - ENV=local
      # SessionRevoked outbox relayer (ADR-0003 addendum): RevokeSession writes the
      # event in the same tx; the relayer publishes it to identity.events so the
      # gateway denies the revoked session's token. Same OUTBOX_* names as team-domain.
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - IDENTITY_EVENTS_TOPIC=identity.events
      - OUTBOX_ENABLED=true
      - OUTBOX_POLL_INTERVAL=1s
      - OUTBOX_BATCH_SIZE=100
      - OUTBOX_CLAIM_LOCK_SECONDS=60
      - OUTBOX_MAX_ATTEMPTS=10
      # Local-only first-admin seed (dev password; override via SEED_ADMIN_PASSWORD).
      # Deployment manifests must NOT enable this (platform-gitops check).
      - SEED_ADMIN_ENABLED=true
      - SEED_ADMIN_USERNAME=admin
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin-dev-password-123}

  team-domain:
    build:
      context: ./team-domain
      dockerfile: Dockerfile
    image: team-domain:local
    container_name: team-domain-svc
    depends_on:
      team-domain-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://listing_svc:listing_pass@postgres:5432/listing_db?sslmode=disable
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - OUTBOX_ENABLED=true
      - GRPC_PORT=50051
      - ENV=local

  team-search:
    build:
      context: ./team-search
      dockerfile: Dockerfile
    image: team-search:local
    container_name: team-search-svc
    # it ensures the OpenSearch index at boot and exits if OpenSearch is not up yet
    restart: unless-stopped
    depends_on:
      team-search-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://search_svc:search_pass@postgres:5432/search_db?sslmode=disable
      - OPENSEARCH_URL=http://opensearch:9200
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - GRPC_PORT=50052
      - ENV=local

  team-search-indexer:
    image: team-search:local
    container_name: team-search-indexer-svc
    entrypoint: ["/indexer"]
    # without these the indexer can start before OpenSearch/Redpanda are ready and exit
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      team-search-migrate:
        condition: service_completed_successfully
      team-ai:
        condition: service_started
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://search_svc:search_pass@postgres:5432/search_db?sslmode=disable
      - OPENSEARCH_URL=http://opensearch:9200
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      # Tag classification during ingestion (AIService.ClassifyTags, service principal, scope ai.classify).
      # A failed call never blocks ingestion: the listing is indexed with tags_pending.
      - UPSTREAM_AI_ADDR=team-ai-svc:50060
      - ENV=local

  team-engagement:
    build:
      context: ./team-engagement
      dockerfile: Dockerfile
    image: team-engagement:local
    container_name: team-engagement-svc
    depends_on:
      team-engagement-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://engagement_svc:engagement_pass@postgres:5432/engagement_db?sslmode=disable
      # verified-purchase check: engagement calls team-order to confirm a delivered order (no cross-DB join)
      - UPSTREAM_ORDER_ADDR=team-order-svc:50055
      # Follow feed: consume listing.events into seller_listings (DLQ listing.events.dlq).
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_CONSUMER_GROUP=team-engagement-feed
      - KAFKA_LISTING_TOPIC=listing.events
      # Engagement fact events: outbox relayer publishes to engagement.events (efe D4).
      - ENGAGEMENT_EVENTS_TOPIC=engagement.events
      - ENGAGEMENT_OUTBOX_RELAY_INTERVAL=500ms
      - GRPC_PORT=50054
      - ENV=local

  team-order:
    build:
      context: ./team-order
      dockerfile: Dockerfile
    image: team-order:local
    container_name: team-order-svc
    depends_on:
      team-order-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://order_svc:order_pass@postgres:5432/order_db?sslmode=disable
      - UPSTREAM_DOMAIN_ADDR=team-domain-svc:50051
      - UPSTREAM_IDENTITY_ADDR=team-identity-svc:50053
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:9000
      - FEATURE_FLAGS_EVAL_TIMEOUT_MS=500
      # PaymentSettled consumer (AD4/AD1): consume payment.events, drive order→PAID
      # idempotently, park poison records on the DLQ. Keys read by
      # internal/bootstrap/kafka.go::KafkaConfigFromEnv.
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - PAYMENT_EVENTS_TOPIC=payment.events
      - ORDER_PAYMENT_CONSUMER_GROUP=team-order.payment
      - PAYMENT_EVENTS_DLQ_TOPIC=payment.events.dlq
      # order.events outbox relayer (ADR-0013): publishes OrderPaidEvent (line
      # items) written in the same tx as the PAID transition. Same OUTBOX_* names
      # as team-domain; needs KAFKA_ENABLED=true above.
      - ORDER_EVENTS_TOPIC=order.events
      - OUTBOX_ENABLED=true
      - OUTBOX_POLL_INTERVAL=1s
      - OUTBOX_BATCH_SIZE=100
      - OUTBOX_CLAIM_LOCK_SECONDS=60
      - OUTBOX_MAX_ATTEMPTS=10
      - UPSTREAM_PROMOTION_ADDR=team-promotion-svc:50061
      - GRPC_PORT=50055
      - ENV=local

  team-promotion:
    build:
      context: ./team-promotion
      dockerfile: Dockerfile
    image: team-promotion:local
    container_name: team-promotion-svc
    depends_on:
      team-promotion-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://promotion_svc:promotion_pass@postgres:5432/promotion_db?sslmode=disable
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:9000
      - FEATURE_FLAGS_EVAL_TIMEOUT_MS=500
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - PROMOTION_EVENTS_TOPIC=promotion.events
      # CreateCampaign checks listing ownership against team-domain (fails closed if unset).
      - UPSTREAM_DOMAIN_ADDR=team-domain-svc:50051
      - GRPC_PORT=50061
      - ENV=local

  team-payment:
    build:
      context: ./team-payment
      dockerfile: Dockerfile
    image: team-payment:local
    container_name: team-payment-svc
    depends_on:
      team-payment-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://payment_svc:payment_pass@postgres:5432/payment_db?sslmode=disable
      - UPSTREAM_ORDER_ADDR=team-order-svc:50055
      # Transactional-outbox relayer (AD4): settle writes payment=PAID + a
      # PaymentSettled outbox row in one tx; the relayer drains it to
      # payment.events. Keys read by internal/bootstrap/kafka.go::kafkaConfigFromEnv.
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - PAYMENT_EVENTS_TOPIC=payment.events
      # Seller ledger consumer of order.events (OrderPaidEvent credit, OrderCancelled
      # refund); poison records go to its own DLQ (order.events.dlq is team-notification's).
      # The payout hold stays at its 7-day default; the e2e overlay
      # platform-e2e/compose/payment-ledger.override.yaml shortens it.
      - ORDER_EVENTS_TOPIC=order.events
      - PAYMENT_SETTLEMENT_CONSUMER_GROUP=team-payment.settlement
      - PAYMENT_SETTLEMENT_DLQ_TOPIC=order.events.payment-settlement.dlq
      - GRPC_PORT=50056
      - ENV=local
      # local/e2e only: enables ProcessMockPayment (refused at boot in staging/prod)
      - MOCK_PAYMENTS=true

  team-chat:
    build:
      context: ./team-chat
      dockerfile: Dockerfile
    image: team-chat:local
    container_name: team-chat-svc
    depends_on:
      team-chat-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://chat_svc:chat_pass@postgres:5432/chat_db?sslmode=disable
      # chat.events producer: ChatMessage (with recipient_id) feeds team-notification
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_CHAT_TOPIC=chat.events
      # chat.events outbox relayer: SendMessage writes the event in the message tx
      # (chat_outbox_events) and the relayer publishes it, so a Kafka hiccup delays
      # but never loses a notification. Same OUTBOX_* names as team-order.
      - OUTBOX_ENABLED=true
      - OUTBOX_POLL_INTERVAL=1s
      - OUTBOX_BATCH_SIZE=100
      - OUTBOX_CLAIM_LOCK_SECONDS=60
      - OUTBOX_MAX_ATTEMPTS=10
      # team-chat builds its DB config from POSTGRES_* (default host postgres-chat);
      # point it at the shared instance.
      - POSTGRES_HOST=postgres
      - GRPC_PORT=50057
      - ENV=local

  team-notification:
    build:
      context: ./team-notification
      dockerfile: Dockerfile
    image: team-notification:local
    container_name: team-notification-svc
    depends_on:
      team-notification-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://notification_svc:notification_pass@postgres:5432/notification_db?sslmode=disable
      # listing.events consumer (F3): price-drop / back-in-stock alerts
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - LISTING_EVENTS_TOPIC=listing.events
      - NOTIFICATION_LISTING_CONSUMER_GROUP=team-notification.listing
      - LISTING_EVENTS_DLQ_TOPIC=listing.events.dlq
      # chat.events consumer: CHAT notification for the other thread participant
      - CHAT_EVENTS_TOPIC=chat.events
      - NOTIFICATION_CHAT_CONSUMER_GROUP=team-notification.chat
      - CHAT_EVENTS_DLQ_TOPIC=chat.events.dlq
      # order.events consumer: ORDER notification on OrderShipped
      - ORDER_EVENTS_TOPIC=order.events
      - NOTIFICATION_ORDER_CONSUMER_GROUP=team-notification.order
      - ORDER_EVENTS_DLQ_TOPIC=order.events.dlq
      # Chat sender names: shop display name from team-domain, user display name from
      # team-identity (service principal; any failure falls back to a neutral label).
      - UPSTREAM_DOMAIN_ADDR=team-domain-svc:50051
      - UPSTREAM_IDENTITY_ADDR=team-identity-svc:50053
      - GRPC_PORT=50058
      - ENV=local

  # ── 4 NEW gRPC services (mirror team-notification wiring) ─────────────────────
  team-referral:
    build:
      context: ./team-referral
      dockerfile: Dockerfile
    image: team-referral:local
    container_name: team-referral-svc
    depends_on:
      team-referral-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://referral_svc:referral_pass@postgres:5432/referral_db?sslmode=disable
      - GRPC_PORT=50062
      - ENV=local

  team-verification:
    build:
      context: ./team-verification
      dockerfile: Dockerfile
    image: team-verification:local
    container_name: team-verification-svc
    depends_on:
      team-verification-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://verification_svc:verification_pass@postgres:5432/verification_db?sslmode=disable
      - GRPC_PORT=50064
      - ENV=local

  team-sharing:
    build:
      context: ./team-sharing
      dockerfile: Dockerfile
    image: team-sharing:local
    container_name: team-sharing-svc
    depends_on:
      team-sharing-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://sharing_svc:sharing_pass@postgres:5432/sharing_db?sslmode=disable
      - GRPC_PORT=50065
      - ENV=local

  team-audit:
    build:
      context: ./team-audit
      dockerfile: Dockerfile
    image: team-audit:local
    container_name: team-audit-svc
    depends_on:
      team-audit-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_URL=postgres://audit_svc:audit_pass@postgres:5432/audit_db?sslmode=disable
      - GRPC_PORT=50066
      - ENV=local

  team-gateway:
    build:
      context: ./team-gateway
      dockerfile: Dockerfile
    image: team-gateway:local
    container_name: team-gateway-svc
    environment:
      - HTTP_PORT=8080
      - UPSTREAM_IDENTITY_ADDR=team-identity-svc:50053
      - UPSTREAM_LISTING_ADDR=team-domain-svc:50051
      - UPSTREAM_SEARCH_ADDR=team-search-svc:50052
      - UPSTREAM_ENGAGEMENT_ADDR=team-engagement-svc:50054
      - UPSTREAM_ORDER_ADDR=team-order-svc:50055
      - UPSTREAM_PAYMENT_ADDR=team-payment-svc:50056
      - UPSTREAM_CHAT_ADDR=team-chat-svc:50057
      - UPSTREAM_NOTIFICATION_ADDR=team-notification-svc:50058
      - UPSTREAM_PROMOTION_ADDR=team-promotion-svc:50061
      - UPSTREAM_AI_ADDR=team-ai-svc:50060
      - UPSTREAM_RECOMMENDATION_ADDR=team-ai-svc:50060
      - JWKS_URL=http://team-identity-svc:50063/.well-known/jwks.json
      - JWKS_CACHE_TTL=300
      - CORS_ORIGINS=http://localhost:3000,http://team-frontend:3000,http://127.0.0.1:3000
      - RATE_LIMIT_RPS=1000
      - RATE_LIMIT_BURST=2000
      # Every e2e browser shares the docker host IP, so the per-IP collector limit is raised
      # locally too (shipped default 5 rps / burst 20; the flood scenario uses its own gateway).
      - TRACK_RATE_LIMIT_RPS=1000
      - TRACK_RATE_LIMIT_BURST=2000
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ANALYTICS_TOPIC=analytics.events
      # Session revocation (ADR-0003 addendum): consume identity.events into the
      # in-memory sid denylist (no consumer group; earliest offset on start).
      - IDENTITY_EVENTS_TOPIC=identity.events
      # Trusted client context (ADR-0003 addendum): the frontend's Next.js server is
      # the gateway's peer for browser traffic, so ONLY it (by service name,
      # re-resolved) may supply X-Forwarded-For. Everything else (e.g. the e2e
      # runner on the same network) is untrusted: its XFF is ignored.
      - TRUSTED_PROXIES=team-frontend-svc
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=team-gateway
      # Local only: export metrics every 10 s (SDK default 60 s) so the admin cockpit
      # reflects traffic quickly; the PeriodicReader reads this standard variable.
      - OTEL_METRIC_EXPORT_INTERVAL=10000
      - PROMETHEUS_URL=http://prometheus:9090
      - JAEGER_QUERY_URL=http://jaeger:16686
      - JAEGER_UI_URL=http://localhost:16686
    ports:
      - "8080:8080"

  team-ai:
    build:
      context: ./team-ai
      dockerfile: Dockerfile
      args:
        # qdrant-client for the trained-recommendations reader (RECS_BACKEND=qdrant).
        UV_EXTRAS: recs
    image: team-ai:local
    container_name: team-ai-svc
    environment:
      - ENVIRONMENT=local
      - PORT=8000
      - GRPC_ENABLED=true
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50060
      - DATABASE_ENABLED=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # team-ai owns no database here (DATABASE_ENABLED=false) and must not hold listing's creds
      # (AGENTS.md rule 3). Settings still require the fields: placeholders, override via .env
      # (see .env.example).
      - POSTGRES_USER=${TEAM_AI_POSTGRES_USER:-team_ai_svc}
      - POSTGRES_PASSWORD=${TEAM_AI_POSTGRES_PASSWORD:-team-ai-local-placeholder}
      - POSTGRES_DB=${TEAM_AI_POSTGRES_DB:-team_ai_db}
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHAT_BACKEND=mock
      # Recommendations (serve-recommendations-teamai) — reuses GRPC_PORT, no new
      # port. Served from what the platform-recsys job (below, profile "jobs")
      # writes to Qdrant + Redis; until it has run, Recommend answers empty and the
      # home row stays hidden. RECS_BACKEND=memory is the offline/dev fixture.
      - RECS_ENABLED=true
      - RECS_BACKEND=qdrant
      - RECS_QDRANT_URL=http://qdrant:6333
      - RECS_QDRANT_COLLECTION=item_als_vectors
      - RECS_CACHE_PREFIX=recs
      - RECS_CACHE_SCHEMA_VERSION=v1
      - RECS_CACHE_TTL_SECONDS=86400
      # Online item features from platform-featurestore (its own Redis DB 2), recs-serving-safeguards.
      - RECS_FEATURESTORE_REDIS_URL=redis://redis:6379/2
      # Nearline position-debiased CTR written by platform-recsys-nearline (add-recsys-nearline-signals),
      # read per request for GBDT placements; an outage leaves the request on prior CTRs.
      - RECS_NEARLINE_REDIS_URL=redis://redis:6379/0
      - RECS_RETRIEVE_TIMEOUT_MS=15
    ports:
      - "8001:8000"
      - "50060:50060"

  # Offline ALS training job (serve-trained-recs-locally) — a batch, not a server:
  #   docker compose --profile jobs run --rm platform-recsys
  # Reads the als_interactions dataset from the featurestore volume (read-only,
  # built by featurestore-dataset) and writes
  # item/user vectors to Qdrant and the recs:v1:* lists to Redis for team-ai.
  # Nearline signals: consumes analytics.events into recs:nearline:* (Redis DB 0, TTL 24 h); the contract team-ai
  # reads is in openspec/changes/add-recsys-nearline-signals/design.md. Same image as the batch job.
  platform-recsys-nearline:
    build:
      context: ./platform-recsys
      dockerfile: Dockerfile
    image: platform-recsys:local
    container_name: platform-recsys-nearline
    entrypoint: ["python", "-m", "recsys.nearline"]
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ANALYTICS_TOPIC=analytics.events
      - NEARLINE_CONSUMER_GROUP=platform-recsys-nearline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy

  platform-recsys:
    build:
      context: ./platform-recsys
      dockerfile: Dockerfile
    image: platform-recsys:local
    profiles: ["jobs"]
    environment:
      - DATASET_DIR=/features/datasets/als_interactions/v1
      - QDRANT_URL=http://qdrant:6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - featurestore_data:/features:ro
    depends_on:
      - qdrant
      - redis

  # Feature materialisation job (featurestore-materialization) — a batch, not a server:
  #   docker compose --profile featurestore run --rm featurestore-job
  # Reads the Parquet that team-analytics exports to the shared volume, writes an
  # offline snapshot + manifest to /features and the fs:<view>:* keys to Redis DB 2.
  # AS_OF (RFC 3339) pins the point in time; unset means now.
  featurestore-job:
    build:
      context: ./platform-featurestore
      dockerfile: Dockerfile
    image: platform-featurestore:local
    profiles: ["featurestore"]
    environment:
      - FEATURESTORE_INPUT_DIR=/data
      - FEATURESTORE_OFFLINE_DIR=/features
      - FEATURESTORE_REDIS_URL=redis://redis:6379/2
      - FEATURESTORE_ONLINE_TTL_SECONDS=172800
      - FEATURESTORE_PARITY_SAMPLE=200
      - AS_OF=${AS_OF:-}
    command: ["materialize"]
    volumes:
      - analytics_data:/data:ro
      - featurestore_data:/features
    depends_on:
      - redis

  # Dataset build (featurestore-datasets) — run after featurestore-job; writes
  # /features/datasets/<name>/<version>/ that the platform-recsys job reads:
  #   docker compose --profile featurestore run --rm featurestore-dataset
  featurestore-dataset:
    build:
      context: ./platform-featurestore
      dockerfile: Dockerfile
    image: platform-featurestore:local
    profiles: ["featurestore"]
    environment:
      - FEATURESTORE_INPUT_DIR=/data
      - FEATURESTORE_OFFLINE_DIR=/features
      - FEATURESTORE_REDIS_URL=redis://redis:6379/2
      - FEATURESTORE_ONLINE_TTL_SECONDS=172800
      - FEATURESTORE_PARITY_SAMPLE=200
      - AS_OF=${AS_OF:-}
    command: ["dataset"]
    volumes:
      - analytics_data:/data:ro
      - featurestore_data:/features
    depends_on:
      - redis

  team-analytics:
    build:
      context: ./team-analytics
      dockerfile: Dockerfile
    image: team-analytics:local
    container_name: team-analytics-svc
    environment:
      - ENV=local
      - GRPC_PORT=50059
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_CONSUMER_GROUP=team-analytics
      - KAFKA_ANALYTICS_TOPIC=analytics.events
      - WAREHOUSE_DRIVER=duckdb
      # On the volume so tracking events survive restarts; the export feeds the
      # platform-recsys training job (serve-trained-recs-locally).
      - DUCKDB_PATH=/data/analytics.duckdb
      - PARQUET_EXPORT_PATH=/data/tracking_events.parquet
      - PARQUET_EXPORT_INTERVAL_SECONDS=300
      - ENGAGEMENT_EVENTS_TOPIC=engagement.events
      - ENGAGEMENT_DLQ_TOPIC=engagement.events.analytics.dlq
      - ENGAGEMENT_CONSUMER_GROUP=team-analytics.engagement
    volumes:
      - analytics_data:/data

  team-frontend:
    build:
      context: ./team-frontend
      dockerfile: Dockerfile
    image: team-frontend:local
    container_name: team-frontend-svc
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
      - GATEWAY_URL=http://team-gateway-svc:8080
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:8080
    ports:
      - "3000:3000"

  platform-e2e:
    build:
      context: ./platform-e2e
      dockerfile: Dockerfile
    image: platform-e2e:local
    container_name: platform-e2e-runner
    environment:
      - ENV=docker
      - BASE_URL=http://team-frontend-svc:3000
      - GATEWAY_URL=http://team-gateway-svc:8080
      - HEADLESS=true
    volumes:
      - ./platform-e2e/test-results:/workspace/test-results

volumes:
  analytics_data:
  featurestore_data:
