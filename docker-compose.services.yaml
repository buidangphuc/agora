      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "8080:8080"
    networks:
      - platform-core_default

  team-ai:
    build:
      context: ./team-ai
      dockerfile: Dockerfile
    image: team-ai:local
    container_name: team-ai-svc
    environment:
      - ENVIRONMENT=local
      - PORT=8000
      - GRPC_ENABLED=true
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50060
      - DATABASE_ENABLED=false
      - POSTGRES_HOST=postgres-listing
      - POSTGRES_PORT=5432
      - POSTGRES_USER=listing_svc
      - POSTGRES_PASSWORD=listing_pass
      - POSTGRES_DB=listing_db
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHAT_BACKEND=mock
      # Recommendations (serve-recommendations-teamai) — reuses GRPC_PORT, no new
      # port. Off by default; flip RECS_ENABLED=true once build-als-training-job
      # has populated the Qdrant collection + Redis pre-computed lists. Use
      # RECS_BACKEND=memory for offline/dev without real infra.
      - RECS_ENABLED=false
      - RECS_BACKEND=memory
      - RECS_QDRANT_URL=http://qdrant:6333
      - RECS_QDRANT_COLLECTION=item_als_vectors
      - RECS_CACHE_PREFIX=recs
      - RECS_CACHE_SCHEMA_VERSION=v1
      - RECS_CACHE_TTL_SECONDS=86400
      - RECS_RETRIEVE_TIMEOUT_MS=15
    ports:
      - "8001:8000"
      - "50060:50060"
    networks:
      - platform-core_default

  team-analytics:
    build:
      context: ./team-analytics
      dockerfile: Dockerfile
    image: team-analytics:local
    container_name: team-analytics-svc
    environment:
      - ENV=local
      - GRPC_PORT=50059
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_CONSUMER_GROUP=team-analytics
      - KAFKA_ANALYTICS_TOPIC=analytics.events
      - WAREHOUSE_DRIVER=duckdb
      - DUCKDB_PATH=/tmp/analytics.duckdb
    volumes:
      - analytics_data:/data
    networks:
      - platform-core_default

  team-frontend:
    build:
      context: ./team-frontend
      dockerfile: Dockerfile
    image: team-frontend:local
    container_name: team-frontend-svc
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
      - GATEWAY_URL=http://team-gateway-svc:8080
      - FEATURE_FLAGS_ENABLED=true
      - FLIPT_ADDR=flipt:8080
    ports:
      - "3000:3000"
    networks:
      - platform-core_default

  platform-e2e:
    build:
      context: ./platform-e2e
      dockerfile: Dockerfile
    image: platform-e2e:local
    container_name: platform-e2e-runner
    environment:
      - ENV=docker
      - BASE_URL=http://team-frontend-svc:3000
      - GATEWAY_URL=http://team-gateway-svc:8080
      - HEADLESS=true
    volumes:
      - ./platform-e2e/test-results:/workspace/test-results
    networks:
      - platform-core_default

networks:
  platform-core_default:
    external: true

volumes:
  analytics_data:
  pg_referral:
  pg_verification:
  pg_sharing:
  pg_audit:
