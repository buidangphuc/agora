  team-notification:
    build:
      context: ./team-notification
      dockerfile: Dockerfile
    image: team-notification:local
    container_name: team-notification-svc
    depends_on:
      team-notification-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://notification_svc:notification_pass@postgres-notification:5432/notification_db?sslmode=disable
