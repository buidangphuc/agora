- id: referral.invite-attribution-works-end-to-end-through-the-chain
  title: Invite attribution works end to end through the chain
  persona: buyer
  priority: P1
  summary: Invite attribution works end to end through the chain (change referral-attribution-reward).
  entry_route: /account/referral
  services:
  - team-referral
  - team-identity
  - team-order
  - team-gateway
  acceptance:
  - Given an inviter with a referral code
  - When a visitor registers through the gateway with that code
  - Then ReferralAttributed is observed on referral.events within 10 seconds
  - And after the invitee completes a first order the inviter's GetMyReferral shows pending_xu 10000 and released_xu 0
  - And the reward is listed as PENDING
  tags:
  - referral-service
  status: automated
  covered_by: "referral/referral_reward.feature::Invite attribution works end to end through the chain"
- id: referral.a-sweep-releases-within-twice-the-interval
  title: A sweep releases within twice the interval
  persona: buyer
  priority: P1
  summary: A sweep releases within twice the interval (change referral-attribution-reward).
  entry_route: /account/referral
  services:
  - team-referral
  - team-identity
  - team-order
  - team-gateway
  acceptance:
  - Given the stack runs with REFERRAL_RELEASE_SWEEP_INTERVAL=1s and RETURN_WINDOW=3s
  - When the invitee's first order completes
  - Then released_xu is 10000 within the return window plus 2 seconds
  - And pending_xu is 0, rewards_total is 10000 and the list row is RELEASED
  - And one ReferralRewardReleased of 10000 xu is on referral.events
  tags:
  - referral-service
  status: automated
  covered_by: "referral/referral_reward.feature::A sweep releases within twice the interval"
- id: referral.a-return-before-release-voids-the-reward-and-the-next-order-qualifies
  title: A return before release voids the reward and the next order qualifies
  persona: buyer
  priority: P1
  summary: A return before release voids the reward and the next order qualifies (change referral-attribution-reward).
  entry_route: /account/referral
  services:
  - team-referral
  - team-identity
  - team-order
  - team-gateway
  acceptance:
  - Given an invitee whose first order created a pending reward
  - When the invitee requests a return on that order
  - Then the inviter's pending_xu is 0 and no reward is listed
  - And when the invitee completes a new order a new PENDING reward of 10000 xu exists
  tags:
  - referral-service
  status: automated
  covered_by: "referral/referral_reward.feature::A return before release voids the reward and the next order qualifies"
- id: referral.manual-redeem-is-accepted-for-a-new-account-and-credits-nothing
  title: Manual redeem is accepted for a new account and credits nothing
