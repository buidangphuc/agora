[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-featurestore"
version = "0.1.0"
description = "Batch feature materialisation (DuckDB over warehouse Parquet) to offline snapshots and Redis."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.20.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["featurestore*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# fixtures build naive UTC timestamps on purpose (the warehouse Parquet columns are naive TIMESTAMP)
"tests/*" = ["DTZ001"]
