# Feature manifest for team-promotion (vouchers + flash-sale — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-promotion
owner: promotion-team

features:
  - id: promotion.voucher-redeemed-at-checkout
    title: Buyer redeems a voucher at checkout
    persona: buyer
    priority: P0
    summary: A buyer applies a valid voucher code at checkout and pays the discounted total.
    entry_route: /checkout
    related_routes: ["/vouchers", /cart]
    services: [team-promotion, team-order]
    preconditions:
      login: buyer
      data: A shop/platform voucher exists and the cart meets its min-spend.
    api:
      exercised: [promotion.v1.ValidateAndReserve, promotion.v1.CommitReservation, order.v1.CreateOrder]
    ui:
      key_elements:
        voucher_input: 'input[name="voucher_code"]'
        apply_button: "role:button=Apply"
    acceptance:
      - Given a buyer is logged in with a qualifying cart
      - When the buyer applies a valid voucher code at checkout
      - Then the discount is applied and the order total is reduced
    tags: [buyer, promotion]
    status: automated
    covered_by: "promo/vouchers.feature::Buyer redeems a valid voucher at checkout"
    notes: "Also negative-path covered by 'Invalid voucher code is rejected at checkout' in the same feature file."

  - id: promotion.flash-sale-live-stock
    title: Flash-sale listing shows sale price and live stock
    persona: buyer
    priority: P1
    summary: A listing under an active flash-sale campaign shows the sale price and a live remaining-stock meter.
    entry_route: /listing/{listing_id}
    services: [team-promotion, team-domain]
    preconditions:
      login: guest
      data: An active flash-sale campaign exists for the listing.
    api:
      exercised: [promotion.v1.GetActiveFlashSale, promotion.v1.GetFlashSaleStock]
    ui:
      key_elements:
        flash_sale_meter: '[data-testid="flash-sale-stock"]'
    acceptance:
      - Given an active flash-sale campaign for a listing
      - When a buyer views the listing
      - Then the sale price and a live remaining-stock meter are shown
    tags: [buyer, promotion]
    status: automated
    covered_by: "promo/vouchers.feature::Flash-sale listing shows sale price and live remaining-stock meter"

  - id: promotion.buyer-previews-voucher-own-namespace
    title: A buyer previews a voucher under their own namespace
    persona: buyer
    priority: P0
    summary: >-
      A user ValidateAndReserve with reservation_id preview:<own id>:<code> succeeds as a preview.
    entry_route: /
    services: [team-promotion, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [promotion.v1.ValidateAndReserve]
    acceptance:
      - Given a logged-in buyer
      - When the buyer calls ValidateAndReserve with reservation_id preview:<own id>:<code>
      - Then the call succeeds and the discount is computed for that buyer
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A buyer previews a voucher under their own namespace"

  - id: promotion.buyer-cannot-reserve-outside-preview
    title: A buyer cannot hold a reservation outside the preview namespace
    persona: buyer
    priority: P0
    summary: >-
      A user reservation_id outside preview:<own id>: is refused with 403 (also another user's namespace); anonymous gets 401.
    entry_route: /
    services: [team-promotion, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [promotion.v1.ValidateAndReserve]
    acceptance:
      - Given a logged-in buyer
      - "When the buyer calls ValidateAndReserve with a reservation_id outside preview:<own id>:"
      - Then the gateway answers HTTP 403
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A buyer cannot hold a reservation outside the preview namespace"

  - id: promotion.voucher-checkout-completes-through-saga
    title: A voucher checkout still completes through the saga
    persona: buyer
    priority: P0
    summary: >-
      Checkout with a voucher and mock payment pays the discounted total and commits the redemption once.
    entry_route: /
    services: [team-promotion, team-order, team-payment, team-domain, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [order.v1.CreateOrder, promotion.v1.ValidateAndReserve, promotion.v1.CommitReservation, payment.v1.ProcessMockPayment]
    acceptance:
      - Given a buyer with a voucher-qualifying cart
      - When the buyer places the order with the voucher and pays
      - Then the order is paid with the voucher discount applied and the redemption is committed once
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A voucher checkout still completes through the saga"
    notes: >-
      Admin-created voucher with quota 5; asserts totalAmount and voucher.used==1.

  - id: promotion.buyer-cannot-subscribe-to-plan
    title: A buyer cannot subscribe to a seller plan
    persona: buyer
    priority: P0
    summary: >-
      Subscribe needs listing.write; a buyer gets 403.
    entry_route: /
    services: [team-promotion, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [promotion.v1.Subscribe]
    acceptance:
      - Given a logged-in buyer
      - When the buyer calls Subscribe
      - Then the gateway answers HTTP 403
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A buyer cannot subscribe to a seller plan"

  - id: promotion.seller-cannot-advertise-foreign-listing
    title: A seller cannot advertise another seller's listing
    persona: seller
    priority: P0
    summary: >-
      CreateAdCampaign requires listing ownership; another seller's listing is refused with 403.
    entry_route: /
    services: [team-promotion, team-domain, team-gateway]
    preconditions:
      login: seller
    api:
      exercised: [promotion.v1.CreateAdCampaign]
    acceptance:
      - Given two sellers and a listing owned by the first
      - When the second seller calls CreateAdCampaign for that listing
      - Then the gateway answers HTTP 403
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A seller cannot advertise another seller's listing"

  - id: promotion.oversized-ad-bid-rejected
    title: An oversized ad bid is rejected
    persona: seller
    priority: P0
    summary: >-
      A bid above MAX_AD_BID is refused with 400 while a normal bid on the same listing succeeds.
    entry_route: /
    services: [team-promotion, team-domain, team-gateway]
    preconditions:
      login: seller
    api:
      exercised: [promotion.v1.CreateAdCampaign]
    acceptance:
      - Given a seller with a listing
      - When the seller calls CreateAdCampaign with a bid above the maximum
      - Then the gateway answers HTTP 400
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::An oversized ad bid is rejected"

  - id: promotion.entitlements-not-readable-by-users
    title: A seller cannot read another seller's entitlements
    persona: seller
    priority: P0
    summary: >-
      GetEntitlements for another seller's id is refused with 403.
    entry_route: /
    services: [team-promotion, team-gateway]
    preconditions:
      login: seller
    api:
      exercised: [promotion.v1.GetEntitlements]
    acceptance:
      - Given two sellers
      - When the first seller calls GetEntitlements for the second seller
      - Then the gateway answers HTTP 403
    tags: [promotion, authz]
    status: automated
    covered_by: "security/promotion_access.feature::A seller cannot read another seller's entitlements"
    notes: >-
      A seller may read their own entitlements (the seller plans page relies on it); the spec was corrected to match.

