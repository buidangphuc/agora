    covered_by: "search/search_stock_read_model.feature::A checkout lowers the stock shown in search"
    notes: >-
      Feature: search/search_stock_read_model.feature::A checkout lowers the stock shown in search. Written from the spec before the code landed (red-first); see the run evidence in the e2e commit;
      the integrator flips this to automated once the code is merged and the scenario is green.

