owner: platform-ml-team
features:
- id: platform-finetune.import.history-is-kept-and-the-local-stack-is-dropped
  title: History is kept and the local stack is dropped
  persona: guest
  priority: P2
  summary: 'The finetune pipeline is imported with history as platform-finetune: History is kept and the
    local stack is dropped'
  entry_route: /
  services:
  - platform-finetune
  preconditions:
    login: guest
  acceptance:
  - When `git log --oneline -- platform-finetune` is run after the import
  - Then it lists more than one commit from the MLOps history, and `platform-finetune/ops/docker-compose.yml`
    does not exist
  tags:
  - platform-finetune
  - import
  - static
  status: not-testable
  notes: 'add-platform-finetune (The finetune pipeline is imported with history as platform-finetune):
    static e2e, no stack and no browser: platform-e2e/tests/e2e/static/test_pft_import.py::test_history_kept_and_local_stack_dropped
    (git, file, kustomize, compose, workflow reads). Not a .feature: nothing in it drives the gateway
    or the UI.'
