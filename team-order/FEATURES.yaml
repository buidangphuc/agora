    covered_by: order/return_refund_settlement.feature::Refunding a pending return is refused and emits nothing
    notes: payment-refund-model; green against the stack on 2026-10-08.

  - id: order.rrs-concurrent-refunds-of-one-return-emit-one-fact
    title: Concurrent refunds of one return emit one fact
    persona: seller
