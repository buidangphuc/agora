  - id: order.rrs-an-rma-refund-refunds-the-buyer-and-deducts-the-seller
    title: An RMA refund refunds the buyer and deducts the seller
    persona: seller
    priority: P1
    summary: An RMA refund refunds the buyer and deducts the seller
    entry_route: "/seller/orders/{order_id}"
    services: [team-order, team-payment, team-gateway]
    preconditions:
      login: seller
    acceptance:
      - Given a seller with a listing whose order pays 500000
      - And "b1" has paid an order of the listing and the seller is credited
      - And "b1" requests the return "R1" of 200000
      - When the seller approves the return "R1"
      - And the seller moves the return "R1" to REFUNDED
      - Then within the settle window the payment read by "b1" is PARTIALLY_REFUNDED with 200000 refunded
      - And the payment lists 1 RETURN refund whose source id is the return "R1"
      - And within the settle window the seller has exactly 1 REFUND_DEDUCTION of -200000 referencing the return "R1"
    tags: [order, fintech]
    status: automated
    covered_by: order/return_refund_settlement.feature::An RMA refund refunds the buyer and deducts the seller
    notes: payment-refund-model; green against the stack on 2026-10-08.

  - id: order.rrs-an-rma-refund-while-team-payment-is-stopped-is-applied-when
    title: An RMA refund while team-payment is stopped is applied when it restarts
    persona: seller
