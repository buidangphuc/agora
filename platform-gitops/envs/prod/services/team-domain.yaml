# Per-service, per-env overlay for team-domain in prod: prod-sized requests/limits for
# the listing write-model (gRPC). Hardened gRPC probes come from the baseline chart.
replicas: 2
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Strict-ENV boot guards: the service's own config reads ENV (not APP_ENV); "production"
# engages its IsProd() refusals (weak secrets, exposed tokens, ...). Never override with local.
env:
  ENV: "production"
