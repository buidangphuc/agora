# Invariant baseline for team-promotion — mirrors argocd/apps/team-promotion.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-promotion
image:
  repo: localhost:5001/team-promotion
containerPort: 50061
service:
  port: 50061
grpcPort: 50061          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
# ENV is required and has no default: each env overlay sets it (envs/<env>/services/
# team-promotion.yaml); the local app (argocd/apps/team-promotion.yaml) sets "local".
# KAFKA_BROKERS (and FLIPT_ADDR, when flags are enabled) are required in strict envs.
env:
  FEATURE_FLAGS_ENABLED: "false"
  FLIPT_ADDR: "flipt:9000"
  KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
  PROMOTION_EVENTS_TOPIC: "promotion.events"
  UPSTREAM_DOMAIN_ADDR: "team-domain:50051"
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50061; only the
# edge (team-gateway) and team-order (redemption) may reach it. Deployed envs only
# (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway, team-order]
