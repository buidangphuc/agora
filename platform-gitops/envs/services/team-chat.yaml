# Invariant baseline for team-chat — extracted verbatim from argocd/apps/team-chat.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-chat
image:
  repo: localhost:5001/team-chat
containerPort: 50057
service:
  port: 50057
grpcPort: 50057          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  ENV: "local"
  GRPC_PORT: "50057"
  OUTBOX_CLAIM_LOCK: "60s"
  KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
  KAFKA_CHAT_TOPIC: "chat.events"
  OUTBOX_POLL_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"
probes:
  livenessService: liveness
migrate:
  enabled: true
  command: [/server]
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50057; only the
# edge (team-gateway) may reach it. Deployed envs only (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway]
