# Invariant baseline for team-audit — mirrors argocd/apps/team-audit.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-audit
image:
  repo: localhost:5001/team-audit
containerPort: 50066
service:
  port: 50066
grpcPort: 50066          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50066; only the
# edge (team-gateway) and the services whose audited admin mutations write here
# (UPSTREAM_AUDIT_ADDR) may reach it. Deployed envs only (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway, team-domain, team-engagement, team-identity, team-order, team-payment, team-promotion, team-verification]
