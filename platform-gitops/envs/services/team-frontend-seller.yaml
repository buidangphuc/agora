name: team-frontend-seller
image:
  repo: localhost:5001/team-frontend-seller
  pullPolicy: Always
containerPort: 3001
service:
  port: 3001
healthPath: /login
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  GATEWAY_URL: "http://team-gateway:8080"
ingress:
  enabled: true
  host: seller.localtest.me
  path: /
