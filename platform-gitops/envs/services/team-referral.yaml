# Invariant baseline for team-referral — mirrors argocd/apps/team-referral.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-referral
image:
  repo: localhost:5001/team-referral
containerPort: 50062
service:
  port: 50062
grpcPort: 50062          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  ENV: "local"
  GRPC_PORT: "50062"
  KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
  IDENTITY_EVENTS_TOPIC: "identity.events"
  ORDER_EVENTS_TOPIC: "order.events"
  REFERRAL_EVENTS_TOPIC: "referral.events"
  REFERRAL_IDENTITY_CONSUMER_GROUP: "team-referral-identity"
  REFERRAL_ORDER_CONSUMER_GROUP: "team-referral-order"
  REFERRAL_IDENTITY_DLQ_TOPIC: "referral.identity.dlq"
  REFERRAL_ORDER_DLQ_TOPIC: "referral.order.dlq"
  OUTBOX_POLL_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_CLAIM_LOCK: "60s"
  REFERRAL_REWARD_XU: "10000"
  REFERRAL_DAILY_CAP: "5"
  REFERRAL_LIFETIME_CAP: "50"
  REFERRAL_REDEEM_MAX_ACCOUNT_AGE: "168h"
  REFERRAL_RELEASE_SWEEP_INTERVAL: "1m"
  REFERRAL_CAP_TIMEZONE: "Asia/Ho_Chi_Minh"
probes:
  livenessService: liveness
migrate:
  enabled: true
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50062; only the
# edge (team-gateway) may reach it. Deployed envs only (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway]
