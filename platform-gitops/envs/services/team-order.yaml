# Invariant baseline for team-order — extracted verbatim from argocd/apps/team-order.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-order
image:
  repo: localhost:5001/team-order
containerPort: 50055
service:
  port: 50055
grpcPort: 50055          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  UPSTREAM_PROMOTION_ADDR: "team-promotion:50061"
  FLIPT_ADDR: "flipt:9000"
  FEATURE_FLAGS_ENABLED: "true"
  UPSTREAM_DOMAIN_ADDR: "team-domain:50051"
  UPSTREAM_IDENTITY_ADDR: "team-identity:50053"
  # PaymentSettled consumer (AD4/AD1) + order.events outbox relayer (ADR-0013).
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
  PAYMENT_EVENTS_TOPIC: "payment.events"
  ORDER_PAYMENT_CONSUMER_GROUP: "team-order.payment"
  PAYMENT_EVENTS_DLQ_TOPIC: "payment.events.dlq"
  ORDER_EVENTS_TOPIC: "order.events"
  OUTBOX_ENABLED: "true"
  OUTBOX_POLL_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_CLAIM_LOCK_SECONDS: "60"
  OUTBOX_MAX_ATTEMPTS: "10"
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50055; only the
# edge (team-gateway) may reach OrderService/CartService. Payment→order is now
# event-carried (AD4), so team-payment is NOT a gRPC peer here. Deployed envs only
# (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway]
