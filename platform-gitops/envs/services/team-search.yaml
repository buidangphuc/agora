# Invariant baseline for team-search — extracted verbatim from argocd/apps/team-search.yaml
# (the per-service inline block). Shared across envs; env overlays layer on top.
# image.repo/pullPolicy are re-set per-env by the ApplicationSet.
name: team-search
image:
  repo: localhost:5001/team-search
containerPort: 50052
service:
  port: 50052
grpcPort: 50052          # native gRPC health probes (grpc.health.v1.Health)
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
env:
  ENV: "local"
  # Saved searches in Postgres; ENV=staging/production refuses to boot with the
  # in-memory fallback (DATABASE_ENABLED defaults to false in team-search).
  MODEL_SERVER_URL: "http://modelserve-router.marketplace.svc:8100"
  ENABLE_RERANKER: "true"
probes:
  livenessService: liveness
migrate:
  enabled: true
secrets:
  enabled: true
# Zero-trust interim (ADR-0010, SA-H4): default-deny ingress to :50052; only the
# edge (team-gateway) may query. Deployed envs only (local exempt per ADR-0010).
networkPolicy:
  enabled: true
  allowFrom: [team-gateway]
