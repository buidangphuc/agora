# Per-image tags for the `staging` environment (mirrors envs/local/values.yaml's shape).
# CI bumps these (yq) on each build the same way it bumps local; ArgoCD syncs them.
# The ApplicationSet composes image.repo as `<global.registry>/<service>` per env, so
# the registry below is what staging pulls from.
global:
  registry: staging-registry.example.com
  imagePullPolicy: IfNotPresent
images:
  team-identity: 01a53993082a
  team-domain: 01a53993082a
  team-search: 01a53993082a
  team-engagement: 01a53993082a
  team-order: 01a53993082a
  team-payment: 01a53993082a
  team-chat: 01a53993082a
  team-notification: 01a53993082a
  team-gateway: 01a53993082a
  team-frontend: 01a53993082a
  team-ai: 01a53993082a
  search-indexer: 01a53993082a
