# Per-image tags for the `staging` environment (mirrors envs/local/values.yaml's shape).
# CI bumps these (yq) on each build the same way it bumps local; ArgoCD syncs them.
# The ApplicationSet composes image.repo as `<global.registry>/<service>` per env, so
# the registry below is what staging pulls from.
global:
  registry: staging-registry.example.com
  imagePullPolicy: IfNotPresent
images:
  team-identity: d0d0d0d0d0d0
  team-domain: d0d0d0d0d0d0
  team-search: d0d0d0d0d0d0
  team-engagement: d0d0d0d0d0d0
  team-order: d0d0d0d0d0d0
  team-payment: d0d0d0d0d0d0
  team-chat: d0d0d0d0d0d0
  team-notification: d0d0d0d0d0d0
  team-gateway: d0d0d0d0d0d0
  team-frontend: d0d0d0d0d0d0
  team-ai: d0d0d0d0d0d0
  search-indexer: d0d0d0d0d0d0
