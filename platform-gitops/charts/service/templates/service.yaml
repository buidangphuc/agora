apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
    {{- if and .Values.grpcPort (ne (int .Values.grpcPort) (int .Values.service.port)) }}
    - name: grpc
      port: {{ .Values.grpcPort }}
      targetPort: {{ .Values.grpcPort }}
    {{- end }}
    {{- if .Values.jwksPort }}
    - name: jwks
      port: {{ .Values.jwksPort }}
      targetPort: {{ .Values.jwksPort }}
    {{- end }}
