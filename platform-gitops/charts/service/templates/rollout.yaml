{{- if .Values.rollout.enabled }}
# Argo Rollouts canary (add-canary-deploys). Rendered INSTEAD of the Deployment
# when rollout.enabled. Same pod/container spec as the Deployment (service.podSpec)
# so the two shapes never drift. No static `replicas` — the HPA owns replica count
# (hpa.yaml points its scaleTargetRef at this Rollout). Basic replica-weighted
# canary (no service mesh): each setWeight is approximated by canary/stable replica
# counts. An `analysis: true` step is expanded into an AnalysisRun against this
# service's AnalysisTemplate (<name>-canary); a threshold breach auto-rolls-back.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- include "service.podSpec" . | nindent 6 }}
  strategy:
    canary:
      steps:
        {{- range .Values.rollout.canary.steps }}
        {{- if kindIs "map" . }}
        {{- if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ $.Values.name }}-canary
            args:
              - name: service
                value: {{ $.Values.rollout.analysis.service | default $.Values.name | quote }}
        {{- else }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
