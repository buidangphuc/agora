{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vaultServer }}
      path: {{ .Values.secrets.vaultKvPath }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.name }}
          serviceAccountRef:
            name: {{ .Values.name }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.name }}
    kind: SecretStore
  target:
    name: {{ .Values.name }}-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.name }}/config
  {{- if .Values.secrets.jwtShared }}
  # RS256 issuer key (ADR-0006): the PRIVATE key + kid, read only by team-identity.
  # The gateway sets secrets.jwtShared=false and uses a plain JWKS_URL (no secret).
  data:
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: shared/jwt
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_KID
      remoteRef:
        key: shared/jwt
        property: JWT_KID
  {{- end }}
{{- end }}
