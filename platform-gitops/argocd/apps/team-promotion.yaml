apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-promotion
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-promotion
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-promotion
          image:
            repo: localhost:5001/team-promotion
          containerPort: 50061
          service:
            port: 50061
          grpcPort: 50061          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            ENV: "local"          # required, no default; deployed envs set it in envs/<env>/services/
            FEATURE_FLAGS_ENABLED: "false"
            FLIPT_ADDR: "flipt:9000"
            GRPC_PORT: "50061"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            PROMOTION_EVENTS_TOPIC: "promotion.events"
            UPSTREAM_DOMAIN_ADDR: "team-domain:50051"
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
