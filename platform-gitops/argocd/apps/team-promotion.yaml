apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-promotion
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-promotion
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-promotion
          image:
            repo: localhost:5001/team-promotion
          containerPort: 50061
          service:
            port: 50061
          grpcPort: 50061          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            ENV: "local"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            FLIPT_ADDR: "flipt:9000"
            FEATURE_FLAGS_EVAL_TIMEOUT: "500ms"
            # team-audit sink: audited admin mutations fail closed (Unavailable) when unset.
            UPSTREAM_AUDIT_ADDR: "team-audit:50066"   # same as envs/services
            GRPC_PORT: "50061"
            PROMOTION_EVENTS_TOPIC: "promotion.events"
            UPSTREAM_DOMAIN_ADDR: "team-domain:50051"
            UPSTREAM_ORDER_ADDR: "team-order:50055"
            UPSTREAM_ORDER_TIMEOUT: "500ms"
            NEW_USER_WELCOME_AMOUNT: "20000"
            NEW_USER_INVITED_AMOUNT: "30000"
            NEW_USER_MIN_SPEND: "100000"
            NEW_USER_VOUCHER_TTL: "336h"
            NEW_USER_VERDICT_TIMEOUT: "30m"
            NEW_USER_VERDICT_SWEEP_INTERVAL: "1m"
            VOUCHER_RESERVATION_TTL: "15m"
          probes:
            livenessService: liveness
          migrate:
            enabled: true
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
