apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-identity
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-identity
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-identity
          image:
            repo: localhost:5001/team-identity
          containerPort: 50053
          service:
            port: 50053
          grpcPort: 50053          # native gRPC health probes (grpc.health.v1.Health)
          jwksPort: 50063          # second Service+container port so the edge can reach http://team-identity:50063/.well-known/jwks.json (ADR-0006)
          env:
            JWKS_HTTP_PORT: "50063"   # serves GET /.well-known/jwks.json (public keys; ADR-0006)
            # SessionRevoked outbox relayer (ADR-0003 addendum): publishes to identity.events.
            KAFKA_ENABLED: "true"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            IDENTITY_EVENTS_TOPIC: "identity.events"
            OUTBOX_ENABLED: "true"
            OUTBOX_POLL_INTERVAL: "1s"
            OUTBOX_BATCH_SIZE: "100"
            OUTBOX_CLAIM_LOCK_SECONDS: "60"
            OUTBOX_MAX_ATTEMPTS: "10"
            # First-admin seed is intentionally NOT configured here (default off; enforced by
            # scripts/check_identity_seed.py). Create the first admin out of band.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          secrets:
            enabled: true      # DATABASE_URL + JWT from Vault (svc/team-identity + shared/jwt)
            jwtShared: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
