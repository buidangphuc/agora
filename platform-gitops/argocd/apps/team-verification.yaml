apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-verification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-verification
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-verification
          image:
            repo: localhost:5001/team-verification
          containerPort: 50064
          service:
            port: 50064
          grpcPort: 50064          # native gRPC health probes (grpc.health.v1.Health)
          env:
            GRPC_PORT: "50064"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
