apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: featurestore
  namespace: argocd
  annotations:
    # Scheduled batch (PVC + CronJob + NetworkPolicy): same post-infra slot as platform-recsys.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
    targetRevision: main
    path: platform/featurestore
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
