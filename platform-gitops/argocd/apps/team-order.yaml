apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-order
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-order
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-order
          image:
            repo: localhost:5001/team-order
          containerPort: 50055
          service:
            port: 50055
          grpcPort: 50055          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            UPSTREAM_PROMOTION_ADDR: "team-promotion:50061"
            UPSTREAM_DOMAIN_ADDR: "team-domain:50051"
            UPSTREAM_IDENTITY_ADDR: "team-identity:50053"
            # PaymentSettled consumer (AD4/AD1) + order.events outbox relayer (ADR-0013).
            KAFKA_ENABLED: "true"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            PAYMENT_EVENTS_TOPIC: "payment.events"
            ORDER_PAYMENT_CONSUMER_GROUP: "team-order.payment"
            PAYMENT_EVENTS_DLQ_TOPIC: "payment.events.dlq"
            ORDER_EVENTS_TOPIC: "order.events"
            OUTBOX_ENABLED: "true"
            OUTBOX_POLL_INTERVAL: "1s"
            OUTBOX_BATCH_SIZE: "100"
            OUTBOX_CLAIM_LOCK_SECONDS: "60"
            OUTBOX_MAX_ATTEMPTS: "10"
            FLIPT_ADDR: "flipt:9000"
            FEATURE_FLAGS_ENABLED: "true"
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
