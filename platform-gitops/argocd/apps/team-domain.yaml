apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-domain
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-domain
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-domain
          image:
            repo: localhost:5001/team-domain
          containerPort: 50051
          service:
            port: 50051
          grpcPort: 50051          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            ENV: "local"
            GRPC_PORT: "50051"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            # team-audit sink: audited admin mutations fail closed (Unavailable) when unset.
            UPSTREAM_AUDIT_ADDR: "team-audit:50066"   # same as envs/services
            UPSTREAM_AI_ADDR: "team-ai:50060"   # listing screening; unset => pending_review
            KAFKA_IDENTITY_TOPIC: "identity.events"
          probes:
            livenessService: liveness
          migrate:
            enabled: true
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
