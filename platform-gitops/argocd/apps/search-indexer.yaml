apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-indexer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
    targetRevision: main
    path: platform/search-indexer
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
