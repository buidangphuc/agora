apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-postgres-backup
  namespace: argocd
  annotations:
    # After postgres + minio (wave 0), same slot as other post-infra workloads.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
    targetRevision: main
    path: platform/backup
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
