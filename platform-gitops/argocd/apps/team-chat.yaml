apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-chat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-chat
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-chat
          image:
            repo: localhost:5001/team-chat
          containerPort: 50057
          service:
            port: 50057
          grpcPort: 50057          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            KAFKA_ENABLED: "true"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            KAFKA_CHAT_TOPIC: "chat.events"
            OUTBOX_ENABLED: "true"
            OUTBOX_POLL_INTERVAL: "1s"
            OUTBOX_BATCH_SIZE: "100"
            OUTBOX_CLAIM_LOCK_SECONDS: "60"
            OUTBOX_MAX_ATTEMPTS: "10"
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
