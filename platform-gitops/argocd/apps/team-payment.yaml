apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-payment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-payment
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-payment
          image:
            repo: localhost:5001/team-payment
          containerPort: 50056
          service:
            port: 50056
          grpcPort: 50056          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          secrets:
            enabled: true
          env:
            MOCK_PAYMENTS: "true"   # local kind only; refused at boot in staging/prod
            # payment.events relayer + order.events settlement consumer
            KAFKA_ENABLED: "true"
            KAFKA_BROKERS: "redpanda.marketplace.svc:9092"
            PAYMENT_EVENTS_TOPIC: "payment.events"
            ORDER_EVENTS_TOPIC: "order.events"
            PAYMENT_SETTLEMENT_CONSUMER_ENABLED: "true"
            PAYMENT_SETTLEMENT_CONSUMER_GROUP: "team-payment.settlement"
            PAYMENT_SETTLEMENT_DLQ_TOPIC: "order.events.payment-settlement.dlq"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
