apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-notification
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace
  sources:
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      ref: values
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/ci/platform-gitops.git
      targetRevision: main
      path: charts/service
      helm:
        releaseName: team-notification
        valueFiles:
          - $values/envs/local/values.yaml
        values: |
          name: team-notification
          image:
            repo: localhost:5001/team-notification
          containerPort: 50058
          service:
            port: 50058
          grpcPort: 50058          # native gRPC health probes (grpc.health.v1.Health)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            KAFKA_ENABLED: "true"
            LISTING_EVENTS_TOPIC: "listing.events"
            NOTIFICATION_LISTING_CONSUMER_GROUP: "team-notification.listing"
            LISTING_EVENTS_DLQ_TOPIC: "listing.events.dlq"
          secrets:
            enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
