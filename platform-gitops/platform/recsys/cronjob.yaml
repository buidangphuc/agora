# platform-recsys — offline ALS training job. A SCHEDULED batch (CronJob), not a
# Deployment/Service: it has no request-serving surface. It trains only from the
# governed als_interactions dataset built by platform-featurestore (ADR-0015,
# featurestore-datasets) and writes its own artifact stores — item/user vectors into Qdrant
# (:6333, the instance team-ai targets) and a precomputed Top-N cache into Redis
# (:6379). Mirrors the postgres-backup CronJob shape (schedule + concurrency
# guard + history limits); mirrors the team-analytics worker in having NO
# Service/Ingress/NetworkPolicy.
#
# Non-secret job config. Schedule is duplicated on CronJob.spec.schedule (a static
# field that cannot read a ConfigMap) — keep the two in sync when changing cadence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recsys-config
  namespace: marketplace
data:
  SCHEDULE: "0 3 * * *"          # nightly 03:00 UTC (after postgres-backup at 02:00)
  # Governed training dataset (featurestore-datasets). The job refuses to start
  # (exit 2) when no dataset exists here; it never falls back to raw events.
  DATASET_DIR: "/features/datasets/als_interactions/v1"
  # Freshness guard (init container below): training is refused when the newest dataset
  # snapshot is older than this. 25 h for a nightly featurestore run.
  MAX_DATASET_AGE_MINUTES: "1500"
  # Artifact stores (shared infra service names in the marketplace namespace).
  QDRANT_URL: "http://qdrant:6333"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Cache/collection contract — MUST match serve-recommendations-teamai.
  QDRANT_ITEM_COLLECTION: "item_als_vectors"
  QDRANT_USER_COLLECTION: "user_als_vectors"
  RECS_CACHE_PREFIX: "recs"
  RECS_SCHEMA_VERSION: "v1"
  RECS_CACHE_TTL_SECONDS: "172800"   # 48h > nightly cadence
  # ALS hyperparameters (tunable defaults). The interaction window and event
  # weights live in the dataset definition (platform-featurestore registry).
  ALS_RANK: "64"
  ALS_REG_PARAM: "0.05"
  ALS_ALPHA: "40.0"
  ALS_MAX_ITER: "15"
  TOP_N: "50"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-recsys
  namespace: marketplace
spec:
  schedule: "0 3 * * *"          # nightly 03:00 UTC — mirrors recsys-config.SCHEDULE
  concurrencyPolicy: Forbid       # idempotent per model_version; never overlap runs
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: platform-recsys }
        spec:
          restartPolicy: Never
          initContainers:
            # Fail closed on an absent OR stale dataset: succeed only if a snapshot exists
            # under DATASET_DIR that is newer than MAX_DATASET_AGE_MINUTES.
            - name: dataset-fresh
              image: busybox:1.36
              envFrom:
                - configMapRef: { name: recsys-config }
              command:
                - sh
                - -c
                - |
                  if find "$DATASET_DIR" -name 'as_of=*.parquet' -mmin "-$MAX_DATASET_AGE_MINUTES" 2>/dev/null | grep -q .; then
                    echo "dataset fresh under $DATASET_DIR"
                  else
                    echo "no dataset newer than ${MAX_DATASET_AGE_MINUTES} min under DATASET_DIR=$DATASET_DIR; refusing to train" >&2
                    exit 2
                  fi
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              volumeMounts:
                - { name: featurestore-data, mountPath: /features, readOnly: true }
          containers:
            - name: recsys-train
              image: localhost:5001/platform-recsys:local
              # The image ENTRYPOINT is `python -m recsys` (the batch job itself).
              envFrom:
                - configMapRef: { name: recsys-config }
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - { name: featurestore-data, mountPath: /features, readOnly: true }
          volumes:
            # Written nightly by the featurestore CronJob (platform/featurestore), mounted
            # read-only here. Until its first successful run the directory is empty and
            # training is refused, which is the intended fail-closed state.
            - name: featurestore-data
              persistentVolumeClaim: { claimName: featurestore-data, readOnly: true }
