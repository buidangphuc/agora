apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../search-indexer
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: team-search-indexer
        namespace: marketplace
      spec:
        template:
          spec:
            containers:
              - name: indexer
                env:
                  - name: ENV
                    value: "production"
