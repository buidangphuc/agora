# Credentials for MLflow (backend DB + S3 artifact store) come from Vault, never from git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: marketplace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: mlflow
  namespace: marketplace
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: svc
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: mlflow
          serviceAccountRef:
            name: mlflow
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow
  namespace: marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mlflow
    kind: SecretStore
  target:
    name: mlflow-env
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: mlflow/db, property: POSTGRES_USER }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: mlflow/db, property: POSTGRES_PASSWORD }
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: mlflow/s3, property: AWS_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: mlflow/s3, property: AWS_SECRET_ACCESS_KEY }
