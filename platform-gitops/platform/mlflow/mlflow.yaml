# MLflow tracking server + model registry (ClusterIP only, no Ingress).
# Backend store: postgres-mlflow. Artifacts: s3://mlflow-artifacts on in-cluster MinIO,
# proxied by the server (--artifacts-destination). Credentials come from the ExternalSecret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: marketplace
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      containers:
        - name: mlflow
          # built from platform-core/infra/mlflow/Dockerfile (mlflow 3.2.0 + psycopg2 + boto3)
          image: localhost:5001/platform-mlflow
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec mlflow server --host 0.0.0.0 --port 5050
              --backend-store-uri "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-mlflow.marketplace.svc:5432/mlflow"
              --artifacts-destination s3://mlflow-artifacts
              --serve-artifacts
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.marketplace.svc:9000"
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: mlflow-env, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: mlflow-env, key: POSTGRES_PASSWORD } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: mlflow-env, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: mlflow-env, key: AWS_SECRET_ACCESS_KEY } }
          ports:
            - { name: http, containerPort: 5050 }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 5050 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5050 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: marketplace
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - { name: http, port: 5050, targetPort: 5050 }
---
# Only trainer pods may reach the tracking server (plus prometheus for scraping).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-isolation
  namespace: marketplace
spec:
  podSelector:
    matchLabels:
      app: mlflow
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: platform-recsys
        # The finetune slice does not exist yet: its trainer pods must carry this label.
        - podSelector:
            matchLabels:
              app: platform-finetune
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 5050
---
# Only mlflow may reach its Postgres backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-mlflow-isolation
  namespace: marketplace
spec:
  podSelector:
    matchLabels:
      app: postgres-mlflow
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5432
