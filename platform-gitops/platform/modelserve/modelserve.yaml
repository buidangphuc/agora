# platform-modelserve — Internal ML model serving router + TEI / vLLM runtimes (ADR-0011).
# Reconciled by the platform-modelserve ArgoCD Application (path platform/modelserve, kustomize, sync-wave 0).
# Runtimes are the deterministic tei-fake image from the local registry (no model download, no volume).
# Ingress to the router (:8100) is restricted via NetworkPolicy so only team-ai and team-search (+ its indexer) can reach it.

# ── 1. ModelServe Router (Port :8100) ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelserve-router
  namespace: marketplace
  labels:
    app: modelserve-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modelserve-router
  template:
    metadata:
      labels:
        app: modelserve-router
    spec:
      containers:
        - name: router
          image: localhost:5001/platform-modelserve
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: ROUTER_PORT
              value: "8100"
            - name: TEI_EMBED_URL
              value: "http://tei-embed.marketplace.svc:8101"
            - name: TEI_RERANK_URL
              value: "http://tei-rerank.marketplace.svc:8102"
            # No vLLM on the local cluster: tei-fake also serves /v1/chat/completions, as in compose.
            - name: VLLM_URL
              value: "http://tei-embed.marketplace.svc:8101"
            # Embedding cache on DB 4, as in compose: DB 0 is the recsys nearline CTR store team-ai reads.
            - name: REDIS_URL
              value: "redis://valkey.marketplace.svc:6379/4"
            - name: EMBED_CACHE_ENABLED
              value: "true"
            - name: MODEL_VERSION
              value: "tei-fake-v1"  # as in compose; the embedding cache keys on it
            - name: MAX_QUEUE_DEPTH
              value: "100"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: modelserve-router
  namespace: marketplace
  labels:
    app: modelserve-router
spec:
  selector:
    app: modelserve-router
  ports:
    - name: http
      port: 8100
      targetPort: 8100
---
# ── 2. TEI Embed Runtime (Port :8101) ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-embed
  namespace: marketplace
  labels:
    app: tei-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-embed
  template:
    metadata:
      labels:
        app: tei-embed
    spec:
      containers:
        - name: tei-embed
          image: localhost:5001/tei-fake
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "8101"]
          ports:
            - name: http
              containerPort: 8101
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8101
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8101
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tei-embed
  namespace: marketplace
  labels:
    app: tei-embed
spec:
  selector:
    app: tei-embed
  ports:
    - name: http
      port: 8101
      targetPort: 8101
---
# ── 3. TEI Rerank Runtime (Port :8102) ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-rerank
  namespace: marketplace
  labels:
    app: tei-rerank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-rerank
  template:
    metadata:
      labels:
        app: tei-rerank
    spec:
      containers:
        - name: tei-rerank
          image: localhost:5001/tei-fake
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "8102"]
          ports:
            - name: http
              containerPort: 8102
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8102
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8102
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tei-rerank
  namespace: marketplace
  labels:
    app: tei-rerank
spec:
  selector:
    app: tei-rerank
  ports:
    - name: http
      port: 8102
      targetPort: 8102
---
# ── 4. NetworkPolicy: Service-to-Service Zero-Trust (ADR-0010 / ADR-0011) ─────
# Internal isolation: only team-ai, team-search, team-search-indexer and prometheus can access modelserve-router :8100.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelserve-router-isolation
  namespace: marketplace
spec:
  podSelector:
    matchLabels:
      app: modelserve-router
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: team-ai
        - podSelector:
            matchLabels:
              app: team-search
        - podSelector:
            matchLabels:
              app: team-search-indexer
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8100
