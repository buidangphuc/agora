apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-analytics
  namespace: marketplace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: team-analytics
  namespace: marketplace
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: svc
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: team-analytics
          serviceAccountRef:
            name: team-analytics
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: team-analytics
  namespace: marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: team-analytics
    kind: SecretStore
  target:
    name: team-analytics-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: team-analytics/config
