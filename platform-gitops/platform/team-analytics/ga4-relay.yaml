# team-analytics GA4 purchase relay (cmd/ga4-relay) — a Kafka-consumer WORKER that reads
# order.events and relays paid orders to GA4 as server-side purchase events. No inbound
# endpoint beyond the 8085 probe port: no Ingress, no Service. Retries-exhausted records park
# on analytics.ga4-relay.dlq (created by platform/infra/redpanda.yaml, owner team-analytics).
# GA4_API_SECRET / GA4_MEASUREMENT_ID come from the ExternalSecret below, never from git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ga4-relay
  namespace: marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ga4-relay
    kind: SecretStore
  target:
    name: ga4-relay-env
    creationPolicy: Owner
  data:
    - secretKey: GA4_API_SECRET
      remoteRef: { key: ga4-relay/config, property: GA4_API_SECRET }
    - secretKey: GA4_MEASUREMENT_ID
      remoteRef: { key: ga4-relay/config, property: GA4_MEASUREMENT_ID }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ga4-relay
  namespace: marketplace
spec:
  replicas: 1
  selector:
    matchLabels: { app: ga4-relay }
  template:
    metadata:
      labels: { app: ga4-relay }
    spec:
      containers:
        - name: ga4-relay
          image: localhost:5001/team-analytics
          command: ["/ga4-relay"]
          env:
            - { name: KAFKA_BROKERS, value: "redpanda:9092" }
            - { name: KAFKA_ORDER_TOPIC, value: "order.events" }
            - { name: GA4_RELAY_CONSUMER_GROUP, value: "team-analytics.ga4-relay" }
            - { name: GA4_RELAY_DLQ_TOPIC, value: "analytics.ga4-relay.dlq" }
            - { name: WAREHOUSE_DRIVER, value: "duckdb" }
            - { name: GA4_RELAY_PROBE_PORT, value: "8085" }
            - name: GA4_API_SECRET
              valueFrom: { secretKeyRef: { name: ga4-relay-env, key: GA4_API_SECRET } }
            - name: GA4_MEASUREMENT_ID
              valueFrom: { secretKeyRef: { name: ga4-relay-env, key: GA4_MEASUREMENT_ID } }
          ports:
            - { name: health, containerPort: 8085 }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 5
