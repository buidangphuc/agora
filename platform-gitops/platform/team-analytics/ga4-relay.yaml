# team-analytics GA4 purchase relay (cmd/ga4-relay) — a Kafka-consumer WORKER that reads
# order.events and relays paid orders to GA4 as server-side purchase events. No inbound
# endpoint beyond the 8085 probe port: no Ingress, no Service. Retries-exhausted records park
# on analytics.ga4-relay.dlq (created by platform/infra/redpanda.yaml, owner team-analytics).
# GA4_API_SECRET / GA4_MEASUREMENT_ID come from the ExternalSecret below, never from git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ga4-relay
  namespace: marketplace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ga4-relay
  namespace: marketplace
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: svc
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ga4-relay
          serviceAccountRef:
            name: ga4-relay
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ga4-relay
  namespace: marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ga4-relay
    kind: SecretStore
  target:
    name: ga4-relay-env
    creationPolicy: Owner
  data:
    - secretKey: GA4_API_SECRET
      remoteRef: { key: ga4-relay/config, property: GA4_API_SECRET }
    - secretKey: GA4_MEASUREMENT_ID
      remoteRef: { key: ga4-relay/config, property: GA4_MEASUREMENT_ID }
---
# Own volume: the relay's DuckDB state (ga4_relay_sent, ga4_relay_client_map) must survive
# restarts, and the consumer's analytics-data DuckDB file is exclusively locked by that pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ga4-relay-data, namespace: marketplace }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ga4-relay
  namespace: marketplace
spec:
  replicas: 1
  strategy: { type: Recreate, rollingUpdate: null }   # RWO volume + DuckDB file lock
  selector:
    matchLabels: { app: ga4-relay }
  template:
    metadata:
      labels: { app: ga4-relay }
    spec:
      serviceAccountName: ga4-relay
      containers:
        - name: ga4-relay
          image: localhost:5001/team-analytics
          command: ["/ga4-relay"]
          env:
            - { name: KAFKA_BROKERS, value: "redpanda:9092" }
            - { name: KAFKA_ORDER_TOPIC, value: "order.events" }
            - { name: GA4_RELAY_CONSUMER_GROUP, value: "team-analytics.ga4-relay" }
            - { name: GA4_RELAY_DLQ_TOPIC, value: "analytics.ga4-relay.dlq" }
            - { name: WAREHOUSE_DRIVER, value: "duckdb" }
            - { name: DUCKDB_PATH, value: "/data/ga4-relay.duckdb" }
            - { name: GA4_RELAY_PROBE_PORT, value: "8085" }
            - name: GA4_API_SECRET
              valueFrom: { secretKeyRef: { name: ga4-relay-env, key: GA4_API_SECRET } }
            - name: GA4_MEASUREMENT_ID
              valueFrom: { secretKeyRef: { name: ga4-relay-env, key: GA4_MEASUREMENT_ID } }
          ports:
            - { name: health, containerPort: 8085 }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: ga4-relay-data, mountPath: /data }
      volumes:
        - name: ga4-relay-data
          persistentVolumeClaim: { claimName: ga4-relay-data }
