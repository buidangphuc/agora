# team-analytics warehouse writer (cmd/consumer) — a Kafka-consumer WORKER that
# reads analytics.events from Redpanda and appends TrackingEvents to the analytics
# warehouse (DuckDB local / BigQuery prod) behind the WarehouseWriter seam.
# Worker variant: Deployment + a ClusterIP Service for the gRPC read API (the gateway
# cockpit's real orders, ops-cockpit-real-data); no Ingress/NetworkPolicy — otherwise
# mirrors the platform/search-indexer consumer precedent. A CPU request is declared so the
# HPA/KEDA path stays usable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: analytics-data, namespace: marketplace }
spec:
  accessModes: ["ReadWriteOnce"]   # the featurestore CronJob reads it on the same node
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-analytics
  namespace: marketplace
spec:
  replicas: 1
  # DuckDB holds a file lock on the RWO analytics-data volume: a rolling update's new pod
  # cannot open it while the old one runs, so replace instead of surge.
  strategy: { type: Recreate, rollingUpdate: null }
  selector:
    matchLabels: { app: team-analytics }
  template:
    metadata:
      labels: { app: team-analytics }
    spec:
      containers:
        - name: consumer
          image: localhost:5001/team-analytics
          env:
            - { name: KAFKA_ENABLED, value: "true" }
            - { name: KAFKA_BROKERS, value: "redpanda:9092" }
            - { name: KAFKA_ANALYTICS_TOPIC, value: "analytics.events" }
            - { name: KAFKA_ORDER_TOPIC, value: "order.events" }
            - { name: ENGAGEMENT_EVENTS_TOPIC, value: "engagement.events" }
            - { name: ENGAGEMENT_DLQ_TOPIC, value: "engagement.events.analytics.dlq" }
            - { name: ENGAGEMENT_CONSUMER_GROUP, value: "team-analytics.engagement" }
            - { name: KAFKA_CONSUMER_GROUP, value: "team-analytics" }
            - { name: WAREHOUSE_DRIVER, value: "duckdb" }
            - { name: DUCKDB_PATH, value: "/data/analytics.duckdb" }
            # Parquet exports (tracking_events_resolved, engagement_facts, order_facts) land
            # beside this path on the analytics-data PVC; the featurestore CronJob reads them.
            - { name: PARQUET_EXPORT_PATH, value: "/data/tracking_events.parquet" }
            - { name: PARQUET_EXPORT_INTERVAL_SECONDS, value: "300" }
            # Daily GA4 export import runs inside this process (single DuckDB writer); no-op while
            # GA4_EXPORT_DATASET is empty (never set in local/staging).
            - { name: GA4_EXPORT_SOURCE, value: "bigquery" }
            - { name: GA4_EXPORT_DATASET, value: "" }
            - { name: GA4_IMPORT_AT, value: "03:30" }
            - { name: GA4_RECONCILE_MAX_DIFF_RATIO, value: "0.35" }
          ports:
            - { name: metrics, containerPort: 9109 }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            grpc: { port: 50059 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            grpc: { port: 50059 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: analytics-data, mountPath: /data }
      volumes:
        - name: analytics-data
          persistentVolumeClaim: { claimName: analytics-data }
---
apiVersion: v1
kind: Service
metadata: { name: team-analytics, namespace: marketplace, labels: { app: team-analytics } }
spec:
  selector: { app: team-analytics }
  ports:
    - { name: grpc, port: 50059, targetPort: 50059 }
    - { name: metrics, port: 9109, targetPort: 9109 }
