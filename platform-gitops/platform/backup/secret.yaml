# Local dev Secret with the known dev values. In staging/prod this is replaced by an
# ExternalSecret over Vault (the same `secrets.enabled` seam charts/service uses) — the
# CronJob keeps consuming a Secret named `pg-backup-secret`, only its source changes.
# pg_dump connects as the Postgres superuser so it can dump every service database.
apiVersion: v1
kind: Secret
metadata:
  name: pg-backup-secret
  namespace: marketplace
type: Opaque
stringData:
  PGUSER: postgres
  PGPASSWORD: postgres          # matches platform/postgres/postgres.yaml POSTGRES_PASSWORD
  S3_ACCESS_KEY: minioadmin      # matches platform/infra/minio.yaml MINIO_ROOT_USER
  S3_SECRET_KEY: minioadmin      # matches platform/infra/minio.yaml MINIO_ROOT_PASSWORD
