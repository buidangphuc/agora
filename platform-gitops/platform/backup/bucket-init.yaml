# Idempotent bucket bootstrap (mirrors minio-init in platform/infra/minio.yaml).
# PostSync hook so the backup bucket exists before the first CronJob run.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backup-bucket-init
  namespace: marketplace
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - secretRef: { name: pg-backup-secret }
          env:
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: pg-backup-config, key: S3_ENDPOINT }
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef: { name: pg-backup-config, key: S3_BUCKET }
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command:
            - sh
            - -c
            - |
              until mc alias set store "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 3; done
              mc mb --ignore-existing "store/$S3_BUCKET"
              echo "bucket $S3_BUCKET ready"
