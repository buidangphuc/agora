# Single CronJob that iterates every service DB on the shared Postgres (logical
# isolation only), pg_dumps each to MinIO, and prunes old dumps. One schedule, one
# Secret, one retention policy. `mc` is copied from the minio/mc image via an
# initContainer into a shared /tools dir so the postgres image can stay upstream.
# Schedule mirrors pg-backup-config.SCHEDULE (CronJob.spec.schedule can't read a CM).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: marketplace
spec:
  schedule: "0 2 * * *"          # daily 02:00 UTC — mirrors pg-backup-config.SCHEDULE
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: fetch-mc
              image: minio/mc:latest
              command: ["sh", "-c", "cp /usr/bin/mc /tools/mc && chmod +x /tools/mc"]
              volumeMounts:
                - { name: tools, mountPath: /tools }
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["sh", "/scripts/backup.sh"]
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                # DB source of truth: the same SERVICES list postgres-init uses.
                - name: SERVICES
                  valueFrom:
                    configMapKeyRef: { name: postgres-init, key: SERVICES }
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: PGHOST }
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: PGPORT }
                - name: S3_ENDPOINT
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: S3_ENDPOINT }
                - name: S3_BUCKET
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: S3_BUCKET }
                - name: RETENTION_DAYS
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: RETENTION_DAYS }
                - name: DATABASES
                  valueFrom:
                    configMapKeyRef: { name: pg-backup-config, key: DATABASES }
              # Credentials (PGUSER, PGPASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY) — Secret only.
              envFrom:
                - secretRef: { name: pg-backup-secret }
              volumeMounts:
                - { name: tools, mountPath: /tools }
                - { name: script, mountPath: /scripts }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tools
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: script
              configMap:
                name: pg-backup-config
                items: [{ key: backup.sh, path: backup.sh }]
