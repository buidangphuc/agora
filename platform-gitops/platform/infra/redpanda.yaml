# Redpanda (Kafka API) — shared; per-domain isolation via topic. Single-node dev.
#
# Kafka ACL note (ADR-0009 / ADR-0010, SA zero-trust follow-up) — the app layer
# trusts the payment.events topic and does NOT re-verify the producer per message,
# so producer identity must be enforced at the broker. Intended ACLs once Redpanda
# auth (SASL/mTLS) is enabled in deployed envs (dev single-node runs open):
#   • payment.events        — PRODUCE: allow ONLY principal team-payment (the sole
#                             writer via its transactional outbox, AD4); deny all
#                             other producers.
#                             CONSUME: allow group team-order.payment (team-order).
#   • payment.events.dlq    — PRODUCE/CONSUME: allow ONLY team-order (parks and
#                             replays poison PaymentSettled records, AD1).
# Mirrors the network-layer default-deny in charts/service NetworkPolicy: only the
# rightful writer reaches the topic, closing the "any workload forges a settle
# event" path. mTLS/SASL rollout is the tracked follow-up (ADR-0010).
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.1.7
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.marketplace.svc:9092
          ports: [{ containerPort: 9092 }, { containerPort: 9644 }]
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: 9644 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: marketplace }
spec:
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: admin, port: 9644, targetPort: 9644 }
