# Redpanda (Kafka API) — shared; per-domain isolation via topic. Single-node dev.
#
# Kafka ACL note (ADR-0009 / ADR-0010, SA zero-trust follow-up) — the app layer
# trusts the payment.events topic and does NOT re-verify the producer per message,
# so producer identity must be enforced at the broker. Intended ACLs once Redpanda
# auth (SASL/mTLS) is enabled in deployed envs (dev single-node runs open):
#   • payment.events        — PRODUCE: allow ONLY principal team-payment (the sole
#                             writer via its transactional outbox, AD4); deny all
#                             other producers.
#                             CONSUME: allow group team-order.payment (team-order).
#   • payment.events.dlq    — PRODUCE/CONSUME: allow ONLY team-order (parks and
#                             replays poison PaymentSettled records, AD1).
# Mirrors the network-layer default-deny in charts/service NetworkPolicy: only the
# rightful writer reaches the topic, closing the "any workload forges a settle
# event" path. mTLS/SASL rollout is the tracked follow-up (ADR-0010).
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.1.7
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://redpanda.marketplace.svc:9092
          ports: [{ containerPort: 9092 }, { containerPort: 9644 }]
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: 9644 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: marketplace }
spec:
  selector: { app: redpanda }
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: admin, port: 9644, targetPort: 9644 }
---
# Topic provisioning, mirroring docker-compose.services.yaml `redpanda-init`. ArgoCD
# PostSync hook: re-runs on every sync once the broker is Healthy; `rpk topic create`
# is idempotent for existing topics (errors tolerated per topic). Event topics follow
# <domain>.events with a .dlq park for consumers that dead-letter poison records.
#   payment.events   produced by team-payment (outbox)      consumed by team-order (+ .dlq)
#   order.events     produced by team-order (outbox)        consumed by team-notification, team-analytics (+ .dlq)
#   chat.events      produced by team-chat                  consumed by team-notification (+ .dlq)
#   listing.events   produced by team-domain (outbox)       consumed by team-search indexer, team-notification (+ .dlq)
#   identity.events  produced by team-identity (outbox)     consumed by team-gateway (revocation denylist)
#   promotion.events, analytics.events — producers/consumers per their services
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-init
  namespace: marketplace
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: redpandadata/redpanda:v24.1.7
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              BROKERS=redpanda.marketplace.svc:9092
              for t in payment.events payment.events.dlq \
                       order.events order.events.dlq \
                       chat.events chat.events.dlq \
                       listing.events listing.events.dlq \
                       identity.events promotion.events analytics.events; do
                rpk topic create "$t" -X brokers="$BROKERS" -p 1 -r 1 || true
              done
              rpk topic list -X brokers="$BROKERS"
