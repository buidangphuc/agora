# Valkey (Redis-compatible) — shared; per-service isolation via key-prefix / db-index.
apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: valkey, namespace: marketplace }
spec:
  selector: { app: valkey }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
