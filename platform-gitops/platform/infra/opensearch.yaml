# OpenSearch (search read-model) — shared; per-service isolation via index. Single-node,
# security off, low heap for local. initContainer raises vm.max_map_count on the node.
apiVersion: apps/v1
kind: Deployment
metadata: { name: opensearch, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: opensearch } }
  template:
    metadata: { labels: { app: opensearch } }
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext: { privileged: true }
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.15.0
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: bootstrap.memory_lock, value: "false" }
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports: [{ containerPort: 9200 }]
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: opensearch, namespace: marketplace }
spec:
  selector: { app: opensearch }
  ports: [{ name: http, port: 9200, targetPort: 9200 }]
