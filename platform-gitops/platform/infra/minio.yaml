# MinIO (S3) — shared; per-service isolation via bucket / prefix. Bucket listing-images
# created by a PostSync init Job (mirrors compose minio-init).
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: marketplace }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-28T17-19-04Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: minioadmin }
            - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: marketplace }
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: marketplace
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio.marketplace.svc:9000 minioadmin minioadmin; do sleep 3; done
              mc mb --ignore-existing local/listing-images
              mc anonymous set download local/listing-images
              echo "bucket listing-images ready"
