# platform-finetune — weekly fine-tuning job. A SCHEDULED batch (CronJob), not a Deployment/Service: it has
# no request-serving surface. Runs on the GPU pool (ADR-0011): nodeSelector node-pool=gpu, a toleration for
# the nvidia.com/gpu taint, and a limit of one GPU. Publishes through the shared model registry on MLflow
# (http://mlflow:5050); its NetworkPolicy (networkpolicy.yaml) allows no ingress.
# Schedule: Sundays 04:00 UTC, never overlapping, one retry.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-finetune
  namespace: marketplace
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: platform-finetune }
        spec:
          restartPolicy: Never
          serviceAccountName: platform-finetune
          nodeSelector:
            node-pool: gpu
          tolerations:
            - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
          containers:
            - name: finetune
              image: localhost:5001/platform-finetune
              # The image ENTRYPOINT is `python main.py run` (the batch job itself).
              envFrom:
                - configMapRef: { name: finetune-config }
                - secretRef: { name: platform-finetune-env }
              resources:
                requests:
                  cpu: "2"
                  memory: 8Gi
                limits:
                  cpu: "4"
                  memory: 16Gi
                  nvidia.com/gpu: 1
