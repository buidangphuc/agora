# MinIO (artifact store) credentials for the trainer come from Vault, never from git. Same Vault path as
# platform/mlflow (svc/mlflow/s3); the Vault role `platform-finetune` must be granted read on it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-finetune
  namespace: marketplace
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: platform-finetune
  namespace: marketplace
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: svc
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: platform-finetune
          serviceAccountRef:
            name: platform-finetune
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-finetune
  namespace: marketplace
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-finetune
    kind: SecretStore
  target:
    name: platform-finetune-env
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: mlflow/s3, property: AWS_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: mlflow/s3, property: AWS_SECRET_ACCESS_KEY }
