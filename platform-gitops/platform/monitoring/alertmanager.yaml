# W4-4: Alertmanager with ONE route -> the log-only webhook-logger receiver (local stand-in for
# Slack/PagerDuty). Read fired alerts with: kubectl -n marketplace logs deploy/webhook-logger
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: marketplace
data:
  alertmanager.yml: |
    route:
      receiver: webhook-logger
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: webhook-logger
        webhook_configs:
          - url: http://webhook-logger.marketplace.svc:8080/alert
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: marketplace
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          readinessProbe:
            httpGet: { path: /-/ready, port: 9093 }
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: marketplace
  labels: { app: alertmanager }
spec:
  selector: { app: alertmanager }
  ports:
    - name: http
      port: 9093
      targetPort: 9093
