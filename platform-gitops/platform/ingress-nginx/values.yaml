controller:
  config:
    http-snippet: |
      log_format handoff_redacted '$remote_addr - $remote_user [$time_local] "$request_method $handoff_log_uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id';
