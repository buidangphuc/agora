# Feature manifest for team-analytics (warehouse writer — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
#
# team-analytics has NO user-facing UI: its capabilities are a backend
# consumer/integration assertion (produce → consume → warehouse), not a
# Playwright journey. These features are therefore marked `not-testable` for the
# UI auto-generator; the pipeline is verified by a platform-e2e *integration*
# (non-UI) test that produces to analytics.events and asserts the DuckDB row.
repo: team-analytics
owner: analytics-team

features:
  - id: analytics.warehouse-sink
    title: Tracking events land in the warehouse
    persona: guest
    priority: P2
    summary: A TrackingEvent produced to analytics.events is consumed and appended to the warehouse; non-tracking envelopes are skipped.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: Requires Redpanda (analytics.events topic) and the team-analytics worker running with WAREHOUSE_DRIVER=duckdb.
    acceptance:
      - Given an EventEnvelope carrying a TrackingEvent is produced to analytics.events
      - When the team-analytics worker consumes it
      - Then the event's behavioral fields plus the envelope principal appear as a row in the DuckDB warehouse
      - And an envelope whose type is not platform.analytics.v1.TrackingEvent is skipped without a row and without failing the consumer
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Backend consumer assertion (no UI). Verified at the data layer by a
      platform-e2e integration test (produce → consume → assert DuckDB row),
      wired into `make collect` as a non-UI test. Deferred to the e2e track.

  - id: analytics.warehouse-driver-swap
    title: Warehouse target is swappable behind the WarehouseWriter seam
    persona: guest
    priority: P2
    summary: The worker writes through one WarehouseWriter interface; WAREHOUSE_DRIVER selects duckdb (local/test) or bigquery (prod) with no change to event handling.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: WAREHOUSE_DRIVER=duckdb locally; bigquery is unit/parity-tested only (no local creds).
    acceptance:
      - Given the worker starts with WAREHOUSE_DRIVER=duckdb
      - When tracking events are consumed
      - Then rows are written to the local DuckDB/Parquet warehouse
      - And the same rows would be written to BigQuery under WAREHOUSE_DRIVER=bigquery with no change to event handling
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Parity guarded by the DuckDB↔BigQuery schema parity unit test; BigQuery is
      not exercisable in local e2e (no creds).

  - id: analytics.batch-write
    title: Events are written in batches with offset-after-write
    persona: guest
    priority: P2
    summary: The worker accumulates events and flushes on batch size or max interval, committing Kafka offsets only after a durable write (at-least-once).
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: A burst of tracking events on analytics.events.
    acceptance:
      - Given a burst of tracking events arrives on analytics.events
      - When the worker consumes them
      - Then it flushes them to the warehouse in batches
      - And commits consumer offsets only after the batch is durably written, so a crash mid-batch reprocesses rather than loses events
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Batch flush (size + interval) and offset-after-write are covered by the
      consumer unit tests (batcher_test.go).

  - id: analytics.order-facts-ingestion
    title: Consuming order paid events appends rows to order_facts
    persona: guest
    priority: P1
    summary: OrderPaidEvent envelopes on order.events are consumed, unpacked into line-item facts, and appended to the columnar order_facts table.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: Redpanda order.events topic and team-analytics worker.
    acceptance:
      - Given an OrderPaidEvent on Kafka topic order.events with multiple line items
      - When team-analytics processes the message
      - Then one row per line item is inserted into order_facts with matching seller_id, listing_id, quantity, and unit_price
    tags: [analytics, order, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::Consuming an order paid event appends rows to order_facts"

  - id: analytics.revenue-breakdown-facts
    title: GetRevenueBreakdown aggregates real revenue from order_facts
    persona: seller
    priority: P1
    summary: AnalyticsQueryService aggregates revenue, orders, and top SKUs directly from the order_facts warehouse table.
    entry_route: /seller/analytics
    services: [team-analytics]
    preconditions:
      login: seller
      data: Seeded order_facts for the seller.
    acceptance:
      - Given multiple order lines in order_facts for a seller across several dates
      - When GetRevenueBreakdown is queried for that seller
      - Then top SKUs report accurate revenue and units_sold calculated as SUM(quantity * unit_price) and SUM(quantity)
    tags: [analytics, seller, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::GetRevenueBreakdown aggregates real revenue from order_facts"

  - id: analytics.demand-forecast
    title: GetDemandForecast serves probabilistic daily demand and restock points
    persona: seller
    priority: P1
    summary: AnalyticsQueryService returns p10/p50/p90 daily demand forecasts and deterministic reorder point recommendations.
    entry_route: /seller/analytics
    services: [team-analytics]
    preconditions:
      login: seller
      data: Historical or cold-start order_facts for the seller.
    acceptance:
      - Given a seller SKU with historical order facts
      - When GetDemandForecast is queried for that seller and listing
      - Then a multi-day forecast with p10, p50, p90 quantiles and suggested reorder point is returned
    tags: [analytics, forecast, seller, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::GetDemandForecast serves probabilistic daily demand and restock points"


