# Feature manifest for team-analytics (warehouse writer — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
#
# team-analytics has NO user-facing UI: its capabilities are a backend
# consumer/integration assertion (produce → consume → warehouse), not a
# Playwright journey. These features are therefore marked `not-testable` for the
# UI auto-generator; the pipeline is verified by a platform-e2e *integration*
# (non-UI) test that produces to analytics.events and asserts the DuckDB row.
repo: team-analytics
owner: analytics-team

features:
  - id: analytics.warehouse-sink
    title: Tracking events land in the warehouse
    persona: guest
    priority: P2
    summary: A TrackingEvent produced to analytics.events is consumed and appended to the warehouse; non-tracking envelopes are skipped.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: Requires Redpanda (analytics.events topic) and the team-analytics worker running with WAREHOUSE_DRIVER=duckdb.
    acceptance:
      - Given an EventEnvelope carrying a TrackingEvent is produced to analytics.events
      - When the team-analytics worker consumes it
      - Then the event's behavioral fields plus the envelope principal appear as a row in the DuckDB warehouse
      - And an envelope whose type is not platform.analytics.v1.TrackingEvent is skipped without a row and without failing the consumer
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Backend consumer assertion (no UI). Verified at the data layer by a
      platform-e2e integration test (produce → consume → assert DuckDB row),
      wired into `make collect` as a non-UI test. Deferred to the e2e track.

  - id: analytics.warehouse-driver-swap
    title: Warehouse target is swappable behind the WarehouseWriter seam
    persona: guest
    priority: P2
    summary: The worker writes through one WarehouseWriter interface; WAREHOUSE_DRIVER selects duckdb (local/test) or bigquery (prod) with no change to event handling.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: WAREHOUSE_DRIVER=duckdb locally; bigquery is unit/parity-tested only (no local creds).
    acceptance:
      - Given the worker starts with WAREHOUSE_DRIVER=duckdb
      - When tracking events are consumed
      - Then rows are written to the local DuckDB/Parquet warehouse
      - And the same rows would be written to BigQuery under WAREHOUSE_DRIVER=bigquery with no change to event handling
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Parity guarded by the DuckDB↔BigQuery schema parity unit test; BigQuery is
      not exercisable in local e2e (no creds).

  - id: analytics.batch-write
    title: Events are written in batches with offset-after-write
    persona: guest
    priority: P2
    summary: The worker accumulates events and flushes on batch size or max interval, committing Kafka offsets only after a durable write (at-least-once).
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: A burst of tracking events on analytics.events.
    acceptance:
      - Given a burst of tracking events arrives on analytics.events
      - When the worker consumes them
      - Then it flushes them to the warehouse in batches
      - And commits consumer offsets only after the batch is durably written, so a crash mid-batch reprocesses rather than loses events
    tags: [analytics, integration]
    status: not-testable
    notes: >
      Batch flush (size + interval) and offset-after-write are covered by the
      consumer unit tests (batcher_test.go).

  - id: analytics.order-facts-ingestion
    title: Consuming order paid events appends rows to order_facts
    persona: guest
    priority: P1
    summary: OrderPaidEvent envelopes on order.events are consumed, unpacked into line-item facts, and appended to the columnar order_facts table.
    entry_route: /
    services: [team-analytics]
    preconditions:
      login: guest
      data: Redpanda order.events topic and team-analytics worker.
    acceptance:
      - Given an OrderPaidEvent on Kafka topic order.events with multiple line items
      - When team-analytics processes the message
      - Then one row per line item is inserted into order_facts with matching seller_id, listing_id, quantity, and unit_price
    tags: [analytics, order, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::Consuming an order paid event appends rows to order_facts"

  - id: analytics.revenue-breakdown-facts
    title: GetRevenueBreakdown aggregates real revenue from order_facts
    persona: seller
    priority: P1
    summary: AnalyticsQueryService aggregates revenue, orders, and top SKUs directly from the order_facts warehouse table.
    entry_route: /seller/analytics
    services: [team-analytics]
    preconditions:
      login: seller
      data: Seeded order_facts for the seller.
    acceptance:
      - Given multiple order lines in order_facts for a seller across several dates
      - When GetRevenueBreakdown is queried for that seller
      - Then top SKUs report accurate revenue and units_sold calculated as SUM(quantity * unit_price) and SUM(quantity)
    tags: [analytics, seller, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::GetRevenueBreakdown aggregates real revenue from order_facts"

  - id: analytics.demand-forecast
    title: GetDemandForecast serves probabilistic daily demand and restock points
    persona: seller
    priority: P1
    summary: AnalyticsQueryService returns p10/p50/p90 daily demand forecasts and deterministic reorder point recommendations.
    entry_route: /seller/analytics
    services: [team-analytics]
    preconditions:
      login: seller
      data: Historical or cold-start order_facts for the seller.
    acceptance:
      - Given a seller SKU with historical order facts
      - When GetDemandForecast is queried for that seller and listing
      - Then a multi-day forecast with p10, p50, p90 quantiles and suggested reorder point is returned
    tags: [analytics, forecast, seller, integration]
    status: automated
    covered_by: "analytics/order_facts.feature::GetDemandForecast serves probabilistic daily demand and restock points"

  - id: analytics.seller-reads-own-funnel
    title: A seller reads their own funnel
    persona: seller
    priority: P1
    summary: >-
      GetSellerFunnel for the caller's own seller id is served.
    entry_route: /seller/analytics
    services: [team-analytics, team-gateway]
    preconditions:
      login: seller
    acceptance:
      - Given a signed-in seller
      - When the seller requests GetSellerFunnel for their own id
      - Then the gateway returns 200 with the funnel
    tags: [analytics, seller, authz]
    status: automated
    covered_by: "analytics/seller_analytics_access.feature::A seller reads their own funnel"
    notes: >
      Written in analytics/seller_analytics_access.feature ("A seller reads their own funnel"); flip to
      automated, with covered_by, after it passes against the stack
      (OpenSpec change secure-seller-analytics-and-admin-seed, task 4.1).

  - id: analytics.seller-cannot-read-other-revenue
    title: A seller cannot read another seller's revenue
    persona: seller
    priority: P1
    summary: >-
      GetRevenueBreakdown with another seller's id is denied by team-analytics and surfaced as 403 by the gateway, with no revenue figures.
    entry_route: /seller/analytics
    services: [team-analytics, team-gateway]
    preconditions:
      login: seller
    acceptance:
      - Given seller A is signed in and seller B exists
      - When seller A requests GetRevenueBreakdown with seller B's id
      - Then the gateway returns 403 and no revenue figures
    tags: [analytics, seller, authz]
    status: automated
    covered_by: "analytics/seller_analytics_access.feature::A seller cannot read another seller's revenue"
    notes: >
      Written in analytics/seller_analytics_access.feature ("A seller cannot read another seller's revenue"); flip to
      automated, with covered_by, after it passes against the stack
      (OpenSpec change secure-seller-analytics-and-admin-seed, task 4.1).

  - id: analytics.anonymous-forecast-401
    title: An anonymous caller cannot read a forecast
    persona: guest
    priority: P1
    summary: >-
      GetDemandForecast without a token is rejected with 401.
    entry_route: /seller/analytics
    services: [team-analytics, team-gateway]
    preconditions:
      login: guest
    acceptance:
      - When GetDemandForecast is called through the gateway with no token
      - Then the gateway returns 401
    tags: [analytics, seller, authz]
    status: automated
    covered_by: "analytics/seller_analytics_access.feature::An anonymous caller cannot read a forecast"
    notes: >
      Written in analytics/seller_analytics_access.feature ("An anonymous caller cannot read a forecast"); flip to
      automated, with covered_by, after it passes against the stack
      (OpenSpec change secure-seller-analytics-and-admin-seed, task 4.1).

  - id: analytics.admin-reads-any-seller
    title: An admin reads any seller's funnel
    persona: admin
    priority: P1
    summary: >-
      A principal with the admin scope may call GetSellerFunnel for any seller id.
    entry_route: /seller/analytics
    services: [team-analytics, team-gateway]
    preconditions:
      login: admin
    acceptance:
      - Given an admin is logged in
      - When the admin requests GetSellerFunnel for any seller's id
      - Then the gateway returns 200 with the funnel
    tags: [analytics, seller, authz]
    status: automated
    covered_by: "analytics/seller_analytics_access.feature::An admin reads any seller's funnel"
    notes: >
      Written in analytics/seller_analytics_access.feature ("An admin reads any seller's funnel"); flip to
      automated, with covered_by, after it passes against the stack
      (OpenSpec change secure-seller-analytics-and-admin-seed, task 4.1).

  - id: analytics.seller-funnel-scoped-to-seller
    title: Seller funnel tracking counts are scoped to the seller's own listings
    persona: seller
    priority: P1
    summary: >-
      GetSellerFunnel counts only tracking events on listings the seller owns; the
      listing -> seller mapping comes from listing.events (listing_sellers table).
    entry_route: /seller/analytics
    services: [team-analytics, team-gateway, team-domain]
    preconditions:
      login: seller
      data: Requires the listing.events consumer in team-analytics (KAFKA_LISTING_TOPIC).
    acceptance:
      - Given seller A and seller B exist and seller A has published a listing
      - When view beacons are collected through the gateway for seller A's listing
      - Then seller A's funnel reports those views
      - And seller B's funnel reports no views
    tags: [analytics, seller, tracking, integration]
    status: automated
    covered_by: "analytics/seller_funnel_scope.feature::Events on seller A's listing do not appear in seller B's funnel"
    notes: >
      Authored against the fix/funnel-seller-scope change; collect-only and lint
      verified, not yet run against the stack (needs the team-analytics image rebuilt
      and KAFKA_LISTING_* env, see the change notes).

  - id: tracking.same-event-twice-stored-once
    title: "A re-sent tracking event is stored once in the warehouse"
    persona: guest
    priority: P1
    summary: "The envelope event_id is derived from the visitor and the client eventId, so a re-sent beacon carries the same id and the warehouse keeps one row."
    entry_route: "/"
    services: [team-gateway, team-analytics]
    preconditions:
      login: guest
    acceptance:
      - When a visitor posts the same view (same `eventId` and `anonymousId`, unique listing id) twice
      - Then both envelopes on analytics.events carry the same `event_id`, and the warehouse holds exactly one row for that listing id
    tags: [tracking, analytics]
    status: automated
    covered_by: "tracking/ingest_idempotency.feature::Posting the same event twice stores one row"
    notes: "tracking-ingest-integrity: tracking/ingest_idempotency.feature::Posting the same event twice stores one row"

  - id: tracking.two-visitors-cannot-collide-on-event-id
    title: "Two visitors reusing an eventId keep one warehouse row each"
    persona: guest
    priority: P1
    summary: "The event id is scoped by visitor, so one visitor cannot suppress another's event by reusing its eventId."
    entry_route: "/"
    services: [team-gateway, team-analytics]
    preconditions:
      login: guest
    acceptance:
      - When two different anonymous visitors post views with the same `eventId`
      - Then the warehouse holds one row for each visitor
    tags: [tracking, analytics]
    status: automated
    covered_by: "tracking/ingest_idempotency.feature::Two visitors cannot collide on an event id"
    notes: "tracking-ingest-integrity: tracking/ingest_idempotency.feature::Two visitors cannot collide on an event id"

  - id: tracking.stored-event-has-ingest-time
    title: "A stored tracking event has an ingest time not before its occurrence"
    persona: guest
    priority: P1
    summary: "The warehouse sink stamps ingested_at with its own clock at write time; occurred_at stays the edge receive time."
    entry_route: "/"
    services: [team-gateway, team-analytics]
    preconditions:
      login: guest
    acceptance:
      - When a visitor posts one view with a unique listing id and the sink writes it
      - Then the warehouse row has a non-null `ingested_at` that is not earlier than its `occurred_at`
    tags: [tracking, analytics]
    status: automated
    covered_by: "tracking/ingest_time.feature::A stored event has an ingest time after its occurrence"
    notes: "tracking-ingest-integrity: tracking/ingest_time.feature::A stored event has an ingest time after its occurrence"

  - id: tracking.pre-login-browsing-resolves-to-user
    title: "Pre-login browsing resolves to the account after login"
    persona: guest
    priority: P1
    summary: "tracking_identity maps an anonymous id seen on a USER event to that principal, and tracking_events_resolved exposes it as user_key for the anonymous events too."
    entry_route: "/"
    services: [team-gateway, team-analytics, team-identity]
    preconditions:
      login: guest
    acceptance:
      - When a visitor posts a view anonymously with `anonymousId` X, then logs in as a new buyer and posts a view with the same `anonymousId` X
      - Then in `tracking_events_resolved` both views have `user_key` equal to the buyer's id
    tags: [tracking, analytics]
    status: automated
    covered_by: "tracking/identity_stitching.feature::Pre-login browsing resolves to the user after login"
    notes: "tracking-ingest-integrity: tracking/identity_stitching.feature::Pre-login browsing resolves to the user after login"

  - id: analytics.tii-ambiguous-anonymous-id-is-not-stitched
    title: "An anonymous id seen with two accounts is not stitched"
    persona: buyer
    priority: P1
    summary: "An anonymous id seen with two accounts is not stitched"
    entry_route: /
    services: [team-gateway, team-analytics]
    acceptance:
      - "When a visitor posts a view anonymously with `anonymousId` Z, then two different new buyers each post a view with the same `anonymousId` Z"
      - "Then in `tracking_events_resolved` the anonymous view has `user_key` \"anon:Z\" and each buyer's view has that buyer's id"
    tags: [tracking, security]
    status: automated
    covered_by: "tracking/identity_stitching.feature::An anonymous id seen with two accounts is not stitched"
    notes: "Added after the boundary review of tracking-ingest-integrity: the anonymous id is client-supplied, so an id seen with two accounts must not be stitched."
  - id: tracking.never-logged-in-keeps-anon-key
    title: "A never-logged-in visitor resolves to an anonymous key"
    persona: guest
    priority: P1
    summary: "A visitor with no USER event keeps user_key anon:<anonymous_id> in tracking_events_resolved."
    entry_route: "/"
    services: [team-gateway, team-analytics]
    preconditions:
      login: guest
    acceptance:
      - When a visitor posts a view anonymously with a fresh `anonymousId` Y and never logs in
      - Then in `tracking_events_resolved` that view has `user_key` "anon:Y"
    tags: [tracking, analytics]
    status: automated
    covered_by: "tracking/identity_stitching.feature::A never-logged-in visitor keeps an anonymous key"
    notes: "tracking-ingest-integrity: tracking/identity_stitching.feature::A never-logged-in visitor keeps an anonymous key"

  - id: analytics.adq-resent-event-counted-as-duplicate
    title: "A re-sent event is counted as a skipped duplicate"
    persona: admin
    priority: P1
    summary: "A re-sent event is counted as a skipped duplicate"
    entry_route: /admin/cockpit
    services: [team-gateway, team-analytics]
    preconditions:
      login: admin
    acceptance:
      - "When a visitor posts the same view (same `eventId` and `anonymousId`) twice and the admin then reads the tracking quality report for the last hour"
      - "Then the report's `duplicates_skipped` is at least 1 higher than it was before the two posts"
    tags: [tracking, analytics, admin]
    status: automated
    covered_by: "analytics/tracking_quality_report.feature::A re-sent event is counted as a skipped duplicate"
    notes: "analytics-data-quality: analytics/tracking_quality_report.feature::A re-sent event is counted as a skipped duplicate"

  - id: analytics.adq-fresh-views-appear-in-report
    title: "Fresh views appear in the report"
    persona: admin
    priority: P1
    summary: "Fresh views appear in the report"
    entry_route: /admin/cockpit
    services: [team-gateway, team-analytics]
    preconditions:
      login: admin
    acceptance:
      - "When a visitor posts three views of a listing and the admin reads the report for the last hour"
      - "Then the view count is at least 3, the latest ingest time is within the last 5 minutes, and the status is not degraded for `stale`"
    tags: [tracking, analytics, admin]
    status: automated
    covered_by: "analytics/tracking_quality_report.feature::Fresh views appear in the report"
    notes: "analytics-data-quality: analytics/tracking_quality_report.feature::Fresh views appear in the report"

  - id: analytics.adq-views-without-listing-incomplete
    title: "Views without a listing make the report incomplete"
    persona: admin
    priority: P1
    summary: "Views without a listing make the report incomplete"
    entry_route: /admin/cockpit
    services: [team-gateway, team-analytics]
    preconditions:
      login: admin
    acceptance:
      - "When a visitor posts 50 views without a `listingId` and the admin reads the report for the last hour"
      - "Then the view type's missing-listing ratio is above 0 and, if it exceeds the configured maximum, the status is `DEGRADED` with reason `incomplete`"
    tags: [tracking, analytics, admin]
    status: automated
    covered_by: "analytics/tracking_quality_report.feature::Views without a listing make the report incomplete"
    notes: "analytics-data-quality: analytics/tracking_quality_report.feature::Views without a listing make the report incomplete"

  - id: analytics.adq-window-out-of-range-rejected
    title: "A window out of range is rejected"
    persona: admin
    priority: P1
    summary: "A window out of range is rejected"
    entry_route: /admin/cockpit
    services: [team-gateway, team-analytics]
    preconditions:
      login: admin
    acceptance:
      - "When the admin reads the report with a window of 500 hours"
      - "Then the call fails with `invalid_argument`"
    tags: [tracking, analytics, admin]
    status: automated
    covered_by: "analytics/tracking_quality_report.feature::A window out of range is rejected"
    notes: "analytics-data-quality: analytics/tracking_quality_report.feature::A window out of range is rejected"
