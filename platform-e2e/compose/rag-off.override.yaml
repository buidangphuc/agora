# Turns team-ai's RAG store OFF (RAG_ENABLED=false). The assistant no longer reads the RAG store (change
# ai-assistant-grounding), so its cards must still be real team-domain listings.
#   docker compose -f docker-compose.yaml -f platform-e2e/compose/rag-off.override.yaml up -d --no-deps team-ai
# Used by ai/assistant_grounding.feature (@destructive, "Without the RAG store the assistant still returns real listings only"), which
# recreates team-ai with it and restores the standing configuration in teardown. Keys by service name only.
services:
  team-ai:
    environment:
      RAG_ENABLED: "false"
