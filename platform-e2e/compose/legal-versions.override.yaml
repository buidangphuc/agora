# Changed legal versions for the identity-legal-consent e2e scenarios.
#   docker compose -f docker-compose.yaml -f platform-e2e/compose/legal-versions.override.yaml up -d --no-deps team-identity
# Keys by service name only (no container_name), so it works under any project.
services:
  team-identity:
    environment:
      LEGAL_TERMS_VERSIONS: "${E2E_LEGAL_TERMS_VERSIONS:-2026-12,2026-11}"
      PRIVACY_POLICY_VERSIONS: "2026-11"
