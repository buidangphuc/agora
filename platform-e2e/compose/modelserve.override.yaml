# platform-modelserve router + a deterministic TEI fake, wired into team-search
# (changes add-platform-modelserve and add-hybrid-retrieval-platform; e2e features
# modelserve/*.feature, search/hybrid_retrieval.feature, search/hybrid_indexing.feature).
#
# tei-fake and modelserve-router now live in the base compose (docker-compose.services.yaml,
# change assistant-rag-default-on): team-ai's RAG grounding is on by default and needs them. This file only
# adds what the tests need on top; layer it from the workspace root (any compose project name):
#   docker compose -f docker-compose.yaml -f platform-e2e/compose/modelserve.override.yaml \
#     up -d --build tei-fake modelserve-router team-search team-search-indexer
# Add the same `-f` pair to any other `docker compose` call against that project. The
# `dc-agora-ov.sh` wrapper carries it next to the other e2e overlays.
#
# What it adds:
# * tei-fake / modelserve-router: published host ports (below), the agora-*:local image names, and
#   MAX_QUEUE_DEPTH=10 (base default 100) so the backpressure scenario can saturate the router with a few
#   dozen slow requests; the real traffic of the suite stays far below that.
# * team-search and team-search-indexer: MODEL_SERVER_URL -> the router (the committed
#   default is localhost:8100, i.e. nothing, so every search degrades to lexical and every
#   listing is indexed with vector_pending), ENABLE_RERANKER=true on the query side.
#
# The tests reach the router and the fake on the host at MODELSERVE_URL (default
# http://localhost:18100) and TEI_FAKE_URL (default http://localhost:18110), i.e. the
# published ports below; change both together with the *_HOST_PORT variables.
# Keys by service name only (no container_name), so it works under any project. The images are
# named agora-*:local here, so the agora isolation override needs no entry for these two services;
# the destructive scenarios `docker stop` the router container, default name
# agora-modelserve-router-1 (override with MS_ROUTER_CONTAINER).
services:
  tei-fake:
    image: agora-tei-fake:local
    ports:
      - "127.0.0.1:${TEI_FAKE_HOST_PORT:-18110}:8110"
  modelserve-router:
    image: agora-modelserve-router:local
    environment:
      MAX_QUEUE_DEPTH: "10"
    ports:
      - "127.0.0.1:${MODELSERVE_HOST_PORT:-18100}:8100"
  team-search:
    depends_on:
      modelserve-router:
        condition: service_healthy
    environment:
      MODEL_SERVER_URL: http://modelserve-router:8100
      ENABLE_RERANKER: "true"
      # The fake sums one dense direction per concept, so a one-concept query against a document with N
      # distinct concepts that contains it scores about 1/sqrt(N) (0.58 for three), while unrelated texts
      # score about 0 +-0.05. 0.3 separates them for titles of up to about ten concepts. 0.6 (the service
      # default) is tuned for bge-small's compressed cosine range and would drop real matches here.
      HYBRID_SEMANTIC_MIN_SCORE: "0.3"
  team-search-indexer:
    depends_on:
      modelserve-router:
        condition: service_healthy
    environment:
      MODEL_SERVER_URL: http://modelserve-router:8100
