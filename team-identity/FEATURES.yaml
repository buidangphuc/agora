      login: buyer
    api:
      exercised: [identity.v1.AuthService.Register]
    acceptance:
      - "When a buyer and a seller each log in through the gateway"
      - "Then neither token's scopes include `order.admin` or `admin`"
    tags: [security]
    status: automated
    covered_by: "security/ar2_order_admin.feature::Buyer and seller tokens carry no order.admin"
    notes: "green after rebuild: security/ar2_order_admin.feature::Buyer and seller tokens carry no order.admin"

