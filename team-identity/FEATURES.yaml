    acceptance:
      - When the team-identity image is started with ENV=production and the development signing key from the local compose file
      - Then the process exits non-zero and its log names the signing key
    tags: [auth]
    status: automated
    covered_by: "ops/boot_guard_identity.feature::team-identity refuses the development signing key in production"

  - id: ops.identity-boot-guard-reset-token-staging
    title: team-identity refuses an exposed reset token in staging
    persona: admin
    priority: P1
    summary: team-identity refuses an exposed reset token in staging (port-edge-authz-residuals).
    entry_route: /
    services: [team-identity]
    acceptance:
      - "When the team-identity image is started with ENV=staging, its own non-development signing key, and PASSWORD_RESET_EXPOSE_TOKEN=true"
      - "Then the process exits non-zero and its log names PASSWORD_RESET_EXPOSE_TOKEN"
    tags: [security]
    status: automated
    covered_by: "ops/boot_guard_identity.feature::team-identity refuses an exposed reset token in staging"
    notes: >-
      Scenario "team-identity refuses an exposed reset token in staging" in ops/boot_guard_identity.feature. Written red-first (code not merged); the integrator flips this to automated with covered_by after the merge.

  - id: auth.ar2-admin-token-carries-order-admin
    title: "An admin token carries order.admin"
    persona: admin
    priority: P0
    summary: "An admin token carries order.admin (authz-residuals-2)."
    entry_route: /
    services: [team-gateway, team-identity]
    preconditions:
      login: admin
    api:
      exercised: [identity.v1.AuthService.Login]
    acceptance:
