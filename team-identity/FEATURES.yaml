# Feature manifest for team-identity (auth + addresses — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-identity
owner: identity-team

features:
  - id: auth.login
    title: Sign in through the UI
    persona: guest
    priority: P0
    summary: A registered user signs in via the login form and lands on home.
    entry_route: /login
    services: [team-identity, team-gateway, team-frontend]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Login]
    ui:
      key_elements:
        username: "#username"
        password: "#password"
        submit: "role:button=Đăng nhập"
    acceptance:
      - Given the login page is open
      - When the user logs in as the seeded buyer
      - Then the user lands on the home page
    tags: [auth, smoke]
    status: automated
    covered_by: "auth/login.feature::Valid login through the UI"

  - id: auth.login-rejects-invalid
    title: Invalid credentials are rejected
    persona: guest
    priority: P1
    summary: Wrong username/password shows an inline error and no session.
    entry_route: /login
    services: [team-identity, team-gateway, team-frontend]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Login]
    ui:
      key_elements:
        error: "text:không chính xác"
    acceptance:
      - Given the login page is open
      - When the user logs in with invalid credentials
      - Then a login error is shown
    tags: [auth]
    status: automated
    covered_by: "auth/login.feature::Invalid credentials are rejected"

  - id: auth.register
    title: Register a new account
    persona: guest
    priority: P0
    summary: A visitor registers as buyer or seller and is signed in.
    entry_route: /register
    services: [team-identity, team-gateway, team-frontend]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Register]
    ui:
      key_elements:
        username: "#username"
        password: "#password"
        role: "#role"
        submit: "role:button=Đăng ký"
    acceptance:
      - Given the register page is open
      - When the visitor registers with a unique username and a role
      - Then the visitor is signed in and lands on home
    tags: [auth]
    status: automated
    covered_by: "auth/register.feature::Visitor registers a new buyer account"

  - id: auth.password-reset
    title: Password reset token lifecycle
    persona: guest
    priority: P2
    summary: Requesting a reset issues a short-lived token that sets a new password.
    entry_route: /login
    services: [team-identity, team-gateway]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.RequestPasswordReset, identity.v1.ResetPassword]
    acceptance:
      - Given a registered account
      - When a password reset is requested
      - Then a valid reset token is issued and can set a new password
    tags: [auth]
    status: automated
    covered_by: "auth/password_reset.feature::User requests a password reset token"

  - id: address.manage
    title: Manage delivery addresses
    persona: buyer
    priority: P1
    summary: A buyer adds, edits and sets a default delivery address.
    entry_route: /account/addresses
    services: [team-identity, team-gateway, team-frontend]
    preconditions:
      login: buyer
    api:
      exercised:
        - identity.v1.CreateAddress
        - identity.v1.ListAddresses
        - identity.v1.SetDefaultAddress
    acceptance:
      - Given a buyer is logged in
      - When the buyer adds a new address and marks it default
      - Then the address appears as the default in the address list
    tags: [buyer]
    status: automated
    covered_by: "identity/addresses.feature::Buyer adds a delivery address"

  - id: auth.logout-journey
    title: User session logout
    persona: buyer
    priority: P1
    summary: Authenticated user logs out via header and terminates session.
    entry_route: /
    services: [team-identity, team-frontend]
    preconditions:
      login: buyer
    acceptance:
      - Given a buyer is logged in
      - When the user opens the home page
      - And the user clicks the logout button
      - Then the header displays the login and register links
    tags: [auth]
    status: automated
    covered_by: "auth/logout_flow.feature::Authenticated user logs out via header"

  - id: auth.jwt-rs256-login
    title: Login issues an RS256 token carrying a kid
    persona: guest
    priority: P0
    summary: A successful login returns a JWT signed RS256 with a kid header.
    entry_route: /login
    services: [team-identity, team-gateway]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Login]
    acceptance:
      - Given a registered user
      - When the user logs in successfully through team-identity
      - Then the JWT header has alg RS256 and a non-empty kid and the claims carry sub, name, typ and scopes
    tags: [auth, jwt]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::Login issues an RS256 token carrying a kid"

  - id: auth.jwt-no-hs256
    title: The HS256 shared-secret signing path is gone
    persona: guest
    priority: P1
    summary: Identity requires an RSA private key and kid and never signs HS256.
    entry_route: /login
    services: [team-identity]
    preconditions:
      login: guest
    acceptance:
      - Given team-identity is configured with an RSA private key and a kid
      - When team-identity starts
      - Then it does not read or require a shared JWT_SECRET and cannot mint an HS256 token
    tags: [auth, jwt]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::The HS256 shared-secret signing path is gone"

  - id: auth.jwks-active-key
    title: JWKS serves the active public key
    persona: guest
    priority: P0
    summary: The JWKS endpoint publishes the RSA public key matching a fresh token's kid.
    entry_route: /login
    services: [team-identity]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Login]
    acceptance:
      - Given team-identity has issued a fresh token with a kid
      - When a client requests GET /.well-known/jwks.json from team-identity
      - Then the keys array contains an RSA public JWK whose kid matches the token and no private key is present
    tags: [auth, jwks]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::JWKS serves the active public key"

  - id: auth.gateway-accepts-rs256
    title: A valid RS256 token from identity is accepted
    persona: buyer
    priority: P0
    summary: The gateway verifies a fresh token against the JWKS and forwards the principal.
    entry_route: /login
    services: [team-identity, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - Given a bearer token freshly issued by team-identity
      - When a request reaches the gateway with that token
      - Then the gateway verifies it against the JWKS key matching the kid and forwards x-principal metadata
    tags: [auth, jwt]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::A valid RS256 token from identity is accepted"

  - id: auth.gateway-rejects-unknown-key
    title: Gateway rejects a token not signed by a current JWKS key
    persona: guest
    priority: P1
    summary: A token whose kid is absent from the JWKS is rejected as Unauthenticated (401) on every route, never downgraded to anonymous.
    entry_route: /login
    services: [team-identity, team-gateway]
    preconditions:
      login: guest
    acceptance:
      - Given a bearer token whose kid is absent from the JWKS
      - When a request reaches the gateway with that token
      - Then the gateway answers Unauthenticated on public and protected routes alike and does not forward the request
    tags: [auth, jwt]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::Gateway rejects a token not signed by a current JWKS key"

  - id: auth.jwks-key-rotation
    title: A token signed by a rotated-in key verifies
    persona: buyer
    priority: P1
    summary: The gateway refreshes its JWKS and accepts tokens signed by a newly rotated-in key.
    entry_route: /login
    services: [team-identity, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - Given team-identity published a new signing key with a new kid alongside the previous key
      - And the gateway has refreshed its cached JWKS
      - When a request reaches the gateway with a token signed by the new kid
      - Then the gateway accepts it and tokens signed by the previous kid also continue to verify
    tags: [auth, jwks]
    status: automated
    covered_by: "auth/jwt_rs256_jwks.feature::A token signed by a rotated-in key verifies"

  - id: auth.session-revocation
    title: A revoked session's token stops working within 5 seconds
    persona: buyer
    priority: P1
    summary: >-
      Revoking a session writes a SessionRevoked outbox row in the same transaction;
      the relayer publishes it to identity.events and the gateway denylists the sid, so
      the revoked device's token is answered 401 on every route while the buyer's current
      session keeps working. The gateway still verifies each token locally.
    entry_route: /account/security
    services: [team-identity, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [identity.v1.Login, identity.v1.ListSessions, identity.v1.RevokeSession]
    acceptance:
      - Given a buyer signed in on two devices
      - When the buyer revokes the other device's session from the current device
      - Then within 5 s the other device's token gets 401 on a protected and a public route
      - And the current device's token still works
    tags: [auth, buyer]
    status: automated
    covered_by: "auth/session_revocation.feature::A revoked session's token stops working"
    notes: >-
      Scenario "A revoked session's token stops working" (auth/session_revocation.feature); green
      against the agora stack.

  - id: auth.session-revocation-survives-restart
    title: A revocation survives a gateway restart
    persona: buyer
    priority: P1
    summary: >-
      The gateway keeps no revocation state on disk: on start it replays identity.events from
      the earliest offset (no consumer group), so a restarted gateway still rejects a
      revoked, unexpired token.
    entry_route: /account/security
    services: [team-identity, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [identity.v1.RevokeSession]
    acceptance:
      - Given a revoked session whose token has not yet expired
      - When the gateway container is restarted
      - Then the revoked token is rejected with 401 once the topic has been replayed
    tags: [auth, buyer, destructive]
    status: automated
    covered_by: "auth/session_revocation.feature::Revocations survive a gateway restart"
    notes: >-
      @destructive: restarts the container named by GATEWAY_CONTAINER (default
      team-gateway-svc); run serially. Scenario "Revocations survive a gateway restart".

  - id: auth.session-device-and-ip
    title: A new session shows the device and IP it was created from
    persona: buyer
    priority: P2
    summary: >-
      The frontend forwards the browser's user agent and IP (X-Forwarded-For, trusted only
      from the frontend via the gateway's TRUSTED_PROXIES); the gateway stamps
      x-client-user-agent / x-client-ip and identity records them on the session.
    entry_route: /account/security
    services: [team-frontend, team-gateway, team-identity]
    preconditions:
      login: buyer
    api:
      exercised: [identity.v1.Login, identity.v1.ListSessions]
    acceptance:
      - Given a registered buyer
      - When the buyer logs in through the login form
      - Then the security page lists a session with the browser's user agent and a non-empty IP
    tags: [auth, buyer]
    status: automated
    covered_by: "auth/session_revocation.feature::A new session records device and IP"
    notes: >-
      Scenario "A new session records device and IP".

  - id: auth.login-token-bound-to-session
    title: Login returns a token bound to a listed session
    persona: buyer
    priority: P1
    summary: >-
      Every user login creates a session row and signs its id into the JWT as `sid`; the id
      is one that ListSessions returns for that buyer.
    entry_route: /login
    services: [team-identity, team-gateway]
    api:
      exercised: [identity.v1.Login, identity.v1.ListSessions]
    acceptance:
      - Given a registered buyer
      - When the buyer logs in
      - Then the token's sid equals the id of a session ListSessions returns for the buyer
    tags: [auth, buyer]
    status: automated
    covered_by: "auth/session_revocation.feature::Login returns a token bound to a listed session"

  - id: auth.denylist-entry-expires
    title: Expired denylist entries are dropped
    persona: buyer
    priority: P2
    summary: >-
      The gateway keeps a revoked session id only until the token's expiry; a SessionRevoked
      event with a short expiry is added to the denylist (gateway_revocation_denylist_size
      grows) and swept once the expiry has passed.
    entry_route: /account/security
    services: [team-identity, team-gateway]
    api:
      exercised: [identity.v1.RevokeSession]
    acceptance:
      - Given the gateway's denylist size is recorded
      - When a SessionRevoked event expiring in 15 seconds is published to identity.events
      - Then the gateway denylist grows by that entry
      - And once the expiry has passed the gateway denylist no longer holds it
    tags: [auth, slow]
    status: automated
    covered_by: "auth/session_revocation.feature::Expired denylist entries are dropped"
    notes: >-
      Reads the gateway's own gauge through Prometheus (PROMETHEUS_URL, default
      http://localhost:9090) and publishes the event straight to identity.events; takes up to
      about a minute (the gateway sweeps once a minute).

  - id: auth.admin-seed-default-off
    title: Default configuration creates no admin
    persona: admin
    priority: P1
    summary: >-
      team-identity started with no SEED_ADMIN_* variables creates no admin and ships no built-in password; run against a scratch database migrated with the real migrations.
    entry_route: /login
    services: [team-identity, team-gateway]
    acceptance:
      - When team-identity starts with no SEED_ADMIN_* variables against an empty database
      - Then no admin user exists and a login as admin / admin123 fails
    tags: [auth, admin, security]
    status: automated
    covered_by: "auth/admin_bootstrap.feature::Default configuration creates no admin"

  - id: auth.admin-seed-requires-password
    title: Enabled seeding without a password refuses to start
    persona: admin
    priority: P1
    summary: >-
      SEED_ADMIN_ENABLED=true with an empty SEED_ADMIN_PASSWORD makes the process exit non-zero naming SEED_ADMIN_PASSWORD.
    entry_route: /login
    services: [team-identity]
    acceptance:
      - When team-identity starts with SEED_ADMIN_ENABLED=true and no SEED_ADMIN_PASSWORD
      - Then the process exits non-zero with an error naming SEED_ADMIN_PASSWORD
    tags: [auth, admin, security]
    status: automated
    covered_by: "auth/admin_bootstrap.feature::Enabled seeding without a password refuses to start"

  - id: auth.admin-seed-local-stack
    title: Local stack seeds the dev admin from env
    persona: admin
    priority: P1
    summary: >-
      The local compose stack enables the seed with a dev password; the admin can log in with it.
    entry_route: /login
    services: [team-identity, team-gateway]
    acceptance:
      - When the local compose stack starts with SEED_ADMIN_ENABLED=true and a dev password set in its env
      - Then the e2e admin login with those credentials succeeds
    tags: [auth, admin]
    status: automated
    covered_by: "auth/admin_bootstrap.feature::Local stack seeds the dev admin from env"

  - id: auth.admin-seed-not-in-gitops
    title: Deployment manifests never enable seeding
    persona: admin
    priority: P1
    summary: >-
      helm-rendered team-identity manifests for every environment contain no SEED_ADMIN_ENABLED=true and no admin password; the platform-gitops check passes on them and fails on a crafted bad sample.
    entry_route: /login
    services: [team-identity, platform-gitops]
    acceptance:
      - When the platform-gitops manifests for team-identity are rendered
      - Then they contain no SEED_ADMIN_ENABLED=true and no admin password literal
    tags: [auth, admin, security]
    status: automated
    covered_by: "auth/admin_bootstrap.feature::Deployment manifests never enable seeding"
    notes: >-
      Static: needs helm on the runner; no stack involved.

  - id: auth.buyer-token-ai-scopes
    title: A buyer token carries the AI scopes and no service scope
    persona: buyer
    priority: P1
    summary: Role tokens include recommendations:read and ai:use and never a service-only scope.
    entry_route: /login
    services: [team-identity, team-gateway]
    api:
      exercised: [identity.v1.Login]
    acceptance:
      - Given a registered buyer account
      - When a buyer logs in through the gateway
      - Then the token's scopes include recommendations:read and ai:use and include none of the service-only scopes
    tags: [auth, buyer]
    status: automated
    covered_by: "auth/login_history.feature::A buyer token carries the AI scopes and no service scope"

  - id: auth.login-history-records-attempts
    title: Login history shows a failed and a successful attempt
    persona: buyer
    priority: P1
    summary: A wrong password adds a failure entry, a right one a success entry, visible in the login history.
    entry_route: /account/security
    services: [team-identity, team-gateway]
    api:
      exercised: [identity.v1.Login, identity.v1.ListLoginHistory]
    acceptance:
      - Given a registered buyer account
      - When a user logs in once with a wrong password and then with the right one, and lists their login history through the gateway
      - Then the history contains a failure entry followed by a success entry
    tags: [auth, buyer]
    status: automated
    covered_by: "auth/login_history.feature::Login history shows a failed and a successful attempt"

