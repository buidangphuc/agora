      - "Then the token's scopes include `admin` and `order.admin`"
    tags: [security]
    status: automated
    covered_by: "security/ar2_order_admin.feature::An admin token carries order.admin"
    notes: "green after rebuild: security/ar2_order_admin.feature::An admin token carries order.admin"

  - id: auth.ar2-buyer-seller-no-order-admin
    title: "Buyer and seller tokens carry no order.admin"
    persona: buyer
    priority: P0
    summary: "Buyer and seller tokens carry no order.admin (authz-residuals-2)."
    entry_route: /
    services: [team-gateway, team-identity]
