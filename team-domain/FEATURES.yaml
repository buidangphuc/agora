# Feature manifest for team-domain (listing write-model — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-domain
owner: domain-team

features:
  - id: listing.create
    title: Create a listing
    persona: seller
    priority: P0
    summary: A seller publishes a product via the new-listing form.
    entry_route: /seller/new
    related_routes: [/seller]
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [listing.v1.CreateListing]
    ui:
      key_elements:
        title: "#title"
        category: "#categoryId"
        price: "#price"
        stock: "#stock"
        submit: "role:button=Đăng bán ngay"
    acceptance:
      - Given a seeded seller is logged in
      - When the seller creates a new listing
      - Then the new listing appears in the seller's listings
    tags: [seller, smoke]
    status: automated
    covered_by: "seller/create-listing.feature::Seller creates a new listing"

  - id: listing.edit
    title: Edit an existing listing
    persona: seller
    priority: P1
    summary: A seller updates price/stock/status of one of their listings.
    entry_route: "/seller/{listing_id}/edit"
    related_routes: [/seller]
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
      seed_tag: needsListing
    api:
      exercised: [listing.v1.UpdateListing, listing.v1.GetListing]
    acceptance:
      - Given a seller owns a listing
      - When the seller updates its price and saves
      - Then the listing reflects the new price
    tags: [seller]
    status: automated
    covered_by: "seller/edit-listing.feature::Seller renames a listing"

  - id: listing.delete
    title: Delete a listing
    persona: seller
    priority: P2
    summary: A seller removes a listing and it disappears from their catalog.
    entry_route: /seller
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
      seed_tag: needsListing
    api:
      exercised: [listing.v1.DeleteListing]
    acceptance:
      - Given a seller owns a listing
      - When the seller deletes it
      - Then it no longer appears in the seller's listings
    tags: [seller]
    status: automated
    covered_by: "seller/listing_delete.feature::Seller deletes an existing listing"

  - id: listing.stock-reservation
    title: Atomic stock reservation
    persona: buyer
    priority: P1
    summary: Reserve/release stock holds during the purchase saga.
    entry_route: /checkout
    services: [team-domain, team-order]
    preconditions:
      login: buyer
      seed_tag: needsListing
      data: Exercised indirectly by the order saga (no standalone UI).
    api:
      exercised: [listing.v1.ReserveStock, listing.v1.ReleaseStock]
    acceptance:
      - Given a listing with limited stock
      - When an order reserves stock and then is cancelled
      - Then the reserved stock is released back
    tags: [buyer]
    status: not-testable
    covered_by: null
    notes: >
      Backend invariant; assert via order.saga-compensation rather than directly.
      Hardened: ReserveStock is now idempotent on a caller-supplied reservation_id
      (re-reserve with the same id is a no-op) so a retried checkout cannot
      double-decrement stock, and reservations carry a TTL swept by team-order
      (SA-M6/C2). See ADR-0008 (inventory reservation), ADR-0007 (durable saga).

  - id: listing.event-durability
    title: Listing events survive a publish failure (transactional outbox)
    persona: seller
    priority: P1
    summary: >
      A listing write records its domain event in an outbox row in the SAME DB
      transaction, and a relayer delivers it at-least-once — so an event is never
      lost if Kafka is down between commit and publish (ADR-0002).
    entry_route: /seller/new
    services: [team-domain, team-search]
    preconditions:
      login: seller
      data: Requires toggling Kafka/broker availability during the write.
    api:
      exercised: [listing.v1.CreateListing]
    acceptance:
      - Given a seller creates a listing while the Kafka broker is unavailable
      - Then no event is lost — the outbox_events row stays 'pending'
      - When the broker is restored and the relayer runs
      - Then the event is delivered once (row → 'published') and team-search reflects the listing
    tags: [system, durability]
    status: not-testable
    covered_by: null
    notes: >
      Delivery is at-least-once; consumers dedupe on the stable EventEnvelope.event_id
      (== outbox row id). platform-e2e integration test (broker-down create → restore →
      assert delivered once) is a follow-up in the platform-e2e repo.

  - id: listing.shop-display-name
    title: Seller shop display name and batch lookup
    persona: seller
    priority: P1
    summary: >
      A seller sets a public shop display name on their storefront; visitors read it
      via GetStorefront and resolve many names at once with BatchGetStorefronts.
    entry_route: "/shop/{id}"
    related_routes: [/cart, /account/following]
    services: [team-domain, team-gateway, team-frontend]
    preconditions:
      login: seller
    api:
      seed: [listing.v1.UpsertStorefront]
      exercised: [listing.v1.UpsertStorefront, listing.v1.GetStorefront, listing.v1.BatchGetStorefronts]
    acceptance:
      - The name is returned for a storefront (trimmed) via GetStorefront
      - A name change is reflected by the next GetStorefront and BatchGetStorefronts
      - Invalid names are rejected (over 80 characters or a control character) with InvalidArgument
      - A seller cannot set another seller's name (seller id forced from the principal)
      - An unknown or deleted seller gives an empty name (omitted from the batch response)
      - Duplicates are collapsed and more than 100 ids fails with InvalidArgument
    tags: [seller, shop, contract]
    status: automated
    covered_by: "shop/shop_display_name.feature::The name is returned for a storefront"
    notes: >
      Backend scenarios are covered by team-domain handler tests; the UI-visible
      scenarios live in team-frontend FEATURES (shop.storefront, cart.shop-names, ...).

  - id: listing.visibility-stranger-draft
    title: A stranger cannot read a draft
    persona: buyer
    priority: P0
    summary: >-
      GetListing answers not_found for a draft listing unless the caller owns it, is an admin or a service.
    entry_route: /seller/new
    services: [team-domain, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing]
    acceptance:
      - WHEN a buyer calls GetListing through the gateway for another seller's draft listing
      - THEN the gateway answers HTTP 404
    tags: [security, authz]
    status: automated
    covered_by: "security/listing_visibility.feature::A stranger cannot read a draft"

  - id: listing.visibility-owner-draft
    title: The owner can read their draft
    persona: seller
    priority: P0
    summary: >-
      The seller who owns a draft can still read it.
    entry_route: /seller/new
    services: [team-domain, team-gateway]
    preconditions:
      login: seller
    api:
      exercised: [listing.v1.GetListing]
    acceptance:
      - WHEN the seller who owns a draft listing calls GetListing for it through the gateway
      - THEN the listing is returned with status draft
    tags: [security, seller]
    status: automated
    covered_by: "security/listing_visibility.feature::The owner can read their draft"

  - id: listing.visibility-list-published-only
    title: Listing without a status returns only published listings
    persona: guest
    priority: P0
    summary: >-
      ListListings defaults to published listings, so unpublished items stay private.
    entry_route: /
    services: [team-domain, team-gateway]
    preconditions:
      login: guest
    api:
      exercised: [listing.v1.ListListings]
    acceptance:
      - WHEN an anonymous client calls ListListings through the gateway without a status filter
      - THEN every returned listing has status published
    tags: [security, contract]
    status: automated
    covered_by: "security/listing_visibility.feature::Listing without a status returns only published listings"

  - id: inventory.checkout-holds-stock-once
    title: A checkout holds the ordered quantity exactly once
    persona: buyer
    priority: P0
    summary: >-
      A buyer's checkout decrements the listing's stock by the ordered quantity once.
    entry_route: /cart
    services: [team-domain, team-order, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder]
    acceptance:
      - WHEN a buyer checks out quantity 2 of a listing whose stock is 10 through the gateway
      - THEN the listing's stock read through the gateway is 8
    tags: [order]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A checkout holds the ordered quantity exactly once"
    notes: >-
      Scenario in inventory/oic_inv_inventory_reservations.feature. Written ahead of the code (port-order-inventory-correctness); flip to automated once green after the code lands. Observed GREEN on the
      pre-change stack (stock 10 -> 8).

  - id: inventory.placed-order-keeps-stock
    title: A placed order keeps its stock after the reservation TTL
    persona: buyer
    priority: P0
    summary: >-
      CommitReservation makes a placed order's stock permanent: the TTL sweep never restores it.
    entry_route: /cart
    services: [team-domain, team-order, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder, order.v1.GetOrder]
    acceptance:
      - WHEN a buyer checks out quantity 2 of a listing with stock 10, and more than the configured reservation TTL plus two sweep intervals of both services pass
      - THEN the listing's stock read through the gateway is still 8 and the order is still Pending
    tags: [order, destructive]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A placed order keeps its stock after the reservation TTL"
    notes: >-
      Needs the short-TTL overlay platform-e2e/compose/order-inventory.override.yaml (RESERVATION_TTL=20s,
      RESERVATION_SWEEP_INTERVAL=2s); tagged @destructive (serial/overlay lane). Scenario in
      inventory/oic_inv_inventory_reservations.feature. RED on the pre-change stack (default 15m TTL, waited 17m): stock 10 instead of 8, the sweep returned a placed order's stock (no CommitReservation yet).

  - id: inventory.failed-checkout-returns-stock-once
    title: A failed checkout returns its stock once even after the TTL sweep
    persona: buyer
    priority: P0
    summary: >-
      A two-seller checkout that fails on the second seller's stock gives the first seller's stock back exactly once, also across the TTL sweep.
    entry_route: /cart
    services: [team-domain, team-order, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder]
    acceptance:
      - WHEN a buyer's two-seller checkout fails because the second seller's item is out of stock, and more than the configured reservation TTL plus two sweep intervals then pass
      - THEN the first seller's listing stock read through the gateway equals its stock before the checkout
    tags: [order, destructive]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A failed checkout returns its stock once even after the TTL sweep"
    notes: >-
      Needs the short-TTL overlay platform-e2e/compose/order-inventory.override.yaml (RESERVATION_TTL=20s,
      RESERVATION_SWEEP_INTERVAL=2s); tagged @destructive (serial/overlay lane). The failing item belongs
      to the seller whose id sorts last. Scenario in inventory/oic_inv_inventory_reservations.feature.
      On the pre-change stack it passed by chance (17m run): the map-ordered saga reserved the failing seller first; red whenever the first seller is reserved before the failure (double restore, as in the cancel case).

  - id: inventory.cancel-returns-stock-once
    title: A cancelled order's stock is returned once even after the TTL sweep
    persona: buyer
    priority: P0
    summary: >-
      Cancelling a Pending order restores its reserved stock once; the TTL sweep must not restore it a second time.
    entry_route: /account/orders
    services: [team-domain, team-order, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder, order.v1.CancelOrder]
    acceptance:
      - WHEN a buyer cancels a Pending order for quantity 2 of a listing with stock 10, and more than the configured reservation TTL plus two sweep intervals then pass
      - THEN the listing's stock read through the gateway is 10
    tags: [order, destructive]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A cancelled order's stock is returned once even after the TTL sweep"
    notes: >-
      Needs the short-TTL overlay platform-e2e/compose/order-inventory.override.yaml (RESERVATION_TTL=20s,
      RESERVATION_SWEEP_INTERVAL=2s); tagged @destructive (serial/overlay lane). Scenario in
      inventory/oic_inv_inventory_reservations.feature. RED on the pre-change stack (17m run): stock 12 instead of 10, release by quantity plus the sweep restored the reservation twice.

  - id: inventory.invalid-ttl-falls-back
    title: An invalid reservation TTL falls back to the default
    persona: admin
    priority: P1
    summary: >-
      team-domain started with an unparsable TTL and a non-positive sweep interval still boots, warns about both variables and logs the 15m/1m defaults.
    entry_route: /
    services: [team-domain]
    preconditions:
      login: guest
    api:
      exercised: [listing.v1.ListingService]
    acceptance:
      - WHEN the team-domain image is started with RESERVATION_TTL=banana and RESERVATION_SWEEP_INTERVAL=0s
      - THEN it starts, logs a warning naming each variable, and logs the effective TTL 15m0s and interval 1m0s
    tags: [order]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::An invalid reservation TTL falls back to the default"
    notes: >-
      Scenario in inventory/oic_inv_inventory_reservations.feature. Runs the real team-domain image with
      docker run against a throwaway database created in the stack's postgres (dropped afterwards); the
      live service is untouched. RED on the pre-change stack: the service ignores both variables, logs no warning and no effective values.

  - id: inventory.overlay-sweeper-cadence
    title: The e2e stack runs the sweeper on the configured short cadence
    persona: admin
    priority: P1
    summary: >-
      With the e2e overlay, team-domain and team-order each log the overlay values as their effective reservation TTL and sweep interval.
    entry_route: /
    services: [team-domain, team-order]
    preconditions:
      login: guest
    api:
      exercised: [listing.v1.ListingService, order.v1.OrderService]
    acceptance:
      - WHEN the stack is started with the e2e overlay that sets a short RESERVATION_TTL and RESERVATION_SWEEP_INTERVAL for team-domain and team-order
      - THEN each service logs the overlay values as its effective reservation TTL and sweep interval
    tags: [order, destructive]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::The e2e stack runs the sweeper on the configured short cadence"
    notes: >-
      Needs the short-TTL overlay platform-e2e/compose/order-inventory.override.yaml (RESERVATION_TTL=20s,
      RESERVATION_SWEEP_INTERVAL=2s); tagged @destructive (serial/overlay lane). Scenario in
      inventory/oic_inv_inventory_reservations.feature. RED on the pre-change stack: no overlay applied (RESERVATION_TTL unset on the containers).

  - id: inventory.checkout-announces-stock
    title: A checkout announces the listing's new stock
    persona: buyer
    priority: P1
    summary: >-
      A reserve writes a ListingStockChanged envelope (stock after the change) to listing.events keyed by listing id.
    entry_route: /cart
    services: [team-domain, team-order, team-gateway, redpanda]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder]
    acceptance:
      - WHEN a buyer checks out quantity 2 of a listing with stock 10
      - THEN a ListingStockChanged envelope keyed by that listing id with stock 8 appears on listing.events
    tags: [order]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A checkout announces the listing's new stock"
    notes: >-
      Scenario in inventory/oic_inv_inventory_reservations.feature. Reads listing.events from Kafka
      (KAFKA_BROKERS). RED on the pre-change stack: nothing emits ListingStockChanged.

  - id: inventory.cancel-announces-stock
    title: A cancel announces the restored stock
    persona: buyer
    priority: P1
    summary: >-
      A release writes a later ListingStockChanged envelope with the restored stock.
    entry_route: /account/orders
    services: [team-domain, team-order, team-gateway, redpanda]
    preconditions:
      login: buyer
    api:
      exercised: [listing.v1.GetListing, order.v1.CreateOrder, order.v1.CancelOrder]
    acceptance:
      - WHEN the buyer then cancels that order
      - THEN a later ListingStockChanged envelope for the listing with stock 10 appears on listing.events
    tags: [order]
    status: automated
    covered_by: "inventory/oic_inv_inventory_reservations.feature::A cancel announces the restored stock"
    notes: >-
      Scenario in inventory/oic_inv_inventory_reservations.feature. Reads listing.events from Kafka
      (KAFKA_BROKERS). RED on the pre-change stack: nothing emits ListingStockChanged.
