# Feature manifest for team-domain (listing write-model — capability owner).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-domain
owner: domain-team

features:
  - id: listing.create
    title: Create a listing
    persona: seller
    priority: P0
    summary: A seller publishes a product via the new-listing form.
    entry_route: /seller/new
    related_routes: [/seller]
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [listing.v1.CreateListing]
    ui:
      key_elements:
        title: "#title"
        category: "#categoryId"
        price: "#price"
        stock: "#stock"
        submit: "role:button=Đăng bán ngay"
    acceptance:
      - Given a seeded seller is logged in
      - When the seller creates a new listing
      - Then the new listing appears in the seller's listings
    tags: [seller, smoke]
    status: automated
    covered_by: "seller/create-listing.feature::Seller creates a new listing"

  - id: listing.edit
    title: Edit an existing listing
    persona: seller
    priority: P1
    summary: A seller updates price/stock/status of one of their listings.
    entry_route: "/seller/{listing_id}/edit"
    related_routes: [/seller]
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
      seed_tag: needsListing
    api:
      exercised: [listing.v1.UpdateListing, listing.v1.GetListing]
    acceptance:
      - Given a seller owns a listing
      - When the seller updates its price and saves
      - Then the listing reflects the new price
    tags: [seller]
    status: automated
    covered_by: "seller/edit-listing.feature::Seller renames a listing"

  - id: listing.delete
    title: Delete a listing
    persona: seller
    priority: P2
    summary: A seller removes a listing and it disappears from their catalog.
    entry_route: /seller
    services: [team-domain, team-frontend]
    preconditions:
      login: seller
      seed_tag: needsListing
    api:
      exercised: [listing.v1.DeleteListing]
    acceptance:
      - Given a seller owns a listing
      - When the seller deletes it
      - Then it no longer appears in the seller's listings
    tags: [seller]
    status: automated
    covered_by: "seller/listing_delete.feature::Seller deletes an existing listing"

  - id: listing.stock-reservation
    title: Atomic stock reservation
    persona: buyer
    priority: P1
    summary: Reserve/release stock holds during the purchase saga.
    entry_route: /checkout
    services: [team-domain, team-order]
    preconditions:
      login: buyer
      seed_tag: needsListing
      data: Exercised indirectly by the order saga (no standalone UI).
    api:
      exercised: [listing.v1.ReserveStock, listing.v1.ReleaseStock]
    acceptance:
      - Given a listing with limited stock
      - When an order reserves stock and then is cancelled
      - Then the reserved stock is released back
    tags: [buyer]
    status: not-testable
    covered_by: null
    notes: >
      Backend invariant; assert via order.saga-compensation rather than directly.
      Hardened: ReserveStock is now idempotent on a caller-supplied reservation_id
      (re-reserve with the same id is a no-op) so a retried checkout cannot
      double-decrement stock, and reservations carry a TTL swept by team-order
      (SA-M6/C2). See ADR-0008 (inventory reservation), ADR-0007 (durable saga).

  - id: listing.event-durability
    title: Listing events survive a publish failure (transactional outbox)
    persona: seller
    priority: P1
    summary: >
      A listing write records its domain event in an outbox row in the SAME DB
      transaction, and a relayer delivers it at-least-once — so an event is never
      lost if Kafka is down between commit and publish (ADR-0002).
    entry_route: /seller/new
    services: [team-domain, team-search]
    preconditions:
      login: seller
      data: Requires toggling Kafka/broker availability during the write.
    api:
      exercised: [listing.v1.CreateListing]
    acceptance:
      - Given a seller creates a listing while the Kafka broker is unavailable
      - Then no event is lost — the outbox_events row stays 'pending'
      - When the broker is restored and the relayer runs
      - Then the event is delivered once (row → 'published') and team-search reflects the listing
    tags: [system, durability]
    status: not-testable
    covered_by: null
    notes: >
      Delivery is at-least-once; consumers dedupe on the stable EventEnvelope.event_id
      (== outbox row id). platform-e2e integration test (broker-down create → restore →
      assert delivered once) is a follow-up in the platform-e2e repo.

  - id: listing.shop-display-name
    title: Seller shop display name and batch lookup
    persona: seller
    priority: P1
    summary: >
      A seller sets a public shop display name on their storefront; visitors read it
      via GetStorefront and resolve many names at once with BatchGetStorefronts.
    entry_route: "/shop/{id}"
    related_routes: [/cart, /account/following]
    services: [team-domain, team-gateway, team-frontend]
    preconditions:
      login: seller
    api:
      seed: [listing.v1.UpsertStorefront]
      exercised: [listing.v1.UpsertStorefront, listing.v1.GetStorefront, listing.v1.BatchGetStorefronts]
    acceptance:
      - The name is returned for a storefront (trimmed) via GetStorefront
      - A name change is reflected by the next GetStorefront and BatchGetStorefronts
      - Invalid names are rejected (over 80 characters or a control character) with InvalidArgument
      - A seller cannot set another seller's name (seller id forced from the principal)
      - An unknown or deleted seller gives an empty name (omitted from the batch response)
      - Duplicates are collapsed and more than 100 ids fails with InvalidArgument
    tags: [seller, shop, contract]
    status: automated
    covered_by: "shop/shop_display_name.feature::The name is returned for a storefront"
    notes: >
      Backend scenarios are covered by team-domain handler tests; the UI-visible
      scenarios live in team-frontend FEATURES (shop.storefront, cart.shop-names, ...).

  - id: listing.shop-display-name-change
    title: A name change is reflected
    persona: seller
    priority: P1
    summary: >-
      Renaming a storefront is visible on the next GetStorefront, BatchGetStorefronts and /shop/<id> load, with no cache purge.
    entry_route: "/shop/{id}"
    services: [team-domain, team-gateway]
    api:
      exercised: [listing.v1.UpsertStorefront, listing.v1.BatchGetStorefronts]
    acceptance:
      - Given seller S upserted a storefront named "Tiem Hoa Nho"
      - When S upserts it again with "Tiem Hoa Lon"
      - Then the next GetStorefront, BatchGetStorefronts and the /shop/<S> page show "Tiem Hoa Lon"
    tags: [seller, shop]
    status: automated
    covered_by: "shop/shop_display_name.feature::A name change is reflected"

  - id: listing.shop-display-name-invalid
    title: Invalid names are rejected
    persona: seller
    priority: P1
    summary: >-
      An 81-character name or one with a control character is refused with invalid_argument and the stored name stays.
    entry_route: "/shop/{id}"
    services: [team-domain, team-gateway]
    api:
      exercised: [listing.v1.UpsertStorefront]
    acceptance:
      - When a seller upserts a storefront with a display_name over 80 characters or containing a control character
      - Then the call fails with InvalidArgument and the stored name is unchanged
    tags: [seller, shop, security]
    status: automated
    covered_by: "shop/shop_display_name.feature::Invalid names are rejected"

  - id: listing.shop-display-name-no-spoof
    title: A seller cannot set another seller's name
    persona: seller
    priority: P1
    summary: >-
      The seller id is forced from the principal: a body naming another seller stores the name on the caller's own storefront.
    entry_route: "/shop/{id}"
    services: [team-domain, team-gateway]
    api:
      exercised: [listing.v1.UpsertStorefront, listing.v1.GetStorefront]
    acceptance:
      - When seller A sends an UpsertStorefront naming seller B's seller_id with a display_name
      - Then the name is stored on A's storefront and B's name is unchanged
    tags: [seller, shop, security]
    status: automated
    covered_by: "shop/shop_display_name.feature::A seller cannot set another seller's name"

  - id: listing.batch-storefronts-unknown
    title: An unknown or deleted seller gives an empty name
    persona: buyer
    priority: P1
    summary: >-
      BatchGetStorefronts omits sellers with no storefront and still succeeds.
    entry_route: "/shop/{id}"
    services: [team-domain, team-gateway]
    api:
      exercised: [listing.v1.BatchGetStorefronts]
    acceptance:
      - When BatchGetStorefronts is called with seller ids A (has a name) and Z (no storefront row)
      - Then the response contains an entry for A only and the call succeeds
    tags: [shop, contract]
    status: automated
    covered_by: "shop/shop_display_name.feature::An unknown or deleted seller gives an empty name"
    notes: >-
      The frontend wrapper mapping the omitted id to an empty displayName is covered by Vitest (shops.test.ts).

  - id: listing.batch-storefronts-limits
    title: Duplicates and oversize requests
    persona: buyer
    priority: P1
    summary: >-
      Duplicate ids collapse to one entry and more than 100 ids fails with invalid_argument.
    entry_route: "/shop/{id}"
    services: [team-domain, team-gateway]
    api:
      exercised: [listing.v1.BatchGetStorefronts]
    acceptance:
      - When BatchGetStorefronts is called with the same seller id three times
      - Then it returns a single entry for that seller
      - When it is called with 101 distinct ids
      - Then it fails with InvalidArgument
    tags: [shop, contract]
    status: automated
    covered_by: "shop/shop_display_name.feature::Duplicates and oversize requests"

  - id: listing.visibility-stranger-draft
    title: A stranger cannot read a draft
    persona: buyer
    priority: P0
