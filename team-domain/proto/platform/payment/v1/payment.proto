syntax = "proto3";

// team-payment (Go) owns this: mock payment transactions (Phase 5).
// Financially sensitive => MOCK ONLY (no real money movement).
package platform.payment.v1;

import "google/protobuf/timestamp.proto";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_COD = 1;         // Cash on Delivery
  PAYMENT_METHOD_MOCK_MOMO = 2;   // Mock MoMo QR
  PAYMENT_METHOD_MOCK_BANK = 3;   // Mock Bank Transfer
  PAYMENT_METHOD_MOCK_CARD = 4;   // Mock Credit/Debit Card
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_REFUNDED = 4;
}

message PaymentTransaction {
  string id = 1;
  string order_id = 2;
  string buyer_id = 3;
  int64 amount = 4;
  string currency = 5;
  PaymentMethod method = 6;
  PaymentStatus status = 7;
  string provider_reference = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ProcessMockPayment(ProcessMockPaymentRequest) returns (ProcessMockPaymentResponse);
}

message CreatePaymentRequest {
  string order_id = 1;
  PaymentMethod method = 2;
}

message CreatePaymentResponse {
  PaymentTransaction transaction = 1;
  string payment_url = 2; // URL to the mock payment checkout page
}

message GetPaymentRequest {
  string id = 1;
  string order_id = 2;
}

message GetPaymentResponse {
  PaymentTransaction transaction = 1;
}

message ProcessMockPaymentRequest {
  string transaction_id = 1;
  bool simulate_success = 2; // true to simulate successful payment, false for failure
}

message ProcessMockPaymentResponse {
  PaymentTransaction transaction = 1;
  bool success = 2;
  string message = 3;
}
