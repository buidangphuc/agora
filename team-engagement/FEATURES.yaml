# Feature manifest for team-engagement (favorites, reviews, Q&A, disputes).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-engagement
owner: engagement-team

features:
  - id: engagement.favorites
    title: Favorite / unfavorite a listing
    persona: buyer
    priority: P1
    summary: A buyer toggles a favorite and sees it in the favorites list.
    entry_route: "/listing/{listing_id}"
    related_routes: [/favorites]
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised:
        - engagement.v1.AddFavorite
        - engagement.v1.RemoveFavorite
        - engagement.v1.ListFavorites
    acceptance:
      - Given a buyer is logged in on a listing page
      - When the buyer favorites the listing
      - Then it appears on the favorites page
    tags: [buyer]
    status: automated
    covered_by: "engagement/favorites.feature::Buyer favorites a product and finds it in favorites"

  - id: engagement.reviews
    title: Verified star reviews
    persona: buyer
    priority: P1
    summary: A buyer leaves a star review with photos on a purchased product.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.CreateReview, engagement.v1.ListReviews, engagement.v1.GetListingRatingSummary]
    acceptance:
      - Given a buyer has purchased a product
      - When the buyer submits a star review
      - Then the review and updated rating appear on the listing
    tags: [buyer]
    status: automated
    covered_by: "engagement/reviews.feature::Buyer submits verified star review with rating"

  - id: engagement.qa
    title: Product Q&A threads
    persona: buyer
    priority: P2
    summary: A buyer asks a question and the seller answers it on the listing.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.AskQuestion, engagement.v1.AnswerQuestion, engagement.v1.ListQuestionsByListing]
    acceptance:
      - Given a buyer is on a listing page
      - When the buyer asks a question and the seller answers
      - Then the Q&A thread shows both entries
    tags: [buyer]
    status: automated
    covered_by: "engagement/qa.feature::Buyer asks question and seller answers on product listing"

  - id: engagement.disputes
    title: Dispute resolution
    persona: buyer
    priority: P2
    summary: A buyer opens a dispute and an admin resolves it.
    entry_route: /account/orders
    services: [team-engagement]
    preconditions:
      login: buyer
    api:
      exercised: [engagement.v1.CreateDispute, engagement.v1.GetDispute, engagement.v1.ResolveDispute]
    acceptance:
      - Given a buyer has an issue with an order
      - When the buyer opens a dispute
      - Then an admin can resolve it and the status updates
    tags: [buyer]
    status: automated
    covered_by: "engagement/disputes.feature::Buyer opens a dispute and admin resolves it"

  - id: engagement.collections
    title: Wishlist collections
    persona: buyer
    priority: P1
    summary: A buyer groups saved listings into named collections, adds/removes items, and views a collection.
    entry_route: /favorites
    related_routes: ["/listing/{listing_id}"]
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised:
        - engagement.v1.CreateCollection
        - engagement.v1.ListCollections
        - engagement.v1.AddToCollection
        - engagement.v1.RemoveFromCollection
        - engagement.v1.ListCollectionItems
    acceptance:
      - Given a buyer with a seeded listing
      - When the buyer creates a collection and adds the listing
      - Then the collection shows the listing, and removing it empties the collection
    tags: [buyer, engagement]
    status: automated
    covered_by: "engagement/collections.feature::Buyer creates a collection, adds a listing, views it, then removes it"

  - id: engagement.reviews-media
    title: Review with photos
    persona: buyer
    priority: P1
    summary: A buyer's review with an attached photo renders on the listing page.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.CreateReview, engagement.v1.ListReviews]
    acceptance:
      - Given a buyer posted a review with a photo
      - When the listing is opened
      - Then the review and its photo are shown
    tags: [buyer, engagement]
    status: automated
    covered_by: "engagement/rich_reviews.feature::A review with a photo renders on the listing"

  - id: engagement.reviews-helpful
    title: Helpful votes on reviews
    persona: buyer
    priority: P2
    summary: A buyer marks another user's review helpful; the count increments once per user.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.MarkReviewHelpful, engagement.v1.ListReviews]
    acceptance:
      - Given a buyer viewing another user's review
      - When the buyer marks it helpful
      - Then the count increases by one and cannot be voted again
    tags: [buyer, engagement]
    status: automated
    covered_by: "engagement/rich_reviews.feature::Marking a review helpful increments the count once per user"

  - id: engagement.shop-rating-summary
    title: Shop rating rollup
    persona: buyer
    priority: P2
    summary: The listing page shows the seller's aggregate rating summary (average + count).
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.GetShopRatingSummary]
    acceptance:
      - Given a listing with a review
      - When the listing is opened
      - Then the shop rating summary is shown
    tags: [buyer, engagement]
    status: automated
    covered_by: "engagement/rich_reviews.feature::A review with a photo renders on the listing"

  - id: engagement.reviews-verified-purchase
    title: Verified-purchase badge
    persona: buyer
    priority: P2
    summary: A review by a buyer with a completed order shows a verified-purchase badge.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-order, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsOrder
    api:
      exercised: [engagement.v1.CreateReview, engagement.v1.ListReviews, order.v1.GetOrder]
    acceptance:
      - Given a buyer reviewed a listing they completed an order for
      - When the listing is opened
      - Then the review shows a verified-purchase badge
    tags: [buyer, engagement]
    # Scenario is authored (engagement/rich_reviews.feature) and bound as xfail:
    # the running team-engagement has no UPSTREAM_ORDER_ADDR, so its team-order
    # verifier is disabled and verified_purchase is always false. Flip to
    status: automated
    covered_by: "engagement/rich_reviews.feature::A delivered order earns a verified-purchase badge"

  - id: engagement.reviews-breakdown
    title: Product reviews breakdown & filters
    persona: buyer
    priority: P2
    summary: Buyer inspects product star rating breakdown and review filters on listing detail.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.GetListingRatingSummary]
    acceptance:
      - Given a buyer is logged in
      - And a listing has been seeded via the API
      - When the buyer opens the seeded listing
      - Then the listing page displays the reviews breakdown section and rating filter buttons
    tags: [buyer, engagement]
    status: automated
    covered_by: "buyer/review_ratings_filter.feature::Buyer inspects product star rating breakdown and review filters"

  - id: engagement.dispute-buyer-opens-against-seller
    title: The buyer opens a dispute against the order's seller
    persona: buyer
    priority: P0
    summary: >-
      CreateDispute naming the order's seller is accepted and both the buyer and the seller can read it.
    entry_route: /account/orders
    services: [team-engagement, team-order, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsOrder
    api:
      exercised: [engagement.v1.CreateDispute, engagement.v1.GetDispute]
    acceptance:
      - Given a buyer who placed an order on a seller's listing
      - When the buyer of an order opens a dispute naming the order's seller
      - Then the dispute is created and both the buyer and the seller can read it
    tags: [engagement, authz]
    status: automated
    covered_by: "security/dispute_access.feature::The buyer opens a dispute against the order's seller"
    notes: >
      port-security-hardening dispute-and-qa-access: disputes are tied to a real order and its parties.

  - id: engagement.dispute-wrong-defendant-denied
    title: A buyer cannot name a different defendant
    persona: buyer
    priority: P0
    summary: >-
      CreateDispute naming a user who is not the order's seller is denied with 403.
    entry_route: /account/orders
    services: [team-engagement, team-order, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsOrder
    api:
      exercised: [engagement.v1.CreateDispute]
    acceptance:
      - Given a buyer who placed an order on a seller's listing
      - When the buyer of an order opens a dispute naming a user who is not the order's seller
      - Then the gateway answers HTTP 403
    tags: [engagement, authz]
    status: automated
    covered_by: "security/dispute_access.feature::A buyer cannot name a different defendant"
    notes: >
      port-security-hardening dispute-and-qa-access: disputes are tied to a real order and its parties.

  - id: engagement.dispute-stranger-cannot-open
    title: A stranger cannot open a dispute on someone else's order
    persona: buyer
    priority: P0
    summary: >-
      CreateDispute on an order the caller did not place answers 404, so order ids cannot be probed.
    entry_route: /account/orders
    services: [team-engagement, team-order, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsOrder
    api:
      exercised: [engagement.v1.CreateDispute]
    acceptance:
      - Given a buyer who placed an order on a seller's listing and a second buyer who did not
      - When a buyer who did not place the order opens a dispute on it
      - Then the gateway answers HTTP 404
    tags: [engagement, authz]
    status: automated
    covered_by: "security/dispute_access.feature::A stranger cannot open a dispute on someone else's order"
    notes: >
      port-security-hardening dispute-and-qa-access: disputes are tied to a real order and its parties.

  - id: engagement.dispute-stranger-cannot-read
    title: A stranger cannot read a dispute
    persona: buyer
    priority: P0
    summary: >-
      GetDispute by a user who is neither party nor admin answers 404, the same as a missing id.
    entry_route: /account/orders
    services: [team-engagement, team-order, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsOrder
    api:
      exercised: [engagement.v1.GetDispute]
    acceptance:
      - Given an existing dispute and a second buyer who is neither party nor admin
      - When a logged-in user who is neither party nor admin calls GetDispute for an existing dispute
      - Then the gateway answers HTTP 404
    tags: [engagement, authz]
    status: automated
    covered_by: "security/dispute_access.feature::A stranger cannot read a dispute"
    notes: >
      port-security-hardening dispute-and-qa-access: disputes are tied to a real order and its parties.

  - id: engagement.qa-non-owner-no-shop-reply
    title: A non-owner cannot post a shop reply
    persona: buyer
    priority: P0
    summary: >-
      AnswerQuestion with is_shop_reply from a caller who does not own the listing is stored as an ordinary answer.
    entry_route: "/listing/{listing_id}"
    services: [team-engagement, team-order, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [engagement.v1.AnswerQuestion, engagement.v1.ListQuestionsByListing]
    acceptance:
      - Given a question on a seller's listing
      - When a buyer answers a question on another seller's listing with is_shop_reply set
      - Then the stored answer is not marked as a shop reply
    tags: [engagement, authz]
    status: automated
    covered_by: "security/dispute_access.feature::A non-owner cannot post a shop reply"
    notes: >
      port-security-hardening dispute-and-qa-access: disputes are tied to a real order and its parties.

  # ---- engagement-fact-events (planned until the merged stack run flips them) ----
  - id: engagement.fact-favorite-added
    title: "Favouriting a listing publishes a fact"
    persona: buyer
    priority: P1
    summary: "Favouriting a listing publishes a fact."
    entry_route: "/"
    services: [team-engagement, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - When a logged-in buyer adds a listing to their favourites through the gateway
      - Then one FavoriteAdded envelope for that buyer and listing appears on engagement.events
    tags: [engagement, kafka]
    status: planned
    covered_by: null
    notes: "engagement-fact-events: engagement/engagement_facts.feature::Favouriting a listing publishes a fact"

  - id: engagement.fact-favorite-removed
    title: "Removing a favourite publishes a removal"
    persona: buyer
    priority: P1
    summary: "Removing a favourite publishes a removal."
    entry_route: "/"
    services: [team-engagement, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - When the buyer then removes that favourite
      - Then a FavoriteRemoved envelope for that buyer and listing follows it on engagement.events
    tags: [engagement, kafka]
    status: planned
    covered_by: null
    notes: "engagement-fact-events: engagement/engagement_facts.feature::Removing a favourite publishes a removal"

  - id: engagement.fact-favorite-repeat-noop
    title: "A repeated favourite publishes nothing new"
    persona: buyer
    priority: P1
    summary: "A repeated favourite publishes nothing new."
    entry_route: "/"
    services: [team-engagement, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - When a buyer adds the same listing to their favourites twice
      - Then exactly one FavoriteAdded envelope for that buyer and listing appears on engagement.events
    tags: [engagement, kafka]
    status: planned
    covered_by: null
    notes: "engagement-fact-events: engagement/engagement_facts.feature::A repeated favourite publishes nothing new"

  - id: engagement.fact-review-rating-only
    title: "A review publishes its rating without its text"
    persona: buyer
    priority: P1
    summary: "A review publishes its rating without its text."
    entry_route: "/"
    services: [team-engagement, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - When a buyer with a delivered order reviews the listing with rating 4 and the text "rất tốt"
      - Then a ReviewCreated envelope with rating 4, the listing and its seller appears on engagement.events, and the payload does not contain "rất tốt"
    tags: [engagement, kafka]
    status: planned
    covered_by: null
    notes: "engagement-fact-events: engagement/engagement_facts.feature::A review publishes its rating without its text"

  - id: engagement.fact-published-after-kafka-outage
    title: "A fact written while Kafka is down is published later"
    persona: buyer
    priority: P1
    summary: "A fact written while Kafka is down is published later."
    entry_route: "/"
    services: [team-engagement, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - When Redpanda is stopped, a buyer follows a seller, and Redpanda is started again
      - Then one SellerFollowed envelope for that buyer and seller appears on engagement.events
    tags: [engagement, kafka]
    status: planned
    covered_by: null
    notes: "engagement-fact-events: engagement/engagement_facts.feature::A fact written while Kafka is down is published later"
