version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/buidangphuc/team-engagement/generated
plugins:
  - remote: buf.build/protocolbuffers/go
    out: generated
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: generated
    opt: paths=source_relative
inputs:
  - directory: proto
