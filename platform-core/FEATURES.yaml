      DATABASE_ENABLED=true and no DATABASE_URL
    - Then Load returns an error naming DATABASE_URL
    tags:
    - go-sdk
    - unit
    status: not-testable
    notes: Platform library behaviour with no user journey; verified by unit test TestLoadRunsValidate.
