  # Go platform SDK (change add-go-platform-sdk-core): library behaviour with no UI journey;
  # every entry is not-testable and names its unit test.
  - id: go-sdk.defaults-apply-and-env-overrides-them
    title: Defaults apply and env overrides them
    persona: guest
    priority: P2
    entry_route: /
    services:
    - platform-core
    acceptance:
    - When a struct embedding config.Runtime and config.GRPC is loaded with only GRPC_PORT=50065 and LOG_LEVEL=debug
      set
    - Then GRPC.Port is 50065, Runtime.LogLevel is debug, GRPC.Host is 0.0.0.0 and GRPC.ShutdownGrace()
      is 10s
    tags:
    - go-sdk
    - unit
    status: not-testable
    notes: Platform library behaviour with no user journey; verified by unit test platform-core/packages/go-sdk/pkg/config
      TestLoadDefaultsAndOverrides.
  - id: go-sdk.unparseable-values-fail-with-the-variable-name
    title: Unparseable values fail with the variable name
    persona: guest
    priority: P2
    entry_route: /
    services:
    - platform-core
    acceptance:
    - When GRPC_PORT=abc is set
    - Then Load returns an error whose message contains GRPC_PORT
    tags:
    - go-sdk
    - unit
    status: not-testable
    notes: Platform library behaviour with no user journey; verified by unit test TestLoadReportsBadVariable.
  - id: go-sdk.enabled-database-without-a-url-fails-validation
