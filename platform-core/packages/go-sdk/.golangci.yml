version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - gosec
    - contextcheck
    - sloglint
    - errorlint
  settings:
    sloglint:
      no-mixed-args: true
      kv-only: true
      context: scope
      forbidden-keys:
        - user_id
        - buyer_id
        - seller_id
        - actor_id
        - principal_id
        - owner_id
        - recipient_id
        - sender_id
        - username
        - email
        - phone
        - ip
        - client_ip
        - ga_client_id
        - address
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/buidangphuc
