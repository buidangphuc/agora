# buf codegen — runs IN THIS REPO, writes ONLY into ./generated (see ADR-0001).
#
# platform-core NEVER generates into this template. You vendor its proto module
# under proto-vendor/ (a git submodule pinned at a tag) and run `buf generate`
# here. The output in generated/ is gitignored (see .gitignore) and regenerated
# on demand; never hand-edit it.
#
# Managed mode stamps a go_package on every message so the generated import
# paths line up with this module:
#   proto-vendor/platform/listing/v1/listing.proto
#     -> github.com/your-org/team-service/generated/platform/listing/v1
#   proto-vendor/platform/common/v1/common.proto
#     -> github.com/your-org/team-service/generated/platform/common/v1
# Rename the prefix to match your real module path when you rename go.mod.
version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/your-org/team-service/generated

plugins:
  - remote: buf.build/protocolbuffers/go
    out: generated
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: generated
    opt: paths=source_relative

# The vendored proto module is the codegen input. Its buf.yaml (module root)
# comes in with the submodule, so imports like "platform/common/v1/common.proto" resolve.
inputs:
  - directory: proto-vendor
