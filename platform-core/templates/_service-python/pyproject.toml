# TEMPLATE: rename `team-service` -> your service name (e.g. `team-ai`) after
# instantiating this seed. Keep the dependency set lean; add heavy deps
# (qdrant-client, asyncpg, etc.) only when a capability is actually wired up.
[project]
name = "team-service"
version = "0.1.0"
description = "gRPC (grpc.aio) service seeded from platform-core templates/_service-python"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "grpcio-reflection>=1.66",
    "protobuf>=5.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Optional proto hardening: rewrites buf's generated absolute imports
    # (`from platform.x.v1 ...`) into relative ones so the generated tree can
    # live under a private `generated` package instead of a top-level
    # `platform` on sys.path (which shadows the stdlib `platform` module).
    # See the `proto` step in the Makefile and the caveat in src/server.py.
    "protoletariat>=3.2",
]

[project.scripts]
# Entrypoint: `team-service` -> src/main.py:main
team-service = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Source lives flat under src/ (imported as `config`, `server`, `interceptors.*`).
packages = ["src"]
sources = ["src"]

# ── uv ──────────────────────────────────────────────────────────────────────
# Install with:  uv sync --extra dev
[tool.uv]
package = true

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
# Generated protobuf/grpc stubs are vendored, never hand-edited — skip them.
extend-exclude = ["generated", "proto-vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make `src/` importable as top-level modules in tests without an install step.
pythonpath = ["src"]

# ── pyright ─────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
# Generated code is not type-checked (it is regenerated by `make proto`).
exclude = ["generated", "proto-vendor", "**/__pycache__"]
