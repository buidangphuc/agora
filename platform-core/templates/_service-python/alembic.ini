# Alembic is the migration tool for this service's OWN database (Rule 3: never
# migrate or read another service's schema). This config is a minimal seed —
# it becomes active once a Postgres-backed capability (DATABASE_URL) is added.
#
# To activate:
#   1. add `alembic` + a driver (e.g. asyncpg) to pyproject dependencies
#   2. `alembic init migrations` (or flesh out migrations/env.py yourself) so
#      env.py reads DATABASE_URL from src/config.py
#   3. uncomment the `migrate` target in the Makefile
[alembic]
script_location = migrations
prepend_sys_path = src
# sqlalchemy.url is intentionally left blank — migrations/env.py should read
# settings.DATABASE_URL at runtime rather than hard-coding a URL here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
