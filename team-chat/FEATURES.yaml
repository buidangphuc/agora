# Feature manifest for team-chat (buyer<->seller real-time messaging).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-chat
owner: chat-team

features:
  - id: chat.buyer-seller-thread
    title: Buyer-seller chat thread
    persona: buyer
    priority: P1
    summary: A buyer opens a chat with a seller and exchanges messages.
    entry_route: "/chat/{thread_id}"
    related_routes: [/chat]
    services: [team-chat, team-frontend]
    preconditions:
      login: buyer
      seed_tag: needsListing
    api:
      exercised: [chat.v1.GetOrCreateThread, chat.v1.SendMessage, chat.v1.GetThreadMessages]
    acceptance:
      - Given a buyer is viewing a seller's product
      - When the buyer opens chat and sends a message
      - Then the message appears in the thread history
    tags: [buyer]
    status: automated
    covered_by: "chat/chat_thread.feature::Buyer opens chat with seller and sends a message"

  - id: chat.thread-list
    title: Conversation list
    persona: buyer
    priority: P2
    summary: A user sees their conversations and unread markers.
    entry_route: /chat
    services: [team-chat, team-frontend]
    preconditions:
      login: buyer
    api:
      exercised: [chat.v1.ListThreads, chat.v1.MarkThreadRead]
    acceptance:
      - Given a user has existing conversations
      - When the user opens the chat list
      - Then their threads are listed with unread state
    tags: [buyer]
    status: automated
    covered_by: "buyer/consumer_pages.feature::Chat conversations render"

  # Change migrate-team-chat-to-go-sdk: runtime behaviour with no UI journey; every entry is
  # not-testable and names its unit/integration test.
  - id: chat-runtime.team-chat-declares-no-always-on-enable-flags
    title: team-chat declares no always-on enable flags
    persona: guest
    priority: P2
    entry_route: /
    services: [team-chat]
    acceptance:
      - When the declared env keys of team-chat's Settings are listed
      - Then none of DATABASE_ENABLED, KAFKA_ENABLED, OUTBOX_ENABLED and GRPC_REFLECTION_ENABLED is declared
    tags: [chat-runtime, unit]
    status: not-testable
    notes: "migrate-team-chat-to-go-sdk: not producible end to end; verified by team-chat/internal/config TestNoEnableFlagsDeclared."

  - id: chat-runtime.team-chat-fails-boot-on-an-unreachable-database-when-deployed
    title: team-chat fails boot on an unreachable database when deployed
    persona: guest
    priority: P2
    entry_route: /
    services: [team-chat]
    acceptance:
      - When team-chat starts with ENV=staging and an unreachable DATABASE_URL
      - Then app.Run returns an error before any port opens
    tags: [chat-runtime, unit]
    status: not-testable
    notes: "migrate-team-chat-to-go-sdk: not producible end to end; verified by team-chat/internal/app TestBootFailsWhenDatabaseUnreachableDeployed."

  - id: chat-runtime.team-chat-outbox-rows-are-relayed-and-a-failing-row-does-not-block-others
    title: team-chat outbox rows are relayed and a failing row does not block others
    persona: guest
    priority: P2
    entry_route: /
    services: [team-chat]
    acceptance:
      - When two outbox rows are enqueued and publishing the first fails
      - Then the second is published, and the first is retried with backoff and parked after OUTBOX_MAX_ATTEMPTS
    tags: [chat-runtime, integration]
    status: not-testable
    notes: "migrate-team-chat-to-go-sdk: not producible end to end; verified by team-chat/internal/app TestOutboxRelayedViaSDK (testkit Postgres)."

  - id: chat-runtime.team-chat-existing-suites-do-not-regress-and-no-assertion-is-weakened
    title: team-chat existing suites do not regress and no assertion is weakened
    persona: guest
    priority: P2
    entry_route: /
    services: [team-chat]
    acceptance:
      - When make check runs after the restructure
      - Then every pre-existing test passes, and no assertion is removed or loosened beyond removed-flag fields
    tags: [chat-runtime, unit]
    status: not-testable
    notes: "migrate-team-chat-to-go-sdk: not producible end to end; verified by team-chat `make check`."
