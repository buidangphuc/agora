version: v2

# Generated code is written ONLY inside this repo's own tree. Consumers vendor
# the proto module and run `buf generate` in THEIR OWN repo (with their own
# module path). Mirrors team-notification / ADR-0001.
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/buidangphuc/team-verification/generated

plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../generated
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../generated
    opt: paths=source_relative
