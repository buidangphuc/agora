    preconditions:
      login: buyer
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus, audit.v1.QueryAuditLog]
    acceptance:
      - "Given a signed-in buyer with a pending KYC submission"
      - "When the buyer approves their own KYC submission"
      - "Then the gateway returns 403 and QueryAuditLog returns 0 events for the submission"
    tags: [buyer, security, audit]
    status: automated
    covered_by: "services/verification_kyc_audit.feature::A refused KYC review writes no audit event (Non-admin approval writes no event end to end)"

