# Feature manifest for team-verification (mock KYC).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-verification
owner: verification-team

features:
  - id: verification.buyer-cannot-self-approve
    title: A buyer cannot approve their own KYC
    persona: buyer
    priority: P1
    summary: ReviewKyc needs the admin scope; a buyer (even the submitter) is denied and stays unverified.
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity]
    preconditions:
      login: buyer
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus]
    acceptance:
      - Given a signed-in buyer with a pending KYC submission
      - When the buyer approves their own KYC submission
      - Then the gateway returns 403 and the buyer's status is still not verified
    tags: [buyer, security]
    status: automated
    covered_by: "services/verification_access.feature::A buyer cannot approve their own KYC"

  - id: verification.admin-approves-seller
    title: An admin approves a seller's KYC
    persona: admin
    priority: P1
    summary: An admin with the admin scope approves another user's pending KYC and the user becomes verified.
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity]
    preconditions:
      login: admin
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus]
    acceptance:
      - Given a seller with a pending KYC submission and an admin logged in
      - When the admin approves the seller's KYC submission
      - Then the gateway returns 200 and the seller's status is verified
    tags: [admin, security]
    status: automated
    covered_by: "services/verification_access.feature::An admin approves a seller's KYC"

  - id: verification.admin-approval-audited
    title: "An admin's KYC approval is audited"
    persona: admin
    priority: P1
    summary: "admin approves a pending KYC; gateway 200, seller verified, exactly one kyc.review event with decision approve and the seller's user_id."
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity, team-audit]
    preconditions:
      login: admin
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus, audit.v1.QueryAuditLog]
    acceptance:
      - "Given a seller with a pending KYC submission and an admin logged in"
      - "When the admin approves the seller's KYC submission"
      - "Then the gateway returns 200, the seller is verified and QueryAuditLog returns exactly one kyc.review event for the submission"
    tags: [admin, security, audit]
    status: automated
    covered_by: "services/verification_kyc_audit.feature::An audited KYC approval leaves one audit event (Audited approve is visible end to end)"

  - id: verification.admin-rejection-audited
    title: "An admin's KYC rejection is audited"
    persona: admin
    priority: P1
    summary: "admin rejects a pending KYC; gateway 200, seller rejected not verified, exactly one kyc.review event with decision reject."
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity, team-audit]
    preconditions:
      login: admin
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus, audit.v1.QueryAuditLog]
    acceptance:
      - "Given a seller with a pending KYC submission and an admin logged in"
      - "When the admin rejects the seller's KYC submission"
      - "Then the gateway returns 200, the seller is rejected and QueryAuditLog returns exactly one kyc.review event with decision reject"
    tags: [admin, security, audit]
    status: automated
    covered_by: "services/verification_kyc_audit.feature::An audited KYC rejection leaves one audit event (Audited reject is visible end to end)"

  - id: verification.audit-down-blocks-approval
    title: "KYC approval fails closed while team-audit is down"
    persona: admin
    priority: P1
    summary: "with team-audit stopped the approval returns 503 unavailable and the seller stays unverified; after restart the approval returns 200 with exactly one event."
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity, team-audit]
    preconditions:
      login: admin
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus, audit.v1.QueryAuditLog]
    acceptance:
      - "Given a seller with a pending KYC submission and an admin logged in"
      - "When team-audit is stopped and the admin approves the seller's KYC submission"
      - "Then the gateway returns 503 unavailable and the seller is not verified; after team-audit restarts the approval returns 200 with exactly one kyc.review event"
    tags: [admin, security, audit, destructive]
    status: automated
    covered_by: "services/verification_kyc_audit.feature::KYC approval is refused while the audit service is down (Audit down blocks approval end to end)"

  - id: verification.refused-review-writes-no-event
    title: "A refused KYC review writes no audit event"
    persona: buyer
    priority: P1
    summary: "a buyer approving their own KYC gets 403 and QueryAuditLog returns no event for the submission."
    entry_route: /account/verification
