# Feature manifest for team-verification (mock KYC).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-verification
owner: verification-team

features:
  - id: verification.buyer-cannot-self-approve
    title: A buyer cannot approve their own KYC
    persona: buyer
    priority: P1
    summary: ReviewKyc needs the admin scope; a buyer (even the submitter) is denied and stays unverified.
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity]
    preconditions:
      login: buyer
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus]
    acceptance:
      - Given a signed-in buyer with a pending KYC submission
      - When the buyer approves their own KYC submission
      - Then the gateway returns 403 and the buyer's status is still not verified
    tags: [buyer, security]
    status: automated
    covered_by: "services/verification_access.feature::A buyer cannot approve their own KYC"

  - id: verification.admin-approves-seller
    title: An admin approves a seller's KYC
    persona: admin
    priority: P1
    summary: An admin with the admin scope approves another user's pending KYC and the user becomes verified.
    entry_route: /account/verification
    services: [team-verification, team-gateway, team-identity]
    preconditions:
      login: admin
    api:
      exercised: [verification.v1.SubmitKyc, verification.v1.ReviewKyc, verification.v1.GetVerificationStatus]
    acceptance:
      - Given a seller with a pending KYC submission and an admin logged in
      - When the admin approves the seller's KYC submission
      - Then the gateway returns 200 and the seller's status is verified
    tags: [admin, security]
    status: automated
    covered_by: "services/verification_access.feature::An admin approves a seller's KYC"

  # Change migrate-team-verification-to-go-sdk: runtime behaviour with no UI journey; every entry
  # below is not-testable and names its unit/integration test.
  - id: verification-runtime.boots-fail-on-unreachable-database-outside-local
    title: team-verification fails boot on an unreachable database outside local
    persona: guest
    priority: P2
    entry_route: /
    services: [team-verification]
    acceptance:
      - When team-verification starts with ENV=staging and DATABASE_URL pointing at a closed port
      - Then app.Run returns an error and no gRPC listener is opened
    tags: [verification-runtime, unit]
    status: not-testable
    notes: "migrate-team-verification-to-go-sdk: not producible end to end; verified by team-verification/internal/app TestBootFailsWhenDatabaseUnreachableOutsideLocal."

  - id: verification-runtime.local-falls-back-to-memory
    title: team-verification falls back to memory locally
    persona: guest
    priority: P2
    entry_route: /
    services: [team-verification]
    acceptance:
      - When team-verification starts with ENV=local and an unreachable database
      - Then SubmitKyc, ReviewKyc and GetVerificationStatus are served from the in-memory store and health is SERVING
    tags: [verification-runtime, unit]
    status: not-testable
    notes: "migrate-team-verification-to-go-sdk: not producible end to end; verified by team-verification/internal/app TestLocalFallsBackToMemoryStore."

  - id: verification-runtime.no-enable-flags
    title: team-verification declares no enable flags
    persona: guest
    priority: P2
    entry_route: /
    services: [team-verification]
    acceptance:
      - When the declared env keys of team-verification's Settings are listed
      - Then neither DATABASE_ENABLED nor GRPC_REFLECTION_ENABLED is declared
    tags: [verification-runtime, unit]
    status: not-testable
    notes: "migrate-team-verification-to-go-sdk: not producible end to end; verified by team-verification/internal/config TestNoEnableFlagsDeclared."

  - id: verification-runtime.database-loss-flips-health
    title: team-verification health fails to NOT_SERVING when the database is lost
    persona: guest
    priority: P2
    entry_route: /
    services: [team-verification]
    acceptance:
      - When the database used by a running team-verification stops accepting connections
      - Then within one probe interval the gRPC health status is NOT_SERVING
    tags: [verification-runtime, unit]
    status: not-testable
    notes: "migrate-team-verification-to-go-sdk: not producible end to end; verified by team-verification/internal/app TestHealthReportsDatabaseDown (testkit Postgres)."

  - id: verification-runtime.existing-suites-do-not-regress
    title: team-verification existing suites do not regress and no assertion is weakened
    persona: guest
    priority: P2
    entry_route: /
    services: [team-verification]
    acceptance:
      - When make check runs after the restructure
      - Then every pre-existing team-verification test passes with its assertions unchanged apart from auth status message text
    tags: [verification-runtime, unit]
    status: not-testable
    notes: "migrate-team-verification-to-go-sdk: not producible end to end; verified by team-verification `make check`."
