# Feature manifest for team-frontend.
# Ownership rule: a feature belongs to the repo owning the CAPABILITY. The
# frontend is the UI shell, so it owns only presentational/cross-cutting journeys;
# auth lives in team-identity, listing in team-domain, search in team-search, etc.
# Schema: platform-e2e/schemas/features.schema.json
repo: team-frontend
owner: frontend-team

features:
  - id: home.landing
    title: Marketplace home landing
    persona: guest
    priority: P1
    summary: The home page renders the category bar, service hubs and listing grid.
    entry_route: /
    services: [team-frontend, team-search]
    preconditions:
      login: guest
    ui:
      key_elements:
        search_input: "placeholder:Tìm kiếm sản phẩm"
    acceptance:
      - Given the home page is open
      - Then the category bar and a product grid are visible
    tags: [buyer]
    status: automated
    covered_by: "frontend/shell.feature::Home landing renders the catalog"

  - id: nav.global-header
    title: Global header navigation
    persona: guest
    priority: P2
    summary: Header exposes search, cart counter and the account menu on every page.
    entry_route: /
    related_routes: [/cart, /login]
    services: [team-frontend]
    preconditions:
      login: guest
    ui:
      key_elements:
        search_input: "placeholder:Tìm kiếm sản phẩm"
        cart_link: 'a[href="/cart"]'
    acceptance:
      - Given any page is open
      - Then the header shows search, the cart icon and an account entry
    tags: [buyer]
    status: automated
    covered_by: "frontend/shell.feature::Global header exposes search and cart"

  - id: promo.vouchers-page
    title: Vouchers hub browse
    persona: guest
    priority: P2
    summary: Visitors can browse available vouchers on the Vouchers Hub.
    entry_route: /vouchers
    services: [team-frontend]
    preconditions:
      login: guest
    ui:
      key_elements:
        heading: "text:Kho Voucher"
        save_button: "role:button=Lưu mã"
    acceptance:
      - Given the vouchers page is open
      - Then the vouchers hub lists available vouchers
    tags: [buyer]
    status: automated
    covered_by: "promo/vouchers.feature::Visitor browses available vouchers"

  - id: shop.storefront
    title: Seller dedicated storefront
    persona: buyer
    priority: P2
    summary: Buyers can view a seller's dedicated shop storefront, follow the shop and browse items.
    entry_route: "/shop/{id}"
    services: [team-frontend, team-domain]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        follow_button: "role:button=Theo Dõi"
    acceptance:
      - Given a buyer is logged in
      - When the buyer opens a seller shop page
      - Then the shop profile header displays the store rating and product catalog
      - And the buyer can toggle following the shop
      - When a seller has set the display name "Tiem Hoa Nho", then the shop header and the product detail shop header show "Tiem Hoa Nho" and link to /shop/<sellerId>
      - When the seller renames the shop to "Tiem Hoa Lon", then the next page load shows "Tiem Hoa Lon" without a cache purge
    tags: [buyer, shop]
    status: automated
    covered_by: "shop/shop_storefront.feature::Buyer explores public seller shop storefront"
    notes: >
      The two display-name acceptance lines are covered by planned scenarios in
      shop/shop_display_name.feature ("The name is returned for a storefront",
      "A name change is reflected"); they have not been run yet (stack was not up).

  - id: shop.display-name-fallback
    title: Shop label falls back to the seller id prefix
    persona: buyer
    priority: P2
    summary: When a seller has no display name, or the name lookup fails, the UI shows "Shop #<first 6 chars of sellerId>".
    entry_route: "/shop/{id}"
    related_routes: [/cart, /account/following]
    services: [team-frontend, team-gateway, team-domain]
    preconditions:
      login: guest
      data: A seeded seller that has not created a storefront.
    api:
      exercised: [listing.v1.GetStorefront, listing.v1.BatchGetStorefronts]
    ui:
      key_elements:
        shop_name: "h1"
    acceptance:
      - Given a seller with no display name
      - When a visitor opens the seller's shop page
      - Then the shop header reads "Shop #" followed by the first 6 characters of the seller id
      - And when BatchGetStorefronts fails or is Unimplemented the cart still renders every item with the fallback label
    tags: [buyer, shop]
    status: planned
    covered_by: null
    notes: >
      Scenario "Fallback when the seller has no name" is written in
      shop/shop_display_name.feature; run pending a live stack. The lookup-failure
      line is covered by Vitest (cart.test.ts) because failing the gateway call is not
      reproducible through the UI.

  - id: cart.item-management
    title: Cart quantity and item clearing
    persona: buyer
    priority: P1
    summary: Buyer adjusts item quantities and clears items in shopping cart.
    entry_route: /cart
    services: [team-frontend, team-order]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        clear_button: "role:button=Xóa tất cả"
    acceptance:
      - Given a buyer is logged in
      - And a listing has been seeded via the API
      - When the buyer opens the seeded listing
      - And the buyer adds the product to the cart
      - And the buyer opens the cart
      - Then the buyer can increase the item quantity
      - When the buyer clears all items from the cart
      - Then the cart displays the empty state
    tags: [buyer]
    status: automated
    covered_by: "buyer/cart_management.feature::Buyer modifies item quantity in cart"

  - id: cart.shop-names
    title: Cart resolves shop names in one batch
    persona: buyer
    priority: P2
    summary: A cart with items from two sellers resolves both shop names with a single BatchGetStorefronts call.
    entry_route: /cart
    services: [team-frontend, team-gateway, team-order, team-domain]
    preconditions:
      login: buyer
      data: Two sellers with display names, one published listing each, both in the buyer's cart.
    api:
      seed: [listing.v1.UpsertStorefront, order.v1.AddToCart]
      exercised: [order.v1.GetCart, listing.v1.BatchGetStorefronts]
    acceptance:
      - Given a buyer's cart holds items from sellers "Shop Alpha" and "Shop Beta"
      - When the cart page loads
      - Then exactly one BatchGetStorefronts call is made with both seller ids
      - And each cart item carries its own shop name (sellerDisplayName)
    tags: [buyer, cart, shop]
    status: planned
    covered_by: null
    notes: >
      Scenario "A cart with two sellers returns both names in one batch" is written in
      shop/shop_display_name.feature and asserts the batch lookup through the gateway.
      The cart view has no per-shop group header yet; the header assertion lands with the
      ui-phase cart grouping. "Exactly one call" is covered by Vitest (cart.test.ts).

  - id: following.shop-names
    title: Following list shows shop names
    persona: buyer
    priority: P2
    summary: /account/following resolves the followed sellers' names with one batch call.
    entry_route: /account/following
    services: [team-frontend, team-gateway, team-engagement, team-domain]
    preconditions:
      login: buyer
      data: Buyer follows three sellers, some with display names.
    api:
      exercised: [engagement.v1.ListFollowedSellers, listing.v1.BatchGetStorefronts]
    acceptance:
      - Given a buyer follows three sellers
      - When the buyer opens /account/following
      - Then one ListFollowedSellers call and one BatchGetStorefronts call are made
      - And each row shows the seller's display name, or "Shop #<6 chars>" when it has none
    tags: [buyer, shop]
    status: planned
    covered_by: null
    notes: >
      No platform-e2e scenario yet (needs three seeded followed sellers); the one-batch
      behaviour is covered by Vitest (follow.test.ts). Follow-up for the e2e wave.

  - id: chat.floating-bubble
    title: Floating chat messenger bubble
    persona: buyer
    priority: P2
    summary: Floating chat bubble at bottom right allows quick navigation to support and shop chats.
    entry_route: /
    services: [team-frontend, team-chat]
    preconditions:
      login: buyer
    ui:
      key_elements:
        chat_bubble: 'a[aria-label="Mở hộp thư tin nhắn và hỗ trợ"]'
    acceptance:
      - Given a buyer is logged in
      - When the user opens the home page
      - Then the floating chat bubble is visible on the bottom right
      - When the user clicks the floating chat button
      - Then the chat messenger page is displayed
    tags: [buyer, chat]
    status: automated
    covered_by: "chat/floating_chat.feature::Visitor navigates to chat via floating bubble"

  - id: admin.cockpit-radar
    title: Admin telemetry and microservices health radar
    persona: admin
    priority: P2
    summary: Admin inspects throughput and latency golden signals on the cockpit HUD.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: admin
    ui:
      key_elements:
        throughput_card: "text:Total Gateway Throughput"
    acceptance:
      - When the admin opens the cockpit HUD
      - Then the telemetry summary cards display throughput and latency metrics
    tags: [admin]
    status: automated
    covered_by: "admin/cockpit_health_radar.feature::Admin inspects live telemetry on Cockpit"

  - id: tracking.emit-view
    title: Browsing a product emits a tracking event
    persona: buyer
    priority: P2
    summary: >-
      Opening a product detail page fires a best-effort telemetry beacon to the
      gateway, which publishes a TrackingEvent (EVENT_TYPE_VIEW) on the
      analytics.events Kafka topic. Best-effort: browsing never blocks on it.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-frontend, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        product_title: "role:heading"
    acceptance:
      - Given a buyer opens a product detail page
      - When the page records the product view
      - Then exactly one EventEnvelope of type platform.analytics.v1.TrackingEvent is published to the analytics.events topic
      - And its payload is a TrackingEvent with EventType EVENT_TYPE_VIEW carrying the listing id and page path
    tags: [buyer, tracking]
    status: automated
    covered_by: "tracking/emit_tracking.feature::A browsing beacon becomes a tracking event on analytics.events"

  - id: ops.cockpit-live-metrics
    title: Admin Cockpit shows live per-service metrics from Prometheus
    persona: admin
    priority: P2
    summary: >-
      The Admin Cockpit HUD (/admin/cockpit) polls GET /api/admin/metrics, which
      the gateway serves from real Prometheus data (per-service RPS / p95 / p99 /
      error-rate) instead of the old math/rand stub. The gateway runs a fixed,
      hardcoded PromQL set server-side and shapes it into the frozen
      CockpitMetricsResponse — raw Prometheus is never exposed to the browser.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus, team-search]
    preconditions:
      login: admin
    ui:
      key_elements:
        heading: "text:Microservices Health & RED Metrics Radar"
    acceptance:
      - Given an admin opens /admin/cockpit after traffic has been driven through the gateway to a service (e.g. search reads)
      - Then the HUD shows a non-zero, Prometheus-sourced RPS and latency for that service, reflecting the real activity rather than a fixed or random baseline
    tags: [admin, observability]
    status: automated
    covered_by: "admin/cockpit_health_radar.feature::Admin inspects live telemetry on Cockpit"

  - id: recommendations.for-you-row
    title: Buyer sees a "Gợi ý cho bạn" recommendations row from team-ai
    persona: buyer
    priority: P2
    summary: >-
      The home page (context HOMEPAGE, no seed) and the product-detail page
      (context SIMILAR_ITEMS, seeded with the current listing id) render a "Gợi ý
      cho bạn" row populated from team-ai (RecommendationService/Recommend) via
      the gateway using the caller's session. The RPC returns listing ids +
      scores only; the frontend hydrates each id into a product card through the
      existing gateway listing client. Server-only — the browser never calls
      team-ai directly (Rule 1). When the service is UNAVAILABLE
      (RECS_ENABLED=false) the row is hidden and the page still renders.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-ai, team-gateway, team-frontend]
    api:
      exercised: [recommendation.v1.Recommend]
    preconditions:
      login: buyer
    ui:
      key_elements:
        recs_row: "text:Gợi ý cho bạn"
    acceptance:
      - Given a logged-in buyer opens the page carrying the recommendations row
      - Then the "Gợi ý cho bạn" row is populated with product cards sourced from team-ai via the gateway (not a client-side mock or hardcoded list)
      - And when the recommendation service returns UNAVAILABLE the page still renders and the row is hidden
    tags: [buyer, recommendations]
    status: automated
    covered_by: "recommendations/recommendations.feature::Recommendations are unavailable without breaking the page"

  - id: ops.cockpit-reflects-activity
    title: Cockpit reflects real request activity
    persona: admin
    priority: P2
    summary: >-
      After traffic is driven through the gateway to a service, the Cockpit HUD
      shows non-zero, Prometheus-sourced RPS and latency for that service —
      reflecting real activity, not the old math/rand baseline.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus, team-search]
    preconditions:
      login: admin
    ui:
      key_elements:
        heading: "text:Microservices Health & RED Metrics Radar"
    acceptance:
      - Given an admin opens /admin/cockpit after traffic has been driven through the gateway to a service
      - Then the HUD shows a non-zero, Prometheus-sourced RPS and latency for that service, reflecting the real activity rather than a fixed or random baseline
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Cockpit reflects real request activity"

  - id: ops.cockpit-idle-trends-zero
    title: Idle stack trends toward zero, not a random baseline
    persona: admin
    priority: P2
    summary: >-
      With no traffic flowing through the gateway, the exercised service's RPS
      trends toward zero as Prometheus reports, rather than the previous
      "~124 + rand()" stub baseline.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus]
    preconditions:
      login: admin
    acceptance:
      - Given no traffic is flowing through the gateway
      - Then the exercised service's RPS trends toward zero as Prometheus reports, rather than the previous random stub baseline
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Idle stack trends toward zero, not a random baseline"

  - id: ops.cockpit-no-raw-prometheus
    title: Browser cannot reach raw Prometheus through the gateway
    persona: admin
    priority: P2
    summary: >-
      The gateway is a thin read-only proxy: GET /api/admin/metrics returns only
      the shaped CockpitMetricsResponse JSON and no endpoint forwards arbitrary
      PromQL or raw Prometheus responses to the browser (architecture Rule 2).
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus]
    preconditions:
      login: admin
    acceptance:
      - When the cockpit endpoint GET /api/admin/metrics is called
      - Then the gateway returns only the shaped CockpitMetricsResponse JSON, and no endpoint forwards arbitrary PromQL or raw Prometheus responses to the browser
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Browser cannot reach raw Prometheus through the gateway"

  - id: ops.cockpit-prometheus-degrades
    title: Prometheus unavailable degrades gracefully
    persona: admin
    priority: P2
    summary: >-
      When PROMETHEUS_URL is unset or Prometheus is unreachable, GET
      /api/admin/metrics still returns a valid response in the expected
      CockpitMetricsResponse shape with cleared/zeroed metric values, never
      re-introducing random data.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: admin
    acceptance:
      - Given PROMETHEUS_URL is unset or Prometheus is unreachable
      - Then GET /api/admin/metrics still returns a valid response in the expected shape with cleared/zeroed metric values, never re-introducing random data
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Prometheus unavailable degrades gracefully"

  - id: ops.cockpit-orders-revenue-derived
    title: Orders/revenue are not presented as Prometheus-sourced truth
    persona: admin
    priority: P2
    summary: >-
      Because no Prometheus business metric for orders/revenue exists,
      total_orders_24h and total_revenue_24h are populated from a derived source
      (not a Prometheus business counter) and documented as estimated, pending a
      future order-domain metric, while keeping the response field shape.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: admin
    acceptance:
      - When the cockpit response is produced
      - Then total_orders_24h and total_revenue_24h are populated from a derived source (not a Prometheus business counter) and are documented as estimated, pending a future order-domain metric
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Orders/revenue are not presented as Prometheus-sourced truth"

  # ---- ui-foundation (design tokens + Exception shells). status: planned until the
  # ---- ui_foundation.feature scenarios have run green against the local stack.
  - id: ui.not-found
    title: Unknown route shows the 404 result
    persona: guest
    priority: P2
    summary: >-
      An unknown URL renders the Exception 404 result with a visible link back to
      the home page and an HTTP 404 status (src/app/not-found.tsx).
    entry_route: /does-not-exist
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - When a visitor opens /does-not-exist
      - Then the page shows a "not found" result with a visible link back to /
      - And the HTTP status is 404
    tags: [buyer]
    status: planned

  - id: ui.error-recovery
    title: A thrown page error is recoverable
    persona: guest
    priority: P2
    summary: >-
      When a server component throws during render, src/app/error.tsx shows the
      error result with a "Thử lại" button that re-renders the segment. Needs a
      fault-injection hook (none exists), so it is covered by the Vitest shell test
      until a test route is added.
    entry_route: /
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - When a server component throws during render
      - Then the error result is shown with a "Thử lại" (retry) button
      - And clicking it re-renders the segment
    tags: [buyer]
    status: planned

  - id: ui.brand-colour-token
    title: The brand colour resolves from the design tokens
    persona: guest
    priority: P2
    summary: >-
      A primary action on the storefront renders the brand colour from the Tier 1
      primary scale (rgb(238, 77, 45)).
    entry_route: /
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the home page is open
      - Then the header search button's computed background colour is rgb(238, 77, 45)
      - And the --color-action-primary alias resolves to the same colour
    tags: [buyer]
    status: planned

  - id: ui.alias-override
    title: Changing an alias restyles every user of it
    persona: guest
    priority: P2
    summary: >-
      Overriding --color-action-primary on :root restyles every component that
      consumes the alias (primary Button, sale PriceTag) with no component change.
    entry_route: /
    services: [team-frontend, team-search]
    preconditions:
      login: guest
      data: At least one listing must render so a PriceTag is on the page.
    acceptance:
      - Given the home page is open
      - When --color-action-primary is overridden on :root
      - Then every element styled by the action-primary alias renders the overridden colour
    tags: [buyer]
    status: planned

  # ---- ui-core-components (core component set + /dev/ui catalogue). The scenarios
  # ---- drive the dev-only /dev/ui page, so they need only the frontend, no backend.

  - id: ui.button-loading
    title: A loading button keeps its width and blocks clicks
    persona: guest
    priority: P2
    summary: >-
      Button isLoading swaps the label for a spinner overlay without changing the button width, sets aria-busy and ignores clicks.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When the idle and loading "Thêm vào giỏ" buttons are compared
      - Then both have the same rendered width, the loading one has aria-busy=true and a spinner, and clicking it does nothing
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::A loading button keeps its width and blocks clicks"

  - id: ui.disabled-inert
    title: Disabled is announced and inert
    persona: guest
    priority: P2
    summary: >-
      A disabled interactive component carries aria-disabled=true and ignores pointer and keyboard activation.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the disabled button has the disabled attribute and aria-disabled=true
      - And clicking it or pressing Enter/Space on it changes nothing
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Disabled is announced and inert"

  - id: ui.focus-ring-keyboard
    title: Focus ring shows for keyboard users only
    persona: guest
    priority: P2
    summary: >-
      The 2px focus-ring alias ring is drawn on keyboard focus (Tab) and not on mouse click.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When the user tabs to a button
      - Then a focus ring (box-shadow in the focus-ring colour) is drawn
      - When the same button is clicked with the mouse
      - Then no focus ring is drawn
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Focus ring shows for keyboard users only"

  - id: ui.empty-table
    title: An empty table shows Empty, not a blank area
    persona: guest
    priority: P2
    summary: >-
      A Table with no rows still renders its column headers and an Empty block with the configured description.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the empty table shows its headers and the "Chưa có sản phẩm" Empty description
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::An empty table shows Empty, not a blank area"

  - id: ui.statistic-loading-stable
    title: A loading statistic does not shift layout
    persona: guest
    priority: P2
    summary: >-
      Switching a Statistic between loading and a value keeps its bounding box height.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When the loading toggle switches the statistics from skeleton to values
      - Then each statistic card's height is unchanged
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::A loading statistic does not shift layout"

  - id: ui.modal-focus-trap
    title: Modal traps focus and restores it
    persona: guest
    priority: P2
    summary: >-
      Opening a Modal moves focus inside, Tab cycles inside only, Escape closes it and focus returns to the opener.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When the user opens the modal and presses Tab repeatedly
      - Then focus never leaves the dialog
      - When the user presses Escape
      - Then the dialog closes and focus is back on the opening button
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Modal traps focus and restores it"

  - id: ui.tabs-keyboard
    title: Tabs are keyboard navigable
    persona: guest
    priority: P2
    summary: >-
      ArrowRight on the focused tab selects the next tab and shows its panel.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When focus is on the first tab and the user presses ArrowRight
      - Then the second tab is selected and its panel is shown
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Tabs are keyboard navigable"

  - id: ui.link-tabs-url
    title: Link tabs keep their state in the URL
    persona: guest
    priority: P2
    summary: >-
      Tabs with hrefFor render links whose active tab is aria-current=page, and the browser back button restores the previous tab.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the link tabs are anchors and the active one has aria-current=page
      - When another link tab is clicked and the user goes back
      - Then the previous tab is current again
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Link tabs keep their state in the URL"

  - id: ui.input-error-announced
    title: Input errors are announced
    persona: guest
    priority: P2
    summary: >-
      An Input with an error sets aria-invalid=true and its accessible description contains the error text.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the errored email input has aria-invalid=true and its description is the error message
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Input errors are announced"

  - id: ui.quantity-bounds
    title: QuantityPicker respects its bounds
    persona: guest
    priority: P2
    summary: >-
      With min=1 max=3 showing 3 the increment button is disabled, typing 5 clamps to 3 and decrement stays enabled.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the quantity picker at its max has a disabled increment button
      - When 5 is typed into it
      - Then the value is 3 and the decrement button is enabled
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::QuantityPicker respects its bounds"

  - id: ui.pagination-links
    title: Pagination works without client JavaScript
    persona: guest
    priority: P2
    summary: >-
      Pagination renders plain links to pages 1-5 with the current page marked aria-current=page.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then pagination links to pages 1 to 5 are present and page 2 has aria-current=page
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Pagination works without client JavaScript"

  - id: ui.image-fallback
    title: Image reserves its box and falls back
    persona: guest
    priority: P2
    summary: >-
      An Image with aspect=square keeps a square box before and after a failed load and shows the fallback placeholder.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the broken image shows the fallback placeholder in a square box
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Image reserves its box and falls back"

  - id: ui.catalogue-not-in-production
    title: The catalogue is not shipped to production
    persona: guest
    priority: P2
    summary: >-
      /dev/ui returns HTTP 404 in a production build. Needs a production build served by next start; verified by hand and by the next.config rewrite unit test, so it stays planned until the e2e stack can run a production frontend.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given a production build of team-frontend is running
      - When /dev/ui is requested
      - Then the response status is 404
    tags: [buyer]
    status: planned

  # ---- ui-phase-account (account/auth screens on the core component set). The
  # ---- scenarios need the full stack (logged-in buyer through the gateway), so the
  # ---- entries stay `planned` until they run green against the e2e docker stack.
  # ---- `acceptance` is one line per spec scenario of openspec/changes/ui-phase-account.

  - id: account.shell-nav
    title: Account pages share a URL-driven settings shell
    persona: buyer
    priority: P1
    summary: >-
      The five /account/* settings pages render in AccountShell: breadcrumb, h1 and a menu of links whose current item (aria-current=page) comes from the route; it collapses to one scrollable row on a phone.
    entry_route: /account/security
    related_routes: [/account/addresses, /account/verification, /account/referral, /account/following]
    services: [team-frontend, team-identity]
    preconditions:
      login: buyer
    ui:
      key_elements:
        menu: "role:navigation=Menu tài khoản"
        heading: "role:heading"
    acceptance:
      - "The menu reflects the URL: when a signed-in buyer opens /account/security then the Bảo mật item has aria-current=page, the others do not, and the h1 is Bảo mật tài khoản"
      - "Menu navigation is a real navigation: when the buyer clicks Xác minh and then uses Back, the URL becomes /account/verification and Back returns to /account/security re-rendered"
      - "Menu collapses on mobile: at 375px the menu is one scrollable row above the content and the page does not scroll sideways"
      - "Anonymous visitor is redirected: opening /account/addresses without a session redirects to /login with no address data in the response"
    tags: [buyer]
    status: planned

  - id: account.address-delete-confirm
    title: Address book with confirmed delete and feedback on every action
    persona: buyer
    priority: P1
    summary: >-
      Addresses are cards; create and edit open a Modal form, delete opens a confirm Modal (no window.confirm), and every action shows a pending state and ends with a toast.
    entry_route: /account/addresses
    related_routes: [/checkout]
    services: [team-frontend, team-identity]
    preconditions:
      login: buyer
      seed_tag: needsAddress
    api:
      seed:
        - identity.v1.CreateAddress
      exercised:
        - identity.v1.ListAddresses
        - identity.v1.DeleteAddress
        - identity.v1.SetDefaultAddress
    ui:
      key_elements:
        address_card: "testid:address-card"
        confirm_dialog: "role:dialog=Xóa địa chỉ?"
    acceptance:
      - "Adding an address: when a buyer submits a valid address in the add Modal then the button is pending, the modal closes, a success toast appears and the new card is listed"
      - "Delete requires confirmation: when a buyer clicks Xóa on a non-default address then a confirm Modal names the recipient, the address is deleted only after the confirm button, and cancel or Escape leaves the list unchanged and returns focus to Xóa"
      - "A failed mutation reports an error and keeps state: when set-default fails then an error toast is shown, the previous default keeps its Mặc định Tag and the button is enabled again"
      - "Empty address book: with no addresses an Empty block says Bạn chưa có địa chỉ nhận hàng nào. with a Thêm địa chỉ ngay action"
    tags: [buyer]
    status: planned

  - id: account.security-revoke
    title: Security page lists sessions and login history in Tables
    persona: buyer
    priority: P2
    summary: >-
      Sessions and login history are Tables with a result Tag; revoking a session asks for confirmation, shows a pending state and ends with a toast; history paginates via ?page=.
    entry_route: /account/security
    services: [team-frontend, team-identity]
    preconditions:
      login: buyer
    api:
      exercised:
        - identity.v1.ListSessions
        - identity.v1.RevokeSession
        - identity.v1.ListLoginHistory
    ui:
      key_elements:
        revoke_button: "role:button=Thu hồi"
        revoke_dialog: "role:dialog=Thu hồi phiên đăng nhập?"
    acceptance:
      - "Revoking a session: when a buyer confirms Thu hồi on an active session then the button is pending, a success toast appears, and that row shows Đã thu hồi with no Revoke button"
      - "Empty history: with no login history the table renders Empty Chưa có lịch sử đăng nhập."
      - "Gateway read failure: when the sessions request fails the sessions section shows an inline error Alert with Thử lại and the history section still renders"
    tags: [buyer]
    status: planned

  - id: account.kyc-form-labels
    title: KYC form is fully labelled and status is a Tag
    persona: buyer
    priority: P1
    summary: >-
      The verification page shows the KYC status as Descriptions with a text Tag (success, promo, danger, neutral) and SubmitKycForm binds every control to its label through FormItem.
    entry_route: /account/verification
    services: [team-frontend, team-verification]
    preconditions:
      login: buyer
    api:
      exercised:
        - verification.v1.GetVerificationStatus
        - verification.v1.SubmitKyc
    ui:
      key_elements:
        doc_type: "label:Loại giấy tờ"
        doc_ref: "label:Mã tham chiếu tài liệu"
        submit: "role:button=Gửi hồ sơ xác minh"
    acceptance:
      - "Every KYC control has an accessible name: the document-type select is named Loại giấy tờ and the reference input is named Mã tham chiếu tài liệu"
      - "Submitting a KYC document: when a buyer enters a reference and presses Gửi hồ sơ xác minh then the button is pending, a success toast appears, the field is cleared and the status Tag shows the pending status"
      - "Status is not conveyed by colour alone: a Verified status Tag contains the statusText in addition to its colour"
    tags: [buyer]
    status: planned

  - id: account.referral
    title: Referral page with Statistic, Descriptions and Timeline
    persona: buyer
    priority: P2
    summary: >-
      The referral page shows the code with a copy button, invited and reward Statistics, a redeem form and the rewards ledger as a Timeline; generate and redeem are Server Actions with pending state and toasts.
    entry_route: /account/referral
    services: [team-frontend, team-referral]
    preconditions:
      login: buyer
    api:
      exercised:
        - referral.v1.CreateReferralCode
        - referral.v1.GetMyReferral
        - referral.v1.RedeemReferral
        - referral.v1.ListReferralRewards
    ui:
      key_elements:
        generate: "role:button=Tạo mã giới thiệu"
        redeem_input: "label:Mã của bạn bè"
    acceptance:
      - "Generating a code: when a buyer without a code presses Tạo mã then the button is pending, a success toast appears and the code is shown after revalidation"
      - "Redeeming an invalid code: when the server rejects the code then an error toast is shown and the redeem field shows the server message as help with aria-invalid=true"
      - "No rewards yet: with an empty rewards list the Timeline area renders Empty Chưa có phần thưởng nào."
    tags: [buyer]
    status: planned

  - id: account.following-tabs
    title: Following page is URL-tabbed with real shop names
    persona: buyer
    priority: P1
    summary: >-
      /account/following has a summary Statistic and link Tabs on ?tab=shops|items; shop cards show the real shop display name (Shop # plus 6 id characters only when the name is empty) and the product feed loads behind Suspense with a Skeleton.
    entry_route: /account/following
    related_routes: ["/shop/{id}", "/listing/{id}"]
    services: [team-frontend, team-engagement, team-domain]
    preconditions:
      login: buyer
    api:
      exercised:
        - engagement.v1.ListFollowedSellers
        - listing.v1.BatchGetStorefronts
    ui:
      key_elements:
        tabs: "role:navigation=Tabs"
    acceptance:
      - "Tab is held in the URL: opening /account/following?tab=items selects the Sản phẩm tab on first render without client JS"
      - "Shop cards show the real shop name: a followed shop named Cửa hàng Hoa Mai shows that name and not Shop #"
      - "Empty shop name falls back: a followed shop with an empty name shows Shop # plus the first 6 characters of its id"
      - "Empty follow list: with no followed shops the shops tab shows Empty Bạn chưa theo dõi gian hàng nào. with a Khám phá gian hàng action to /search"
    tags: [buyer]
    status: planned

  - id: account.favorites-url-state
    title: Favorites keep URL state and reuse ListingGrid unchanged
    persona: buyer
    priority: P1
    summary: >-
      /favorites shows the total in a Badge, the collections manager and the favourites in the unchanged ListingGrid, filtered by ?collection= and paginated by ?page=; an unknown collection id renders a 404 Result.
    entry_route: /favorites
    related_routes: ["/favorites?collection={id}"]
    services: [team-frontend, team-engagement, team-domain]
    preconditions:
      login: buyer
    api:
      exercised:
        - engagement.v1.ListFavorites
        - engagement.v1.ListCollections
        - engagement.v1.CreateCollection
        - engagement.v1.ListCollectionItems
    ui:
      key_elements:
        collection_form: "label:Tạo bộ sưu tập"
        collection_name: "label:Tên bộ sưu tập"
    acceptance:
      - "Collection filter in the URL: when a buyer selects a collection the URL becomes /favorites?collection=<id>, the header shows the collection name and reloading shows the same items"
      - "Unknown collection: opening /favorites?collection=does-not-exist renders a Result that offers Xem tất cả sản phẩm yêu thích"
      - "Collection management gives feedback: when a buyer creates a collection the create button is pending and disabled, a success toast appears and the new collection is listed"
    tags: [buyer, engagement]
    status: planned

  - id: account.notifications-tab-url
    title: Notification tabs are URL state and the list is server-rendered
    persona: buyer
    priority: P1
    summary: >-
      /notifications filters by ?tab= and paginates by ?page= (20 per page); the list is server-rendered with only preferences and alert subscriptions as client islands; there is no mark-all-read control because the backend has no mark-as-read RPC.
    entry_route: /notifications
    services: [team-frontend, team-notification]
    preconditions:
      login: buyer
    api:
      exercised:
        - notification.v1.ListNotifications
        - notification.v1.GetNotificationPrefs
        - notification.v1.UpdateNotificationPrefs
        - notification.v1.ListAlertSubscriptions
    ui:
      key_elements:
        tabs: "role:navigation=Tabs"
        notification_item: "testid:notification-item"
        alert_subscription: "testid:alert-subscription"
    acceptance:
      - "Tab survives reload and sharing: when a buyer selects the Đơn hàng tab and reloads then the URL contains ?tab=order, the tab is selected and only order notifications are listed"
      - "No mark-all-read control: with unread items no Đánh dấu đã đọc or equivalent control is rendered"
      - "Empty tab: a tab with no notifications shows Empty Chưa có thông báo nào trong mục này."
      - "Saving preferences: when a buyer changes a toggle and presses Lưu the button is pending and a success toast appears; on failure an error toast appears and the toggles keep the unsaved values"
    tags: [buyer, notification]
    status: planned

  - id: auth.login-inline-error
    title: Login and register use validated FormItems with an inline error Alert
    persona: guest
    priority: P1
    summary: >-
      /login and /register render a centred Card of FormItems (names username, password, role preserved); client validation blocks empty and too-short input, the submit button is pending and inert during the request, and failures show an error Alert with role=alert.
    entry_route: /login
    related_routes: [/register]
    services: [team-frontend, team-identity]
    preconditions:
      login: guest
    api:
      exercised:
        - identity.v1.Login
        - identity.v1.Register
    ui:
      key_elements:
        username: "css:#username"
        password: "css:#password"
        submit: "role:button=Đăng nhập"
    acceptance:
      - "Required fields are validated before submit: submitting /login with an empty username sends no request, shows help text with aria-invalid=true and moves focus to the username input"
      - "Pending submit is visible and inert: submitting valid credentials shows a spinner with aria-busy=true, keeps the button width and a second click sends no second request"
      - "Wrong credentials show an inline error: a rejected login shows an error Alert with role=alert reading Tên đăng nhập hoặc mật khẩu không chính xác., keeps the username, clears the password and stays on /login"
      - "Register enforces the minimum lengths: a 2-character username or a 3-character password on /register shows the minimum-length help and does not submit"
    tags: [auth, buyer]
    status: planned
