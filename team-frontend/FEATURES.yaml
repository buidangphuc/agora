      - Then exactly one view_item_list event is sent with itemId, placementId, impressionId, modelVersion and index 3
      - When a visitor clicks the image or the title of a card
      - Then a select_item event with the same attribution is sent before navigation to /listing/<id>
      - Given /search?q=ao renders 24 results
      - Then one view_item_list event with itemListId "search_results", the query and 24 indexed items is sent
      - When the recommendations row streams in after the hero
