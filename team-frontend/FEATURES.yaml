# Feature manifest for team-frontend.
# Ownership rule: a feature belongs to the repo owning the CAPABILITY. The
# frontend is the UI shell, so it owns only presentational/cross-cutting journeys;
# auth lives in team-identity, listing in team-domain, search in team-search, etc.
# Schema: platform-e2e/schemas/features.schema.json
repo: team-frontend
owner: frontend-team

features:
  - id: home.landing
    title: Marketplace home landing
    persona: guest
    priority: P1
    summary: The home page renders the category bar, service hubs and listing grid.
    entry_route: /
    services: [team-frontend, team-search]
    preconditions:
      login: guest
    ui:
      key_elements:
        search_input: "placeholder:Tìm kiếm sản phẩm"
    acceptance:
      - Given the home page is open
      - Then the category bar and a product grid are visible
    tags: [buyer]
    status: automated
    covered_by: "frontend/shell.feature::Home landing renders the catalog"

  - id: nav.global-header
    title: Global header navigation
    persona: guest
    priority: P2
    summary: Header exposes search, cart counter and the account menu on every page.
    entry_route: /
    related_routes: [/cart, /login]
    services: [team-frontend]
    preconditions:
      login: guest
    ui:
      key_elements:
        search_input: "placeholder:Tìm kiếm sản phẩm"
        cart_link: 'a[href="/cart"]'
    acceptance:
      - Given any page is open
      - Then the header shows search, the cart icon and an account entry
    tags: [buyer]
    status: automated
    covered_by: "frontend/shell.feature::Global header exposes search and cart"

  - id: promo.vouchers-page
    title: Vouchers hub browse
    persona: guest
    priority: P2
    summary: Visitors can browse available vouchers on the Vouchers Hub.
    entry_route: /vouchers
    services: [team-frontend]
    preconditions:
      login: guest
    ui:
      key_elements:
        heading: "text:Kho Voucher"
        voucher_card: "testid:voucher-card"
    acceptance:
      - Given the vouchers page is open
      - Then the vouchers hub lists the vouchers returned by team-promotion and offers no "Lưu mã" button
    tags: [buyer]
    status: automated
    covered_by: "promo/vouchers.feature::Visitor browses available vouchers"

  - id: shop.storefront
    title: Seller dedicated storefront
    persona: buyer
    priority: P2
    summary: Buyers can view a seller's dedicated shop storefront, follow the shop and browse items.
    entry_route: "/shop/{id}"
    services: [team-frontend, team-domain]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        follow_button: "role:button=Theo Dõi"
    acceptance:
      - Given a buyer is logged in
      - When the buyer opens a seller shop page
      - Then the shop profile header displays the store rating and product catalog
      - And the buyer can toggle following the shop
      - When a seller has set the display name "Tiem Hoa Nho", then the shop header and the product detail shop header show "Tiem Hoa Nho" and link to /shop/<sellerId>
      - When the seller renames the shop to "Tiem Hoa Lon", then the next page load shows "Tiem Hoa Lon" without a cache purge
    tags: [buyer, shop]
    status: automated
    covered_by: "shop/shop_storefront.feature::Buyer explores public seller shop storefront"
    notes: >
      The two display-name acceptance lines are covered by planned scenarios in
      shop/shop_display_name.feature ("The name is returned for a storefront",
      "A name change is reflected"); they have not been run yet (stack was not up).

  - id: shop.display-name-fallback
    title: Shop label falls back to the seller id prefix
    persona: buyer
    priority: P2
    summary: When a seller has no display name, or the name lookup fails, the UI shows "Shop #<first 6 chars of sellerId>".
    entry_route: "/shop/{id}"
    related_routes: [/cart, /account/following]
    services: [team-frontend, team-gateway, team-domain]
    preconditions:
      login: guest
      data: A seeded seller that has not created a storefront.
    api:
      exercised: [listing.v1.GetStorefront, listing.v1.BatchGetStorefronts]
    ui:
      key_elements:
        shop_name: "h1"
    acceptance:
      - Given a seller with no display name
      - When a visitor opens the seller's shop page
      - Then the shop header reads "Shop #" followed by the first 6 characters of the seller id
      - And when BatchGetStorefronts fails or is Unimplemented the cart still renders every item with the fallback label
    tags: [buyer, shop]
    status: automated
    covered_by: "shop/shop_display_name.feature::Fallback when the seller has no name"
    notes: >
      Scenario "Fallback when the seller has no name" is written in
      shop/shop_display_name.feature; run pending a live stack. The lookup-failure
      line is covered by Vitest (cart.test.ts) because failing the gateway call is not
      reproducible through the UI.

  - id: cart.item-management
    title: Cart quantity and item clearing
    persona: buyer
    priority: P1
    summary: Buyer adjusts item quantities and clears items in shopping cart.
    entry_route: /cart
    services: [team-frontend, team-order]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        clear_button: "role:button=Xóa tất cả"
    acceptance:
      - Given a buyer is logged in
      - And a listing has been seeded via the API
      - When the buyer opens the seeded listing
      - And the buyer adds the product to the cart
      - And the buyer opens the cart
      - Then the buyer can increase the item quantity
      - When the buyer clears all items from the cart
      - Then the cart displays the empty state
    tags: [buyer]
    status: automated
    covered_by: "buyer/cart_management.feature::Buyer modifies item quantity in cart"

  - id: cart.shop-names
    title: Cart resolves shop names in one batch
    persona: buyer
    priority: P2
    summary: A cart with items from two sellers resolves both shop names with a single BatchGetStorefronts call.
    entry_route: /cart
    services: [team-frontend, team-gateway, team-order, team-domain]
    preconditions:
      login: buyer
      data: Two sellers with display names, one published listing each, both in the buyer's cart.
    api:
      seed: [listing.v1.UpsertStorefront, order.v1.AddToCart]
      exercised: [order.v1.GetCart, listing.v1.BatchGetStorefronts]
    acceptance:
      - Given a buyer's cart holds items from sellers "Shop Alpha" and "Shop Beta"
      - When the cart page loads
      - Then exactly one BatchGetStorefronts call is made with both seller ids
      - And each cart item carries its own shop name (sellerDisplayName)
    tags: [buyer, cart, shop]
    status: automated
    covered_by: "shop/shop_display_name.feature::A cart with two sellers returns both names in one batch"
    notes: >
      Scenario "A cart with two sellers returns both names in one batch" is written in
      shop/shop_display_name.feature and asserts the batch lookup through the gateway.
      The cart view has no per-shop group header yet; the header assertion lands with the
      ui-phase cart grouping. "Exactly one call" is covered by Vitest (cart.test.ts).

  - id: following.shop-names
    title: Following list shows shop names
    persona: buyer
    priority: P2
    summary: /account/following resolves the followed sellers' names with one batch call.
    entry_route: /account/following
    services: [team-frontend, team-gateway, team-engagement, team-domain]
    preconditions:
      login: buyer
      data: Buyer follows three sellers, some with display names.
    api:
      exercised: [engagement.v1.ListFollowedSellers, listing.v1.BatchGetStorefronts]
    acceptance:
      - Given a buyer follows three sellers
      - When the buyer opens /account/following
      - Then one ListFollowedSellers call and one BatchGetStorefronts call are made
      - And each row shows the seller's display name, or "Shop #<6 chars>" when it has none
    tags: [buyer, shop]
    status: planned
    covered_by: null
    notes: >
      No platform-e2e scenario yet (needs three seeded followed sellers); the one-batch
      behaviour is covered by Vitest (follow.test.ts). Follow-up for the e2e wave.

  - id: chat.floating-bubble
    title: Floating chat messenger bubble
    persona: buyer
    priority: P2
    summary: Floating chat bubble at bottom right allows quick navigation to support and shop chats.
    entry_route: /
    services: [team-frontend, team-chat]
    preconditions:
      login: buyer
    ui:
      key_elements:
        chat_bubble: 'a[aria-label="Mở hộp thư tin nhắn và hỗ trợ"]'
    acceptance:
      - Given a buyer is logged in
      - When the user opens the home page
      - Then the floating chat bubble is visible on the bottom right
      - When the user clicks the floating chat button
      - Then the chat messenger page is displayed
    tags: [buyer, chat]
    status: automated
    covered_by: "chat/floating_chat.feature::Visitor navigates to chat via floating bubble"

  - id: admin.cockpit-radar
    title: Admin telemetry and microservices health radar
    persona: admin
    priority: P2
    summary: Admin inspects throughput and latency golden signals on the cockpit HUD.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: admin
    ui:
      key_elements:
        throughput_card: "text:Total Gateway Throughput"
    acceptance:
      - When the admin opens the cockpit HUD
      - Then the telemetry summary cards display throughput and latency metrics
    tags: [admin]
    status: automated
    covered_by: "admin/cockpit_health_radar.feature::Admin inspects live telemetry on Cockpit"

  - id: tracking.emit-view
    title: Browsing a product emits a tracking event
    persona: buyer
    priority: P2
    summary: >-
      Opening a product detail page fires a best-effort telemetry beacon to the
      gateway, which publishes a TrackingEvent (EVENT_TYPE_VIEW) on the
      analytics.events Kafka topic. Best-effort: browsing never blocks on it.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-frontend, team-gateway]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        product_title: "role:heading"
    acceptance:
      - Given a buyer opens a product detail page
      - When the page records the product view
      - Then exactly one EventEnvelope of type platform.analytics.v1.TrackingEvent is published to the analytics.events topic
      - And its payload is a TrackingEvent with EventType EVENT_TYPE_VIEW carrying the listing id and page path
    tags: [buyer, tracking]
    status: automated
    covered_by: "tracking/emit_tracking.feature::A browsing beacon becomes a tracking event on analytics.events"

  - id: ops.cockpit-live-metrics
    title: Admin Cockpit shows live per-service metrics from Prometheus
    persona: admin
    priority: P2
    summary: >-
      The Admin Cockpit HUD (/admin/cockpit) polls GET /api/admin/metrics, which
      the gateway serves from real Prometheus data (per-service RPS / p95 / p99 /
      error-rate) instead of the old math/rand stub. The gateway runs a fixed,
      hardcoded PromQL set server-side and shapes it into the frozen
      CockpitMetricsResponse — raw Prometheus is never exposed to the browser.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus, team-search]
    preconditions:
      login: admin
    ui:
      key_elements:
        heading: "text:Microservices Health & RED Metrics Radar"
    acceptance:
      - Given an admin opens /admin/cockpit after traffic has been driven through the gateway to a service (e.g. search reads)
      - Then the HUD shows a non-zero, Prometheus-sourced RPS and latency for that service, reflecting the real activity rather than a fixed or random baseline
    tags: [admin, observability]
    status: automated
    covered_by: "admin/cockpit_health_radar.feature::Admin inspects live telemetry on Cockpit"

  - id: recommendations.for-you-row
    title: Buyer sees a "Gợi ý cho bạn" recommendations row from team-ai
    persona: buyer
    priority: P2
    summary: >-
      The home page (context HOMEPAGE, no seed) and the product-detail page
      (context SIMILAR_ITEMS, seeded with the current listing id) render a "Gợi ý
      cho bạn" row populated from team-ai (RecommendationService/Recommend) via
      the gateway using the caller's session. The RPC returns listing ids +
      scores only; the frontend hydrates each id into a product card through the
      existing gateway listing client. Server-only — the browser never calls
      team-ai directly (Rule 1). On the local stack team-ai serves the ALS model
      the platform-recsys job trains from the exported tracking events
      (serve-trained-recs-locally). When the service is UNAVAILABLE the row is
      hidden and the page still renders.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-ai, team-gateway, team-frontend]
    api:
      exercised: [recommendation.v1.Recommend]
    preconditions:
      login: buyer
    ui:
      key_elements:
        recs_row: "text:Gợi ý cho bạn"
    acceptance:
      - Given a logged-in buyer opens the page carrying the recommendations row
      - Then the "Gợi ý cho bạn" row is populated with product cards sourced from team-ai via the gateway (not a client-side mock or hardcoded list)
      - And when the recommendation service returns UNAVAILABLE the page still renders and the row is hidden
    tags: [buyer, recommendations]
    status: automated
    covered_by: "recommendations/recommendations.feature::Logged-in buyer sees a recommendations row sourced from team-ai"

  - id: ops.cockpit-reflects-activity
    title: Cockpit reflects real request activity
    persona: admin
    priority: P2
    summary: >-
      After traffic is driven through the gateway to a service, the Cockpit HUD
      shows non-zero, Prometheus-sourced RPS and latency for that service —
      reflecting real activity, not the old math/rand baseline.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus, team-search]
    preconditions:
      login: admin
    ui:
      key_elements:
        heading: "text:Microservices Health & RED Metrics Radar"
    acceptance:
      - Given an admin opens /admin/cockpit after traffic has been driven through the gateway to a service
      - Then the HUD shows a non-zero, Prometheus-sourced RPS and latency for that service, reflecting the real activity rather than a fixed or random baseline
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Cockpit reflects real request activity"

  - id: ops.cockpit-idle-trends-zero
    title: Idle stack trends toward zero, not a random baseline
    persona: admin
    priority: P2
    summary: >-
      With no traffic flowing through the gateway, the exercised service's RPS
      trends toward zero as Prometheus reports, rather than the previous
      "~124 + rand()" stub baseline.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus]
    preconditions:
      login: admin
    acceptance:
      - Given no traffic is flowing through the gateway
      - Then the exercised service's RPS trends toward zero as Prometheus reports, rather than the previous random stub baseline
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Idle stack trends toward zero, not a random baseline"

  - id: ops.cockpit-no-raw-prometheus
    title: Browser cannot reach raw Prometheus through the gateway
    persona: admin
    priority: P2
    summary: >-
      The gateway is a thin read-only proxy: GET /api/admin/metrics returns only
      the shaped CockpitMetricsResponse JSON and no endpoint forwards arbitrary
      PromQL or raw Prometheus responses to the browser (architecture Rule 2).
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, prometheus]
    preconditions:
      login: admin
    acceptance:
      - When the cockpit endpoint GET /api/admin/metrics is called
      - Then the gateway returns only the shaped CockpitMetricsResponse JSON, and no endpoint forwards arbitrary PromQL or raw Prometheus responses to the browser
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Browser cannot reach raw Prometheus through the gateway"

  - id: ops.cockpit-prometheus-degrades
    title: Prometheus unavailable degrades gracefully
    persona: admin
    priority: P2
    summary: >-
      When PROMETHEUS_URL is unset or Prometheus is unreachable, GET
      /api/admin/metrics still returns a valid response in the expected
      CockpitMetricsResponse shape with cleared/zeroed metric values, never
      re-introducing random data.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: admin
    acceptance:
      - Given PROMETHEUS_URL is unset or Prometheus is unreachable
      - Then GET /api/admin/metrics still returns a valid response in the expected shape with null/unavailable metric values, never random or placeholder data
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Prometheus unavailable degrades gracefully"

  - id: ops.cockpit-orders-revenue-derived
    title: Orders, revenue and traces are never fabricated
    persona: admin
    priority: P2
    summary: >-
      total_orders_24h and total_revenue_24h come from team-analytics order facts
      and recent_traces from Jaeger; each is null/empty when its source is
      unavailable, and the HUD shows an honest "Chưa có dữ liệu" state instead of
      placeholder figures (never the old 1,420 orders / 384,500,000 ₫).
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, team-analytics]
    preconditions:
      login: admin
    acceptance:
      - When the cockpit response is produced
      - Then total_orders_24h and total_revenue_24h are real figures or null and no fabricated rows are returned
    tags: [admin, observability]
    status: automated
    covered_by: "ops-cockpit/cockpit_metrics.feature::Orders, revenue and traces are never fabricated"
    notes: >
      Scenario text changed with ops-cockpit-real-data (was "are null"); re-run against
      the stack before trusting the automated status.

  - id: ops.cockpit-anonymous-401
    title: Anonymous request to the cockpit endpoint is rejected
    persona: guest
    priority: P1
    summary: >-
      GET /api/admin/metrics without a token answers 401 before any upstream
      (Prometheus, team-analytics, Jaeger) is queried.
    entry_route: /admin/cockpit
    services: [team-gateway]
    preconditions:
      login: guest
    api:
      exercised: [admin.metrics]
    acceptance:
      - When GET /api/admin/metrics is called without a token
      - Then the gateway returns 401
    tags: [admin, observability, authz]
    status: automated
    covered_by: "ops/cockpit_real_data.feature::Anonymous request is rejected"
    notes: >
      Written in ops/cockpit_real_data.feature ("Anonymous request is rejected"); flips to automated, with covered_by,
      after it passes against the stack.

  - id: ops.cockpit-buyer-403
    title: A buyer cannot open the cockpit
    persona: buyer
    priority: P1
    summary: >-
      A signed-in buyer (no admin scope) gets 403 from GET /api/admin/metrics, and
      /admin/cockpit renders the admin-required 403 result instead of the HUD.
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [admin.metrics]
    ui:
      key_elements:
        forbidden: "text:Cần tài khoản Quản trị"
    acceptance:
      - When a signed-in buyer calls GET /api/admin/metrics
      - Then the gateway returns 403
      - And when the buyer opens /admin/cockpit the page renders a 403 result and no metrics
    tags: [buyer, admin, authz]
    status: automated
    covered_by: "ops/cockpit_real_data.feature::A buyer cannot open the cockpit"
    notes: >
      Written in ops/cockpit_real_data.feature ("A buyer cannot open the cockpit"); flips to automated, with covered_by,
      after it passes against the stack.

  - id: ops.cockpit-paid-order-24h
    title: A paid order shows up in the 24h figures
    persona: admin
    priority: P1
    summary: >-
      A buyer places and pays an order of 2 x 150,000 ₫; once order.events is ingested
      into order_facts, the admin cockpit's 24h order count rises by at least 1, GMV by at
      least 300,000 (other orders may be paid concurrently) and the order is in
      recent_orders with a total of 300,000 (within 30 s).
    entry_route: /admin/cockpit
    services: [team-frontend, team-gateway, team-analytics, team-order, team-payment, team-identity]
    preconditions:
      login: admin
      seed_tag: needsListing
      data: Requires Redpanda, the team-order outbox relayer and the team-analytics consumer running.
    api:
      exercised: [analytics.v1.GetPlatformOrderSummary, analytics.v1.ListRecentOrders]
    acceptance:
      - Given an admin has noted the 24h order figures
      - When a buyer places and pays an order of 2 x 150000 VND
      - Then within 30 seconds total_orders_24h has increased by at least 1 and total_revenue_24h by at least 300000
      - And recent_orders lists that order id with a total of 300000
    tags: [admin, observability, order]
    status: automated
    covered_by: "ops/cockpit_real_data.feature::A paid order shows up in the 24h figures"
    notes: >
      Written in ops/cockpit_real_data.feature ("A paid order shows up in the 24h figures"); flips to automated, with covered_by,
      after it passes against the stack.

  # ---- ui-foundation (design tokens + Exception shells). status: planned until the
  # ---- ui_foundation.feature scenarios have run green against the local stack.
  - id: ui.not-found
    title: Unknown route shows the 404 result
    persona: guest
    priority: P2
    summary: >-
      An unknown URL renders the Exception 404 result with a visible link back to
      the home page and an HTTP 404 status (src/app/not-found.tsx).
    entry_route: /does-not-exist
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - When a visitor opens /does-not-exist
      - Then the page shows a "not found" result with a visible link back to /
      - And the HTTP status is 404
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_foundation.feature::Unknown route shows the 404 result"

  - id: ui.error-recovery
    title: A thrown page error is recoverable
    persona: guest
    priority: P2
    summary: >-
      When a server component throws during render, src/app/error.tsx shows the
      error result with a "Thử lại" button that re-renders the segment. Needs a
      fault-injection hook (none exists), so it is covered by the Vitest shell test
      until a test route is added.
    entry_route: /
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - When a server component throws during render
      - Then the error result is shown with a "Thử lại" (retry) button
      - And clicking it re-renders the segment
    tags: [buyer]
    status: planned
    notes: >-
      Needs a server component that throws during render (fault injection); covered by render tests only.

  - id: ui.brand-colour-token
    title: The brand colour resolves from the design tokens
    persona: guest
    priority: P2
    summary: >-
      A primary action on the storefront renders the brand colour from the Tier 1
      primary scale (rgb(238, 77, 45)).
    entry_route: /
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the home page is open
      - Then the header search button's computed background colour is rgb(238, 77, 45)
      - And the --color-action-primary alias resolves to the same colour
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_foundation.feature::The brand colour resolves from the design tokens"

  - id: ui.alias-override
    title: Changing an alias restyles every user of it
    persona: guest
    priority: P2
    summary: >-
      Overriding --color-action-primary on :root restyles every component that
      consumes the alias (primary Button, sale PriceTag) with no component change.
    entry_route: /
    services: [team-frontend, team-search]
    preconditions:
      login: guest
      data: At least one listing must render so a PriceTag is on the page.
    acceptance:
      - Given the home page is open
      - When --color-action-primary is overridden on :root
      - Then every element styled by the action-primary alias renders the overridden colour
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_foundation.feature::Changing an alias restyles every user of it"

  # ---- ui-core-components (core component set + /dev/ui catalogue). The scenarios
  # ---- drive the dev-only /dev/ui page, so they need only the frontend, no backend.

  - id: ui.button-loading
    title: A loading button keeps its width and blocks clicks
    persona: guest
    priority: P2
    summary: >-
      Button isLoading swaps the label for a spinner overlay without changing the button width, sets aria-busy and ignores clicks.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - When the idle and loading "Thêm vào giỏ" buttons are compared
      - Then both have the same rendered width, the loading one has aria-busy=true and a spinner, and clicking it does nothing
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::A loading button keeps its width and blocks clicks"

  - id: ui.disabled-inert
    title: Disabled is announced and inert
    persona: guest
    priority: P2
    summary: >-
      A disabled interactive component carries aria-disabled=true and ignores pointer and keyboard activation.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
    acceptance:
      - Given the /dev/ui catalogue is open
      - Then the disabled button has the disabled attribute and aria-disabled=true
      - And clicking it or pressing Enter/Space on it changes nothing
    tags: [buyer]
    status: automated
    covered_by: "frontend/ui_components.feature::Disabled is announced and inert"

  - id: ui.focus-ring-keyboard
    title: Focus ring shows for keyboard users only
    persona: guest
    priority: P2
    summary: >-
      The 2px focus-ring alias ring is drawn on keyboard focus (Tab) and not on mouse click.
    entry_route: /dev/ui
    services: [team-frontend]
    preconditions:
      login: guest
