  - id: discovery.voucher-tabs
    title: Vouchers hub shows real vouchers with URL tabs
    persona: guest
    priority: P2
    summary: /vouchers renders the vouchers returned by team-promotion under ?type= tabs; no "Lưu mã", no browser wallet.
    entry_route: /vouchers
    services: [team-frontend, team-gateway, team-promotion]
    preconditions:
      login: guest
      data: A voucher seeded through the gateway with a seller token (CreateVoucher).
    api:
      seed: [promotion.v1.CreateVoucher]
      exercised: [promotion.v1.ListVouchers]
    ui:
      key_elements:
        voucher_card: "testid:voucher-card"
        tabs: "role:navigation=Tabs"
    acceptance:
      - When a visitor selects "Freeship" and reloads the page
      - Then the URL is /vouchers?type=shipping and the Freeship tab is still selected
      - Given a tab has no vouchers
      - Then Empty is shown with a "Xem sản phẩm" action linking to /search
      - Given /vouchers renders vouchers
      - Then no card has a "Lưu mã" or "Đã lưu" control and nothing is read from or written to localStorage
      - When a principal without listing.write opens /vouchers
      - Then VoucherManager is not rendered
      - Given /vouchers is rendered at 375px
      - Then voucher cards are one per row and the tabs scroll horizontally without page overflow
    tags: [promo, buyer]
    status: planned
    covered_by: null
    notes: >
      e2e scenarios "Visitor browses available vouchers", "Tab state survives reload", "Empty tab" (promo/vouchers.feature) and
      "Buyer explores voucher hub" (promo/voucher_hub.feature). The promotion service has no shipping voucher type, so the
      Freeship tab is always empty; confirm the seed tag name for CreateVoucher with the platform-e2e owners.

