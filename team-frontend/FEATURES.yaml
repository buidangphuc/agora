    acceptance:
      - WHEN a buyer places an order on the checkout page and the same checkout submission is sent a second time
      - THEN the buyer has exactly one new order and the listing's stock is reduced once
    tags: [buyer, ui]
    status: automated
    covered_by: "frontend/oic_inv_checkout_idempotency.feature::A replayed checkout submission creates no second order"
    notes: >-
      Scenario in frontend/oic_inv_checkout_idempotency.feature. The browser's server-action request is
      recorded and replayed unchanged after the cart is refilled (otherwise an empty cart would fail the
      replay on its own). RED on the pre-change stack: two orders exist, the replay created a second one (no Idempotency-Key yet).

