      - "When no 2-star review exists and the buyer opens ?rating=2"
      - "Then an Empty \"Không có đánh giá 2 sao\" with a \"Xem tất cả\" action is shown and that action removes rating from the URL"
      - "When the buyer clicks review-helpful on a review and the action succeeds"
      - "Then the count increases by one and the button is disabled"
      - "When a listing has 23 reviews and the buyer opens ?rpage=3"
      - "Then 3 reviews are listed and the pagination marks page 3 as current"
      - "When the buyer picks 5 stars, types a comment and submits the review modal"
      - "Then the submit button shows loading and the controls are disabled, then a success toast shows and the new review appears"
