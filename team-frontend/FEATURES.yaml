  - id: listing.pdp-reviews-url
    title: Review filter and pagination are URL state
    persona: buyer
    priority: P1
    summary: >-
      The star filter writes ?rating= and the list pages at 10 via ?rpage=; a filter
      with no match shows Empty with a way out; helpful votes and the review modal
      give pending and toast feedback.
    entry_route: /listing/{listing_id}
    services: [team-frontend, team-engagement]
    preconditions:
      login: buyer
      seed_tag: needsListing
