  # ---- ui-phase-product-detail (PDP rebuilt on the core components). status:
  # ---- planned until product_detail.feature has run green against the local stack.
  - id: listing.pdp-anatomy
    title: Product detail page follows the Basic Profile anatomy
    persona: buyer
    priority: P1
    summary: >-
      The PDP shows a breadcrumb, a header card (gallery + info column), the shop
      header card, an anchor nav over three stacked sections and the similar-items
      row, with exactly one h1.
    entry_route: /listing/{listing_id}
    related_routes: ["/shop/{seller_id}"]
    services: [team-frontend, team-domain, team-engagement]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        title: "css:h1"
        shop_card: "testid:shop-header-card"
        anchor_nav: "role:navigation[name=Nội dung sản phẩm]"
    acceptance:
      - "Given a buyer opens a published listing at a 1280px-wide viewport"
      - "Then the breadcrumb, the gallery and info column side by side, the shop header card, the anchor nav with the specs, reviews and Q&A sections and the similar-items row appear in that vertical order"
      - "And exactly one h1 contains the listing title"
      - "When the buyer views the \"Chi tiết\" section of a listing with stock 12 and a category"
      - "Then a Descriptions block lists \"Kho hàng: 12 sản phẩm\" and the category followed by the description"
      - "When the buyer clicks the third thumbnail of a listing with 4 images"
      - "Then the stage shows the third image and the stage bounding box is unchanged"
      - "When a listing has no imageKeys and no imageUrl"
      - "Then the stage renders the Image fallback placeholder and no external stock-photo URL is requested"
      - "And the stage image is eager and each thumbnail is lazy"
      - "When the seller's shop display name is \"Cửa hàng Hoa Mai\""
      - "Then the PDP shop card shows \"Cửa hàng Hoa Mai\" and not \"Shop #\""
      - "When the shop display name is empty"
      - "Then the shop card shows \"Shop #\" followed by the first 6 characters of the seller id"
      - "When a buyer clicks \"Xem Shop\" in the PDP shop card"
      - "Then the browser navigates to /shop/<sellerId>"
      - "When the seller has zero reviews"
      - "Then the shop card shows \"Chưa có đánh giá\" instead of \"0.0 / 5.0\""
    tags: [buyer, ui]
    status: planned

  - id: listing.pdp-variant-url
    title: Variant selection lives in the URL and drives price and stock
    persona: buyer
    priority: P1
    summary: >-
      Selecting a variant that changes price or stock writes ?variant=<id> and the
      server derives price, stock, SKU and image from it; a shared URL restores it.
    entry_route: /listing/{listing_id}
    services: [team-frontend, team-domain]
    preconditions:
      login: buyer
      data: a listing with variants (128GB base price, 256GB higher price, one out-of-stock variant)
    ui:
      key_elements:
        variant_256: "role:radio[name=256GB]"
        price: "testid:pdp-price"
    acceptance:
      - "When the buyer selects variant \"256GB\" whose price differs from the base listing"
      - "Then the URL gains ?variant=<id of 256GB> without a scroll jump or an extra history entry"
      - "And the price tag shows the 256GB price and the stock line shows that variant's stock"
      - "When a buyer opens /listing/<id>?variant=<id of 256GB> directly"
      - "Then the 256GB radio is checked and the price, stock and SKU show the 256GB values in the first server-rendered markup"
      - "When a buyer opens /listing/<id>?variant=does-not-exist"
      - "Then the first in-stock variant is selected and the page renders without an error"
      - "When a variant has stock 0"
      - "Then its radio is disabled with aria-disabled=\"true\", shows an \"Hết hàng\" tag and cannot be selected"
    tags: [buyer, ui]
    status: planned

  - id: listing.pdp-purchase-feedback
    title: Purchase actions give pending, disabled and toast feedback
    persona: buyer
    priority: P0
    summary: >-
      Thêm vào giỏ and Mua ngay show a pending state, disable together, toast the
      result and use the selected variant; Mua ngay then goes to /checkout.
    entry_route: /listing/{listing_id}
    related_routes: [/checkout, /cart]
    services: [team-frontend, team-domain, team-order]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        add_to_cart: "role:button[name=Thêm vào giỏ]"
        buy_now: "role:button[name=Mua ngay]"
    acceptance:
      - "When the buyer clicks \"Thêm vào giỏ\" with quantity 2 on an in-stock variant"
      - "Then both buttons are disabled with aria-busy on the clicked one while the action runs"
      - "And a success toast \"Đã thêm 2 sản phẩm vào giỏ hàng\" appears, the buttons re-enable and the cart counter increases"
      - "When the add action returns { ok: false, error }"
      - "Then an error toast with that message appears, no add_to_cart event is fired and both buttons are enabled again"
      - "When the selected variant has stock 3 and the buyer presses \"+\" four times"
      - "Then the quantity picker value is 3 and the \"+\" control is disabled"
      - "When the buyer selects variant \"256GB\", sets quantity 1 and clicks \"Mua ngay\""
      - "Then the cart contains that listing with the 256GB variant id and the browser navigates to /checkout"
      - "When the selected variant has stock 0"
      - "Then both actions and the quantity picker are disabled and a warning \"Phân loại này đã hết hàng\" is shown"
    tags: [buyer, ui]
    status: planned

  - id: listing.pdp-mobile-buy-bar
