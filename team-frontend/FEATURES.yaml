    ui:
      key_elements:
        rating_row: "testid:pdp-rating"
        price: "testid:pdp-price"
    acceptance:
      - "When the buyer opens a listing with zero reviews that is not on flash sale"
      - "Then the rating row reads \"Chưa có đánh giá\" and no strike-through price or discount badge exists"
      - "And the texts \"Đã Bán\", \"Mall\" and \"Official Store Partner\" do not appear"
      - "When the buyer opens a listing priced above 5,000,000 or whose title contains a brand keyword"
      - "Then no Mall badge is rendered"
      - "When the buyer opens a listing with an active flash-sale campaign"
      - "Then the strike-through shows the regular price, the price tag shows the campaign sale price and the discount percentage is computed from those two values"
    tags: [buyer, ui]
    status: automated
    covered_by: "frontend/product_detail.feature::A listing with no reviews shows no invented numbers"

  - id: listing.pdp-not-found
    title: An unknown listing and a failed fetch have recoverable states
    persona: guest
    priority: P2
    summary: >-
      An unknown listing id renders a product-specific Result 404 with a way home and
      to search; a non-NotFound failure renders an error Alert with a retry. The HTTP
      status stays 200 while the root loading.tsx streams (see design Open Question),
      so the e2e asserts the rendered result, not the status.
    entry_route: /listing/does-not-exist
    services: [team-frontend, team-domain]
    preconditions:
      login: guest
    acceptance:
      - "When a buyer opens /listing/does-not-exist"
      - "Then the page shows the Result 404 \"Không tìm thấy sản phẩm\" with \"Về trang chủ\" and \"Tìm sản phẩm khác\" actions"
      - "When the listing fetch fails with a non-NotFound error"
      - "Then an error Alert with a \"Thử lại\" button is shown and clicking it re-renders the route"
      - "When the route is navigated to and loading.tsx is shown, then the page resolves"
      - "Then the gallery stage, title block and anchor nav keep the same top offsets and the measured layout shift is 0"
    tags: [buyer, ui]
    status: automated
    covered_by: "frontend/product_detail.feature::An unknown listing renders the product not-found result"

  - id: listing.pdp-ai-recs-hidden
    title: AI summary and similar items stream and hide gracefully
    persona: buyer
    priority: P1
    summary: >-
      The AI review summary and the similar-items row stream in Suspense with a
      Skeleton, never delay the page, hide when their service is unavailable and keep
      the pdp_similar_items attribution.
    entry_route: /listing/{listing_id}
    services: [team-frontend, team-ai, team-engagement, team-analytics]
    preconditions:
      login: buyer
      seed_tag: needsListing
    ui:
      key_elements:
        recommendations: "text:Gợi ý cho bạn"
    acceptance:
      - "When team-ai responds slowly to SummarizeReviews"
      - "Then the header, price and actions are visible before the summary and a Skeleton holds its space until it resolves"
      - "When SummarizeReviews fails with UNAVAILABLE"
      - "Then the reviews section renders with no AI block, no error text and no leftover skeleton"
      - "When the recommendation service is slow"
      - "Then the page renders fully with a one-row Skeleton in the row's place and no layout shift when the cards arrive"
      - "When the recommendation service returns UNAVAILABLE"
      - "Then the page renders without the \"Gợi ý cho bạn\" row and without an error state"
      - "When a buyer opens a listing and then switches variants and uses the anchor nav"
      - "Then exactly one view_item event was sent"
      - "When the similar-items row scrolls into view and the buyer clicks the second card"
      - "Then impressions with placementId pdp_similar_items and positions 1..n were sent and a select_item with position 2 was sent before navigation"
      - "When the buyer adds quantity 2 of a listing priced 100000"
      - "Then one add_to_cart event is sent with value 200000, currency VND and the item id, name, price, quantity and category"
    tags: [buyer, ui, recommendations]
    status: planned
    notes: >-
      Scenarios live in recommendations/recommendations.feature, which cannot be collected in the e2e venv (needs pandas and platform-recsys).
