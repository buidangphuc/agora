# buf codegen for the edge gateway: messages + gRPC client stubs (to call
# upstream services) + Connect handlers (to serve gRPC/gRPC-web/JSON at the edge).
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/buidangphuc/team-gateway/generated
plugins:
  - remote: buf.build/protocolbuffers/go
    out: generated
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: generated
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: generated
    opt: paths=source_relative
inputs:
  - directory: proto
