      login: guest
    api:
      exercised:
      - search.v1.SearchService.SearchListings
    acceptance:
    - When a client sends X-Request-Id "e2e-req.42" on an RPC
    - Then the response header X-Request-Id is "e2e-req.42"
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::A well-formed request id is echoed

  - id: edge.request-id-replaced
    title: A malformed request id is replaced
    persona: guest
    priority: P2
