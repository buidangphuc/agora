    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::A signed token without a subject is rejected

  - id: edge.request-id-echoed
    title: A well-formed request id is echoed
    persona: guest
    priority: P2
    summary: A client X-Request-Id matching ^[A-Za-z0-9._-]{1,64}$ is returned unchanged.
