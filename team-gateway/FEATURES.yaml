  - id: edge.upstream-unavailable-no-detail
    title: An unreachable upstream is reported without internal detail
    persona: admin
    priority: P1
    summary: 'With team-audit stopped the gateway answers 503 ''service unavailable'' or 504 ''upstream
      timed out'' and leaks no host, port, dial or load-balancer text. Destructive: stops
      agora-team-audit-svc and restores it in teardown.'
    entry_route: /
    services:
    - team-gateway
    - team-audit
    preconditions:
      login: admin
    api:
      exercised:
      - audit.v1.AuditService.QueryAuditLog
    acceptance:
    - Given the seeded admin and team-audit is stopped
    - When the seeded admin calls QueryAuditLog through the gateway while team-audit is down
    - Then the gateway answers with a fixed upstream-failure message
    - And the body contains no host, port or dial error text
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::An unreachable upstream is reported without internal detail
    notes: 'DESTRUCTIVE (@destructive): runs in the serial lane only. A stopped container loses its DNS
      name, so the gateway times out (504) rather than getting a refused connection (503).'

  - id: edge.token-without-exp-rejected
