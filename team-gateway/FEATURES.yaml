      login: guest
    api:
      exercised:
      - search.v1.SearchService.SearchListings
    acceptance:
    - When a client sends an X-Request-Id containing spaces and angle brackets
    - Then the response header X-Request-Id is a different, well-formed id
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::A malformed request id is replaced

  - id: edge.idempotency-key-validated
