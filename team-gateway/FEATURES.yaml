# Feature manifest for team-gateway.
# Ownership rule: a feature belongs to the repo owning the CAPABILITY. The
# gateway owns edge-only, cross-cutting HTTP capabilities — identity resolution,
# request forwarding and edge telemetry (the /api/track collector) — holding no
# business logic and owning no domain storage (architecture Rule 2).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-gateway
owner: platform-team

features:
  - id: tracking.beacon-rejects-malformed
    title: Edge collector rejects a malformed browsing beacon without producing
    persona: buyer
    priority: P2
    summary: >-
      The gateway /api/track edge collector validates the beacon before mapping
      it to a TrackingEvent. A beacon with no recognizable event type or a
      malformed body is rejected with a client error and nothing is published to
      the analytics.events Kafka topic.
    entry_route: /
    services: [team-gateway]
    api:
      exercised: [analytics.v1.Track]
    preconditions:
      login: guest
    acceptance:
      - When the gateway receives a beacon with no recognizable event type
      - Then the gateway responds with a client error
      - And nothing is published to the analytics.events topic
    tags: [tracking]
    status: automated
    covered_by: "tracking/emit_tracking.feature::A malformed beacon is rejected without producing"

  - id: tracking.principal-in-envelope
    title: Authenticated browsing attributes the tracking event via the envelope
    persona: buyer
    priority: P2
    summary: >-
      The gateway sets EventEnvelope.principal from the edge-resolved principal
      (the same x-principal-* identity resolved for every request) and never
      copies authenticated user identity into TrackingEvent payload fields, which
      carry only behavioral context.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-gateway]
    api:
      exercised: [analytics.v1.Track]
    preconditions:
      login: buyer
      seed_tag: needsListing
    acceptance:
      - Given a buyer is logged in
      - When a logged-in buyer's view beacon is collected at the gateway
      - Then the produced EventEnvelope principal identifies the buyer
      - And the TrackingEvent payload contains no authenticated user id in its own fields
    tags: [buyer, tracking]
    status: automated
    covered_by: "tracking/emit_tracking.feature::Authenticated browsing attributes the event via the envelope"

  - id: tracking.best-effort-delivery
    title: A browsing action still succeeds when the tracking event cannot be delivered
    persona: buyer
    priority: P2
    summary: >-
      Telemetry emission is best-effort: the beacon is fired asynchronously and
      the gateway producer degrades to a no-op when Kafka is disabled
      (KAFKA_ENABLED=false) or the broker is unavailable, so recording an event
      never blocks or fails the buyer's browsing action.
    entry_route: /
    related_routes: ["/listing/{id}"]
    services: [team-gateway]
    api:
      exercised: [analytics.v1.Track]
    preconditions:
      login: buyer
      seed_tag: needsListing
    acceptance:
      - Given a buyer is logged in
      - When the buyer performs a tracked browsing action while the analytics producer is unavailable
      - Then the browsing action completes normally
      - And no user-visible error is shown
    tags: [buyer, tracking]
    status: automated
    covered_by: "tracking/emit_tracking.feature::A browsing action still succeeds when the event cannot be delivered"

  - id: gateway.client-ip-not-spoofable
    title: A client cannot spoof the recorded session IP
    persona: guest
    priority: P1
    summary: >-
      The gateway builds x-client-ip / x-client-user-agent from what it observed and
      overwrites any inbound value; X-Forwarded-For is honoured only from a peer listed in
      TRUSTED_PROXIES (the frontend). An untrusted client claiming another IP is recorded
      with its socket address.
    entry_route: /login
    services: [team-gateway, team-identity]
    preconditions:
      login: guest
    api:
      exercised: [identity.v1.Login, identity.v1.ListSessions]
    acceptance:
      - Given an untrusted client
      - When it logs in sending X-Forwarded-For and x-client-ip of 1.2.3.4
      - Then the recorded session IP is the socket address, not 1.2.3.4
    tags: [auth]
    status: automated
    covered_by: "auth/session_revocation.feature::A client cannot spoof the recorded session IP"
    notes: >-
      Scenario "A client cannot spoof the recorded session IP" in auth/session_revocation.feature.

  - id: edge.internal-rpcs-not-routed
    title: Internal stock and voucher saga RPCs are not routed at the edge
    persona: seller
    priority: P0
    summary: The saga-internal RPCs answer unimplemented (501) for every caller without contacting the upstream.
    entry_route: /
    services:
    - team-gateway
    - team-domain
    - team-promotion
    preconditions:
      login: seller
    api:
      exercised:
      - listing.v1.ListingService.ReserveStock
      - listing.v1.ListingService.ReleaseStock
      - promotion.v1.VoucherService.CommitReservation
      - promotion.v1.VoucherService.ReleaseReservation
    acceptance:
    - Given a logged-in seller with a listing in stock
    - When the seller calls ReserveStock, ReleaseStock, CommitReservation and ReleaseReservation through
      the gateway
    - Then each call answers HTTP 501 with code unimplemented
    - And the listing's stock is unchanged
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::Internal stock and voucher saga RPCs answer 501 at the
      edge

  - id: edge.audit-write-not-routed
    title: Writing an audit event is not exposed at the edge
    persona: seller
    priority: P0
    summary: 'WriteAuditEvent is service-only: a seller or the admin gets 501 and nothing is stored.'
    entry_route: /
    services:
    - team-gateway
    - team-audit
    preconditions:
      login: seller
    api:
      exercised:
      - audit.v1.AuditService.WriteAuditEvent
      - audit.v1.AuditService.QueryAuditLog
    acceptance:
    - Given a logged-in seller and the seeded admin
    - When the seller and the seeded admin call WriteAuditEvent through the gateway for a fresh target type
    - Then the gateway answers HTTP 501 for each write
    - And no audit event is stored for that target type
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::Writing an audit event is not exposed at the edge

  - id: edge.admin-rpc-anonymous-401
    title: Anonymous callers are refused on admin-only RPCs
    persona: guest
    priority: P0
    summary: QueryAuditLog, ReviewKyc and ResolveDispute need authentication at the edge before being forwarded.
    entry_route: /
    services:
    - team-gateway
    preconditions:
      login: guest
    api:
      exercised:
      - audit.v1.AuditService.QueryAuditLog
      - verification.v1.VerificationService.ReviewKyc
      - engagement.v1.EngagementService.ResolveDispute
    acceptance:
    - Given an anonymous client
    - When the client calls QueryAuditLog, ReviewKyc and ResolveDispute through the gateway
    - Then each admin-only call answers HTTP 401
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::Anonymous call to an admin-only RPC

  - id: edge.admin-rpc-buyer-403
    title: A buyer is refused on admin-only RPCs
    persona: buyer
    priority: P0
    summary: A verified caller without the admin scope gets permission_denied (403) on the admin-only RPCs.
    entry_route: /
    services:
    - team-gateway
    preconditions:
      login: buyer
    api:
      exercised:
      - audit.v1.AuditService.QueryAuditLog
      - verification.v1.VerificationService.ReviewKyc
      - engagement.v1.EngagementService.ResolveDispute
    acceptance:
    - Given a logged-in buyer
    - When the buyer calls QueryAuditLog, ReviewKyc and ResolveDispute through the gateway
    - Then each admin-only call answers HTTP 403
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::Buyer call to an admin-only RPC

  - id: edge.admin-may-query-audit
    title: The seeded admin may query the audit log
    persona: admin
    priority: P1
    summary: The admin scope passes the edge gate and QueryAuditLog answers with an events list.
    entry_route: /
    services:
    - team-gateway
    - team-audit
    - team-identity
    preconditions:
      login: admin
    api:
      exercised:
      - audit.v1.AuditService.QueryAuditLog
    acceptance:
    - Given the seeded admin
    - When the seeded admin calls QueryAuditLog through the gateway
    - Then the request succeeds with an events list
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::Admin may query the audit log

  - id: edge.upstream-unavailable-no-detail
    title: An unreachable upstream is reported without internal detail
    persona: admin
    priority: P1
    summary: 'With team-audit stopped the gateway answers 503 ''service unavailable'' or 504 ''upstream
      timed out'' and leaks no host, port, dial or load-balancer text. Destructive: stops
      agora-team-audit-svc and restores it in teardown.'
    entry_route: /
    services:
    - team-gateway
    - team-audit
    preconditions:
      login: admin
    api:
      exercised:
      - audit.v1.AuditService.QueryAuditLog
    acceptance:
    - Given the seeded admin and team-audit is stopped
    - When the seeded admin calls QueryAuditLog through the gateway while team-audit is down
    - Then the gateway answers with a fixed upstream-failure message
    - And the body contains no host, port or dial error text
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::An unreachable upstream is reported without internal detail
    notes: 'DESTRUCTIVE (@destructive): runs in the serial lane only. A stopped container loses its DNS
      name, so the gateway times out (504) rather than getting a refused connection (503).'

  - id: edge.token-without-exp-rejected
    title: A signed token without an expiry is rejected
    persona: buyer
    priority: P1
    summary: A token that verifies against the JWKS but has no exp claim is refused with 401.
    entry_route: /
    services:
    - team-gateway
    - team-identity
    preconditions:
      login: buyer
    api:
      exercised:
      - order.v1.OrderService.ListBuyerOrders
    acceptance:
    - Given a token signed by the identity key is accepted when it carries exp and sub
    - When a client calls an authenticated RPC with a token signed by the identity key that has no exp claim
    - Then the gateway answers HTTP 401
    tags:
    - security
    - edge
    status: automated
    covered_by: security/edge_route_policy.feature::A signed token without an expiry is rejected

