name: CI - platform-modelserve

on:
  push:
    branches: [main]
    paths:
      - "platform-modelserve/**"
  pull_request:
    paths:
      - "platform-modelserve/**"

jobs:
  test:
    name: Lint, Test & Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-modelserve
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: make lint

      - name: Run unit & contract conformance tests
        run: make test
