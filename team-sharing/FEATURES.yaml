# Feature manifest for team-sharing.
# Schema: platform-e2e/schemas/features.schema.json
repo: team-sharing
owner: sharing-team

features:
  - id: sharing.create-and-resolve-link
    title: A created share link resolves back to its target with OG meta
    persona: seller
    priority: P1
    summary: A seller creates a share link through the gateway and resolving the short code returns the target, OG meta defaults and click_count 1 (change sharing-go-sdk-v1).
    entry_route: /
    services:
    - team-sharing
    - team-gateway
    preconditions:
      login: seller
    api:
      exercised:
      - sharing.v1.CreateShareLink
      - sharing.v1.ResolveShareLink
    acceptance:
    - Given an authenticated seller
    - When the seller creates a share link for target "listing" "listing_001"
    - Then resolving the short code returns target "listing" "listing_001"
    - And the resolved link carries OG meta
    - And the resolved link has click count 1
    tags:
    - sharing
    status: automated
    covered_by: services/new_services.feature::A created share link resolves back to its target with OG meta
  - id: sharing-runtime.handler-round-trip-returns-the-stored-link
    title: Handler round trip returns the stored link
