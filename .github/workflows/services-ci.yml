name: services-ci

# Per-service CI ported from the (dead) nested workflows in team-ai/, platform-recsys/,
# platform-modelserve/ (GitHub only reads the repo-root .github/). Steps preserved.
on:
  push:
    branches: [main]
    paths: ["team-ai/**", "platform-recsys/**", "platform-modelserve/**", "platform-finetune/**", "platform-core/packages/py-modelregistry/**", ".github/workflows/services-ci.yml"]
  pull_request:
    paths: ["team-ai/**", "platform-recsys/**", "platform-modelserve/**", "platform-finetune/**", "platform-core/packages/py-modelregistry/**", ".github/workflows/services-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Mirrors team-ai/docs/agents/project.md "Checks". `.env.example` is team-ai's; the eval gate and the
  # core-only import read it through `--env-file`.
  team-ai-uv:
    name: team-ai lint, types, tests, eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-ai
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: team-ai/uv.lock
      - name: Install (dev group + all extras)
        run: uv sync --dev --all-extras
      - name: Generate gRPC stubs (gitignored per ADR-0001)
        run: uv run --all-extras python -m scripts.gen_proto
      - name: Format
        run: uv run ruff format --check app tests scripts
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Types
        run: uv run --all-extras pyright --project pyproject.toml
      - name: .env.example matches Settings
        run: uv run --all-extras python -m scripts.check_env_example
      - name: Run tests
        run: uv run --all-extras pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Real Redis (rate limiter and quota; fakeredis hid real bugs)
        env:
          REAL_REDIS_URL: redis://localhost:6379/15
        run: uv run --all-extras pytest -q -p tests.plugins.real_redis tests/unit/modules/test_rate_limit.py tests/unit/modules/test_quota.py
      - name: Eval gate (deterministic cases; judge cases are skipped without a judge)
        run: uv run --env-file .env.example --all-extras python -m scripts.run_eval --min-score 0.8

  team-ai-core-only:
    name: team-ai boots on core dependencies only
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: team-ai/uv.lock
      - name: Install (no dev, no extras)
        run: uv sync --frozen --no-dev
      - name: Generate gRPC stubs (grpcio-tools is a dev dependency, so run it from uvx)
        run: uvx --from "grpcio-tools==$(uv run --no-dev python -c 'import grpc; print(grpc.__version__)')" python -m scripts.gen_proto
      - name: Import main
        run: uv run --no-dev --env-file .env.example python -c "import main; print('ok')"

  platform-recsys:
    name: platform-recsys Lint, Test & Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-recsys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: platform-recsys/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Check syntax (compile)
        run: make compile
      - name: Lint (ruff & black)
        run: make lint
      - name: Environment drift gate
        run: make check-env
      - name: Run PySpark-free unit tests & eval suite
        run: make test-host
      - name: Run offline evaluation CLI
        run: make eval

  # Offline tests only: no GPU, dataset or network. The `dev` extra resolves in about a minute with uv
  # (pip's resolver hangs on dvc/sagemaker/triton); `modelregistry` comes from [tool.uv.sources]. mlflow is
  # pinned to the range py-modelregistry's mlflow-skinny needs, else the extra pulls an incompatible mlflow.
  platform-finetune:
    name: platform-finetune Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-finetune
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: platform-finetune/pyproject.toml
      - name: Install (dev + cpu extras)
        run: uv pip install --system -e '.[dev,cpu]' 'mlflow>=3.2,<3.3'
      - name: Run offline tests
        run: python -m pytest tests -q

  platform-modelserve:
    name: platform-modelserve Lint, Test & Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-modelserve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform-modelserve/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: make lint
      - name: Run unit & contract conformance tests
        run: make test

  py-modelregistry:
    name: py-modelregistry Lint, Types & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-core/packages/py-modelregistry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: platform-core/packages/py-modelregistry/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy src
      - name: Run tests
        run: pytest -q
