name: services-ci

# Per-service CI ported from the (dead) nested workflows in team-ai/, platform-recsys/,
# platform-modelserve/ (GitHub only reads the repo-root .github/). Steps preserved.
on:
  push:
    branches: [main]
    paths: ["team-ai/**", "platform-recsys/**", "platform-modelserve/**", ".github/workflows/services-ci.yml"]
  pull_request:
    paths: ["team-ai/**", "platform-recsys/**", "platform-modelserve/**", ".github/workflows/services-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  team-ai:
    name: team-ai Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: team-ai/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Environment drift gate
        run: pytest tests/test_env_drift.py -v
      - name: Run unit & RAG contract tests
        run: pytest tests/ -k "not integration and not slow" -v

  team-ai-uv:
    name: team-ai pytest + eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Run tests
        run: uv run --all-extras pytest -q
      - name: Eval gate (deterministic + chat resilience cases; an unscored judge case fails it)
        run: uv run --all-extras python -m scripts.run_eval --min-score 0.8

  platform-recsys:
    name: platform-recsys Lint, Test & Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-recsys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: platform-recsys/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Check syntax (compile)
        run: make compile
      - name: Lint (ruff & black)
        run: make lint
      - name: Environment drift gate
        run: make check-env
      - name: Run PySpark-free unit tests & eval suite
        run: make test-host
      - name: Run offline evaluation CLI
        run: make eval

  platform-modelserve:
    name: platform-modelserve Lint, Test & Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-modelserve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform-modelserve/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: make lint
      - name: Run unit & contract conformance tests
        run: make test
