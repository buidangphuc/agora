name: fe-platform-ci

on:
  push:
    branches: [main]
    paths: ["fe-platform/**", "team-frontend/vendor/**", ".github/workflows/fe-platform-ci.yml"]
  pull_request:
    paths: ["fe-platform/**", "team-frontend/vendor/**", ".github/workflows/fe-platform-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: fe-platform check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe-platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-platform/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build -w templates/app
      - name: changeset required for published packages
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: npm run release:status
