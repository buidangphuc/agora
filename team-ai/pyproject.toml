[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI template project"
readme = "README.md"
requires-python = ">=3.12,<3.14"  # uvloop<0.22 does not support 3.14
authors = [{ name = "Bui Dang Phuc", email = "buidangphuc2801@gmail.com" }]
dependencies = [
  "fastapi>=0.115.12,<1.0.0",
  "grpcio>=1.66,<2.0",
  "grpcio-health-checking>=1.66,<2.0",
  "grpcio-reflection>=1.66,<2.0",
  "httptools>=0.6.4,<0.7.0",
  "httpx>=0.28.1,<0.29.0",
  "loguru>=0.7.3,<0.8.0",
  "orjson>=3.10.0,<4.0.0",
  "pydantic>=2.11.1,<3.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "qdrant-client>=1.19,<2.0",
  "redis>=5.2.1,<6.0.0",
  "uvicorn>=0.34.0,<0.35.0",
  "uvloop>=0.21.0,<0.22.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
# LLM/RAG/tracing stack — install with `uv sync --extra ai` (or pip '.[ai]').
# The app boots without it; AI entry points raise a clear error when missing.
ai = [
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langfuse>=4.0,<5.0",
  "langgraph>=1.0,<2.0",
  "llama-index-core>=0.14,<0.15",
  "llama-index-vector-stores-qdrant>=0.8,<0.11",
  "openai>=1.69.0,<3.0.0",
]
# Listing indexer (runs with RAG_ENABLED); cramjam decodes the Go producers' snappy batches.
kafka = ["aiokafka>=0.12,<1.0", "cramjam>=2.8,<3.0"]
# Optional OpenTelemetry (traces + GenAI metrics) — `uv sync --extra otel`.
# The app boots without it; setting OTEL_EXPORTER_OTLP_ENDPOINT raises a clear error when it is missing.
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0,<2.0.0",
  "fakeredis[lua]>=2.26.0,<3.0.0",
  "grpcio-tools>=1.66,<2.0",
  "pre-commit>=4.3.0,<5.0.0",
  "pyright>=1.1.390,<2.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest-asyncio>=0.25.3,<0.26.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "ruff>=0.11.2,<0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["app/transport/grpc/_pb/*"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".venv",
  "app/transport/grpc/_pb",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",  # line length (formatter handles)
  "B008",  # FastAPI Depends() default
  "SIM117", # nested with statements (common in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017", "B018"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["app", "tests", "main.py"]
extraPaths = ["."]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.ruff_cache",
  ".venv",
  ".uv-cache",
  "app/transport/grpc/_pb",
  "scripts",
  "docs",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportInconsistentOverload = "error"
reportInvalidStringEscapeSequence = "error"
reportSelfClsParameterName = "warning"
reportMatchNotExhaustive = "error"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportAttributeAccessIssue = "warning"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportPrivateUsage = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"

[tool.uv]
constraint-dependencies = ["httpx2>=2.12", "httpcore2>=2.10"]
