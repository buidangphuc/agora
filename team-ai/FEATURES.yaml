    services: [team-ai, team-gateway]
    preconditions:
      login: buyer
      data: "Compose overlay platform-e2e/compose/llm-fake.override.yaml applied (team-ai on CHAT_BACKEND=llm_router against the llm-fake provider)."
    api:
      exercised: [chat.v1.StreamChat]
    acceptance:
      - "When a buyer streams a chat message through the gateway and every fake target is healthy"
      - "Then the full reply comes from the primary target"
    tags: [ai, resilience]
    status: automated
    covered_by: "ai/llm_routing.feature::A healthy primary serves the reply"
    notes: "Scenario: ai/llm_routing.feature::A healthy primary serves the reply. Written ahead of the code (ai-path-resilience); red until the team-ai code track is merged and the llm-fake overlay is up; the integrator flips it to automated."
