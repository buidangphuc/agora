# Feature manifest for team-ai (FastAPI: RAG assistant, magic listing, copilot).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-ai
owner: ai-team

features:
  - id: ai.shopping-assistant
    title: AI shopping assistant (RAG)
    persona: buyer
    priority: P1
    summary: A buyer asks the assistant for product advice and gets grounded answers.
    entry_route: /assistant
    services: [team-ai, team-frontend]
    preconditions:
      login: buyer
    api:
      exercised: [ai.v1.ShoppingAssistant]
    acceptance:
      - Given the assistant page is open
      - When the buyer asks for a product recommendation
      - Then the assistant returns advice referencing catalog products
    tags: [ai]
    status: automated
    covered_by: "ai/assistant.feature::Assistant answers a shopping question"

  - id: ai.magic-listing
    title: AI magic-listing SEO fill
    persona: seller
    priority: P2
    summary: The seller form auto-generates an SEO description and suggested price.
    entry_route: /seller/new
    services: [team-ai, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [ai.v1.MagicListing]
    ui:
      key_elements:
        magic_button: "text:AI Tạo Mô Tả"
    acceptance:
      - Given the new-listing form is open with a title
      - When the seller clicks the AI generate button
      - Then a description and suggested price are filled in
    tags: [seller, ai]
    status: automated
    covered_by: "ai/magic_listing.feature::AI fills the listing description"

  - id: ai.chat-copilot
    title: Seller chat copilot
    persona: seller
    priority: P2
    summary: The chat copilot drafts seller replies to buyer messages.
    entry_route: "/chat/{thread_id}"
    services: [team-ai, team-chat, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [ai.v1.ChatCopilot]
    acceptance:
      - Given a seller is in a buyer conversation
      - When a buyer sends a question
      - Then the copilot offers 3 one-click reply drafts
    tags: [seller, chat, ai]
    status: automated
    covered_by: "ai/chat_copilot.feature::Seller uses chat copilot to generate reply drafts"

  - id: ai.tag-classifier-taxonomy
    title: Product & SKU tag classification and filter enrichment
    persona: seller
    priority: P1
    summary: AI classifies SPU and granular SKU variants, discovering candidate tags and promoting them to canonical search filter facets.
    entry_route: /seller/new
    services: [team-ai, team-search, team-frontend]
    api:
      exercised: [ai.v1.TagClassifier]
    acceptance:
      - Given a seller enters product title and child SKU variants
      - When tag classification is requested
      - Then canonical SPU tags and granular SKU variant facets are returned
    tags: [ai, seller, search, taxonomy]
    status: automated
    covered_by: "ai/tag_classifier_taxonomy.feature::SPU Level Tag Classification"

  - id: ai.summarize-reviews
    title: AI review summarization
    persona: buyer
    priority: P2
    summary: Product reviews are distilled into pros/cons and a sentiment summary.
    entry_route: "/product/{listing_id}"
    services: [team-ai, team-frontend]
    api:
      exercised: [ai.v1.SummarizeReviews]
    acceptance:
      - Given a listing has multiple customer reviews
      - When the PDP loads
      - Then an AI summary highlights key pros, cons, and overall sentiment
    tags: [ai, buyer, reviews]
    status: automated
    covered_by: "engagement/reviews_and_qa.feature::Buyer submits a product question and views reviews"

  - id: recommendations.contract-proto
    title: Recommendation contract compiles cleanly
    persona: buyer
    priority: P1
    summary: buf lint and buf breaking pass after adding the recommendation proto additively.
    entry_route: "/product/{listing_id}"
    services: [platform-core]
    acceptance:
      - Given platform/recommendation/v1/recommendation.proto is added to packages/proto
      - When buf lint and buf breaking run over packages/proto
      - Then lint passes under STANDARD rules and the breaking check passes
    tags: [recommendations, contract]
    status: automated
    covered_by: "recommendations/recommendation_contract.feature::The recommendation proto lints and stays non-breaking"

  - id: recommendations.contract-request
    title: An anonymous PDP similar-items request is expressible
    persona: guest
    priority: P1
    summary: RecommendRequest can express an anonymous item-item similar-items request.
    entry_route: "/product/{listing_id}"
    services: [platform-core]
    acceptance:
      - Given a RecommendRequest with anonymous_id, seed_listing_id, SIMILAR_ITEMS context, and limit 12
      - When the message is validated against the contract
      - Then it is valid and the serving layer has every field for an anonymous item-item strategy
    tags: [recommendations, contract]
    status: automated
    covered_by: 'recommendations/recommendation_contract.feature::An anonymous PDP "similar items" request is expressible'

  - id: recommendations.contract-response
    title: A ranked result set is expressible with provenance
    persona: buyer
    priority: P1
    summary: RecommendResponse expresses ordered ranked items with scores and a model_version.
    entry_route: "/product/{listing_id}"
    services: [platform-core]
    acceptance:
      - Given a RecommendResponse filled with ordered RecommendedItems and a model_version
      - When a consumer reads the response
      - Then it can render the ranking by listing_id and rank, threshold on score, and trace model_version
    tags: [recommendations, contract]
    status: automated
    covered_by: "recommendations/recommendation_contract.feature::A ranked result set is expressible with provenance"

  - id: ai.buyer-cannot-use-listing-generator
    title: A buyer cannot use the listing generator
    persona: buyer
    priority: P1
    summary: MagicListing needs listing.write; a buyer token is refused at the gateway.
    entry_route: /seller/new
    services: [team-ai, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [ai.v1.MagicListing]
    acceptance:
      - Given a logged-in buyer
      - When a logged-in buyer calls MagicListing through the gateway
      - Then the gateway answers HTTP 403
    tags: [ai, security]
    status: automated
    covered_by: "security/ai_access.feature::A buyer cannot use the listing generator"

  - id: ai.seller-cannot-run-copilot-as-another-seller
    title: A seller cannot run the copilot as another seller
    persona: seller
    priority: P1
    summary: ChatCopilot refuses a seller_id other than the caller's own.
    entry_route: /seller/chat
    services: [team-ai, team-gateway]
    preconditions:
      login: seller
    api:
      exercised: [ai.v1.ChatCopilot]
    acceptance:
      - Given a logged-in seller and another seller
      - When the seller calls ChatCopilot through the gateway with the other seller's seller_id
      - Then the gateway answers HTTP 403
    tags: [ai, security]
    status: automated
    covered_by: "security/ai_access.feature::A seller cannot run the copilot as another seller"

  - id: recommendations.recommend-bound-to-caller
    title: A buyer cannot fetch another user's recommendations
    persona: buyer
    priority: P1
    summary: Recommend serves a signed-in user as themselves whatever user_id the request carries (distinguished by per-user precomputed lists seeded in Redis).
    entry_route: /
    services: [team-ai, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [recommendation.v1.Recommend]
    acceptance:
      - Given two buyers with distinct precomputed recommendation lists
      - When a logged-in buyer calls Recommend through the gateway with another user's user_id
      - Then the response is computed for the calling buyer, not for the named user
    tags: [recommendations, security]
    status: automated
    covered_by: "security/ai_access.feature::A buyer cannot fetch another user's recommendations"
  - id: ai.apr-a-healthy-primary-serves-the-reply
    title: "A healthy primary serves the reply"
    persona: buyer
    priority: P1
    summary: "A healthy primary serves the reply"
