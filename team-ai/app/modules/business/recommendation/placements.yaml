# Recommendation Placements Configuration (ADR-0012)
# WHAT layer: defines placement slots, candidate source ladders, ranking and caching policies.

version: "1.0"
placements:
  home_feed:
    result_limit: 10
    candidate_ladder:
      - strategy: "user_precomputed"
        min_candidates: 1
      - strategy: "seed_vector_similarity"
        min_candidates: 1
      - strategy: "category_popular"
        min_candidates: 1
      - strategy: "global_popular"
        min_candidates: 1
    ranking:
      model: "gbdt"
      use_featurestore: true
    filters:
      in_stock_only: true
      deduplicate_sellers: false

  similar_items:
    result_limit: 10
    candidate_ladder:
      - strategy: "seed_vector_similarity"
        min_candidates: 1
      - strategy: "category_popular"
        min_candidates: 1
      - strategy: "global_popular"
        min_candidates: 1
    ranking:
      model: "cosine_rank"
    filters:
      in_stock_only: true
      exclude_seed: true

  cart_cross_sell:
    result_limit: 8
    candidate_ladder:
      - strategy: "cart_cross_similarity"
        min_candidates: 1
      - strategy: "category_popular"
        min_candidates: 1
      - strategy: "global_popular"
        min_candidates: 1
    ranking:
      model: "gbdt"
      use_featurestore: true
    filters:
      in_stock_only: true
      exclude_cart_items: true
      deduplicate_sellers: true
