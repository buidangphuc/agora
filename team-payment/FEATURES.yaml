    api:
      exercised: [payment.v1.ProcessMockPayment, payment.v1.ListLedgerEntries, payment.v1.GetWalletBalance]
    acceptance:
      - "When a buyer pays a `Pending` order of 500000 with the mock payment and the order becomes `Paid`"
      - "Then within the settle window the seller's `ListLedgerEntries` through the gateway shows exactly one new `ORDER_SETTLEMENT` entry of +500000 with status `COMPLETED`, and `GetWalletBalance` grew by 500000"
