# Feature manifest for team-payment (mock payment + seller wallet/payouts).
# Schema: platform-e2e/schemas/features.schema.json
repo: team-payment
owner: payment-team

features:
  - id: payment.mock-pay
    title: Mock payment for an order
    persona: buyer
    priority: P0
    summary: A buyer completes a demo payment and the order becomes PAID.
    entry_route: "/checkout/pay/{order_id}"
    services: [team-payment, team-order, team-frontend]
    preconditions:
      login: buyer
      data: An order in PENDING state awaiting payment.
    api:
      exercised: [payment.v1.ProcessMockPayment, payment.v1.CreatePayment, payment.v1.GetPayment]
    acceptance:
      - Given a buyer has a pending order
      - When the buyer completes the demo payment
      - Then the order status becomes PAID
    tags: [buyer]
    status: automated
    covered_by: "payment/mock_pay.feature::Buyer completes mock payment for an order"
    notes: >
      Hardened: on settle, team-payment writes payment=PAID and a
      platform.payment.v1.PaymentSettled event to payment.events in the SAME
      transaction (transactional outbox), instead of a fire-and-forget
      order.UpdateOrderStatus RPC; team-order consumes it idempotently to reach PAID.
      No more payment=PAID + order=PENDING dual-write (SA-H3). See ADR-0009
      (payment↔order event integration), ADR-0007 (durable saga).

  - id: payment.seller-wallet
    title: Seller wallet balance
    persona: seller
    priority: P1
    summary: A seller views wallet balance accrued from completed orders.
    entry_route: /seller/analytics
    services: [team-payment, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [payment.v1.GetSellerWallet]
    ui:
      key_elements:
        wallet_balance: "text:Số dư ví"
    acceptance:
      - Given a seller is logged in
      - When the seller opens analytics
      - Then the wallet balance is shown
    tags: [seller]
    status: automated
    covered_by: "seller/fulfillment_and_payout.feature::Seller views analytics and requests wallet payout"

  - id: payment.payout
    title: Request a bank payout
    persona: seller
    priority: P2
    summary: A seller withdraws wallet balance and sees it in payout history.
    entry_route: /seller/analytics
    services: [team-payment, team-frontend]
    preconditions:
      login: seller
    api:
      exercised: [payment.v1.RequestPayout, payment.v1.ListPayoutHistory]
    acceptance:
      - Given a seller has a positive wallet balance
      - When the seller requests a payout
      - Then the payout appears in payout history
    tags: [seller]
    status: automated
    covered_by: "fintech/seller_payout.feature::Seller requests a bank payout from wallet balance"

  - id: payment.refund
    title: Refund on approved return
    persona: buyer
    priority: P2
    summary: An approved RMA triggers a refund back to the buyer.
    entry_route: /account/orders
    services: [team-payment, team-order]
    preconditions:
      login: buyer
    api:
      exercised: [payment.v1.RefundPayment]
    acceptance:
      - Given a return request is approved
      - When the refund is processed
      - Then the buyer is refunded and the transaction is recorded
    tags: [buyer]
    status: automated
    covered_by: "payment/refund.feature::Refund payment is processed on approved return"

  - id: payment.seller-reads-own-wallet
    title: A seller reads their own wallet
    persona: seller
    priority: P0
    summary: >-
      GetSellerWallet for the caller's own seller id is served.
    entry_route: /seller/wallet
    services: [team-payment, team-gateway]
    preconditions:
      login: seller
    acceptance:
      - Given a signed-in seller
      - When the seller requests their wallet
      - Then the wallet call returns 200
    tags: [payment, seller, authz]
    status: automated
    covered_by: "payment/seller_wallet_access.feature::A seller reads their own wallet"
    notes: >
      IDOR regression: the wallet RPCs used to trust the request seller_id, so any
      signed-in user could read a seller's wallet or book a payout from it to their
      own bank account.
  - id: payment.buyer-cannot-pay-out-seller-wallet
    title: A buyer cannot request a payout from a seller's wallet
    persona: buyer
    priority: P0
    summary: >-
      RequestPayout with another seller's id is denied by team-payment (403) and no payout is booked.
    entry_route: /seller/wallet
    services: [team-payment, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - Given a signed-in seller and a signed-in buyer
      - When the buyer requests a payout from the seller's wallet to their own bank account
      - Then the wallet call returns 403 and the seller's payout history has no payout
    tags: [payment, seller, authz]
    status: automated
    covered_by: "payment/seller_wallet_access.feature::A buyer cannot request a payout from a seller's wallet"
    notes: >
      IDOR regression: the wallet RPCs used to trust the request seller_id, so any
      signed-in user could read a seller's wallet or book a payout from it to their
      own bank account.
  - id: payment.user-cannot-read-other-ledger
    title: A user cannot read another seller's ledger
    persona: buyer
    priority: P0
    summary: >-
      ListLedgerEntries with another seller's id is denied with 403.
    entry_route: /seller/wallet
    services: [team-payment, team-gateway]
    preconditions:
      login: buyer
    acceptance:
      - Given a signed-in seller and a signed-in buyer
      - When the buyer requests the seller's ledger
      - Then the wallet call returns 403
    tags: [payment, seller, authz]
    status: automated
    covered_by: "payment/seller_wallet_access.feature::A user cannot read another seller's ledger"
    notes: >
      IDOR regression: the wallet RPCs used to trust the request seller_id, so any
      signed-in user could read a seller's wallet or book a payout from it to their
      own bank account.
  - id: payment.admin-reads-but-cannot-pay-out
    title: An admin reads a seller's wallet but cannot pay it out
    persona: admin
    priority: P0
    summary: >-
      An admin may read any seller's wallet; payouts are owner-only, so an admin's RequestPayout is denied with 403.
    entry_route: /seller/wallet
    services: [team-payment, team-gateway]
    preconditions:
      login: admin
    acceptance:
      - Given a signed-in seller and an admin
      - When the admin requests the seller's wallet, then a payout
      - Then the read returns 200 and the payout returns 403
    tags: [payment, seller, authz]
    status: automated
    covered_by: "payment/seller_wallet_access.feature::An admin reads a seller's wallet but cannot pay it out"
    notes: >
      IDOR regression: the wallet RPCs used to trust the request seller_id, so any
      signed-in user could read a seller's wallet or book a payout from it to their
      own bank account.

  - id: payment.local-stack-settles-through-mock-payment
    title: The local stack settles a checkout through the mock payment
    persona: buyer
    priority: P0
    summary: >-
      With MOCK_PAYMENTS=true (local compose) ProcessMockPayment settles and the order becomes paid.
    entry_route: /
    services: [team-payment, team-order, team-gateway]
    preconditions:
      login: buyer
    api:
      exercised: [payment.v1.CreatePayment, payment.v1.ProcessMockPayment]
    acceptance:
      - Given a buyer with a pending MOCK_BANK order
      - When the buyer pays with the mock payment
      - Then the payment succeeds and the order becomes paid
    tags: [payment, saga]
    status: automated
    covered_by: "payment/mock_payment_gate.feature::The local stack settles a checkout through the mock payment"

  - id: payment.boot-guard-refuses-mock-in-production
    title: team-payment refuses mock payments in production
    persona: admin
    priority: P0
    summary: >-
      The team-payment image started with ENV=production and MOCK_PAYMENTS=true exits non-zero and logs MOCK_PAYMENTS.
    entry_route: /
    services: [team-payment]
    preconditions:
      login: admin
    api:
      exercised: []
    acceptance:
      - When the team-payment image is started with ENV=production and MOCK_PAYMENTS=true
      - Then the process exits non-zero and its log names MOCK_PAYMENTS
    tags: [payment, ops]
    status: automated
    covered_by: "ops/boot_guard_payment.feature::team-payment refuses mock payments in production"
    notes: >-
      Standalone docker run --rm of agora-team-payment:local (override with PAYMENT_BOOT_IMAGE); not destructive.

