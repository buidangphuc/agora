syntax = "proto3";

// team-payment (Go) owns this: mock payment transactions & seller wallets (Phase 5).
// Financially sensitive => MOCK ONLY (no real money movement).
package platform.payment.v1;

import "google/protobuf/timestamp.proto";
import "platform/common/v1/common.proto";

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_COD = 1;         // Cash on Delivery
  PAYMENT_METHOD_MOCK_MOMO = 2;   // Mock MoMo QR
  PAYMENT_METHOD_MOCK_BANK = 3;   // Mock Bank Transfer
  PAYMENT_METHOD_MOCK_CARD = 4;   // Mock Credit/Debit Card
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_REFUNDED = 4;
  // Some but not all of the paid amount has been refunded (cumulative refunds).
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 5;
  // The order was cancelled before payment; ProcessMockPayment refuses it.
  PAYMENT_STATUS_CANCELLED = 6;
}

// Where a refund came from. The stored refund key is prefixed by source, so an id a
// seller chooses can never collide with a return or cancel refund.
enum PaymentRefundSource {
  PAYMENT_REFUND_SOURCE_UNSPECIFIED = 0;
  PAYMENT_REFUND_SOURCE_SELLER_OR_ADMIN = 1; // RefundPayment
  PAYMENT_REFUND_SOURCE_RETURN = 2;          // ReturnRefunded (RMA)
  PAYMENT_REFUND_SOURCE_ORDER_CANCEL = 3;    // OrderCancelled of a paid order
  PAYMENT_REFUND_SOURCE_LEGACY = 4;          // migrated single refund
}

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING = 1;
  PAYOUT_STATUS_PROCESSING = 2;
  PAYOUT_STATUS_COMPLETED = 3;
  PAYOUT_STATUS_REJECTED = 4;
}

enum WalletTransactionType {
  WALLET_TRANSACTION_TYPE_UNSPECIFIED = 0;
  WALLET_TRANSACTION_TYPE_ORDER_SETTLEMENT = 1;
  WALLET_TRANSACTION_TYPE_PAYOUT = 2;
  WALLET_TRANSACTION_TYPE_REFUND_DEDUCTION = 3;
  WALLET_TRANSACTION_TYPE_COMMISSION = 4;
  WALLET_TRANSACTION_TYPE_COMMISSION_REVERSAL = 5;
  WALLET_TRANSACTION_TYPE_SUBSCRIPTION_FEE = 6;
  // Reserved: not written in v1. A later change books ad spend from the campaign counter.
  WALLET_TRANSACTION_TYPE_AD_SPEND = 7;
}

// PaymentSettled is emitted on Kafka topic "payment.events" (key = order_id),
// wrapped in platform.events.v1.EventEnvelope, via team-payment's transactional
// outbox. team-order consumes it idempotently to transition the order (ADR-0009).
message PaymentSettled {
  string payment_id = 1;
  string order_id = 2;
  string buyer_id = 3;
  PaymentStatus status = 4;  // PAYMENT_STATUS_PAID | PAYMENT_STATUS_FAILED
  string occurred_at = 5;    // RFC3339; also the read-model version source
}

message PaymentTransaction {
  string id = 1;
  string order_id = 2;
  string buyer_id = 3;
  int64 amount = 4;
  string currency = 5;
  PaymentMethod method = 6;
  PaymentStatus status = 7;
  string provider_reference = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Cumulative amount refunded so far (0..amount).
  int64 refunded_amount = 11;
  // Every refund applied to this payment, oldest first.
  repeated PaymentRefund refunds = 12;
}

// One refund of a payment. requested_amount is what was asked; amount is what was
// applied (it may be less, or 0, when a return asked for more than was left).
message PaymentRefund {
  string id = 1;
  PaymentRefundSource source = 2;
  string source_id = 3; // refund_id, return id or order id
  int64 requested_amount = 4;
  int64 amount = 5;
  string reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message SellerWallet {
  string id = 1;
  string seller_id = 2;
  int64 balance = 3;
  string currency = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message PayoutRequest {
  string id = 1;
  string seller_id = 2;
  int64 amount = 3;
  string bank_code = 4;
  string account_number = 5;
  string account_name = 6;
  PayoutStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
}

message WalletTransaction {
  string id = 1;
  string wallet_id = 2;
  int64 amount = 3;
  WalletTransactionType type = 4;
  string reference_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum SellerFeeKind {
  SELLER_FEE_KIND_UNSPECIFIED = 0;
  SELLER_FEE_KIND_SUBSCRIPTION = 1;
  // Reserved: rejected in v1.
  SELLER_FEE_KIND_AD_SPEND = 2;
}

message GetOrderSettlementRequest {
  string order_id = 1;
}

message GetOrderSettlementResponse {
  string order_id = 1;
  int64 credited = 2;
  int64 commission = 3;
  int64 commission_reversed = 4;
  int64 refund_deducted = 5;
  // net = credited - commission + commission_reversed - refund_deducted.
  int64 net = 6;
  int32 commission_rate_bps = 7;
}

message ChargeSellerFeeRequest {
  string seller_id = 1;
  // amount is integer VND and must be greater than 0, otherwise INVALID_ARGUMENT.
  int64 amount = 2;
  SellerFeeKind kind = 3;
  // reference_id is the idempotency key: one entry per (seller_id, kind, reference_id).
  string reference_id = 4;
}

message ChargeSellerFeeResponse {
  string entry_id = 1;
  // created is false on a replay of the same key, which books nothing more.
  bool created = 2;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ProcessMockPayment(ProcessMockPaymentRequest) returns (ProcessMockPaymentResponse);
  rpc GetSellerWallet(GetSellerWalletRequest) returns (GetSellerWalletResponse);
  // Gate: seller verification required. The call succeeds only when the seller's
  // verification status is VERIFIED; otherwise FAILED_PRECONDITION. When the
  // verification service cannot be reached the call fails closed with
  // UNAVAILABLE.
  rpc RequestPayout(RequestPayoutRequest) returns (RequestPayoutResponse);
  rpc ListPayoutHistory(ListPayoutHistoryRequest) returns (ListPayoutHistoryResponse);
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);

  // ── Seller Wallet Ledger ──
  rpc GetWalletBalance(GetWalletBalanceRequest) returns (GetWalletBalanceResponse);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  // RequestWalletPayout books a payout ledger entry for the seller. Named to
  // avoid colliding with the existing bank-detail RequestPayout RPC above.
  // Gate: seller verification required. The call succeeds only when the seller's
  // verification status is VERIFIED; otherwise FAILED_PRECONDITION. When the
  // verification service cannot be reached the call fails closed with
  // UNAVAILABLE.
  rpc RequestWalletPayout(RequestWalletPayoutRequest) returns (RequestWalletPayoutResponse);
  // GetPayoutObligations reports the money a user still has in flight
  // (available and held balance, pending payouts) so team-identity can decide
  // whether an account may be erased. Internal: requires a service principal
  // holding scope `payment.internal.read`; every other principal gets
  // PERMISSION_DENIED, enforced by the service itself. NOT routed at the
  // gateway.
  rpc GetPayoutObligations(GetPayoutObligationsRequest) returns (GetPayoutObligationsResponse);
  // GetOrderSettlement returns the settlement of one order: net = credited - commission +
  // commission_reversed - refund_deducted. Every amount is a positive integer VND or 0.
  // Callable by the seller who owns the order and by an admin. It returns NOT_FOUND for an
  // order of another seller and for an unsettled order, and does not reveal which case applies.
  rpc GetOrderSettlement(GetOrderSettlementRequest) returns (GetOrderSettlementResponse);
  // ChargeSellerFee books a fee against the seller's wallet. It is service-to-service only,
  // not exposed by team-gateway: no end-user principal or scope may call it, so a seller
  // cannot charge another seller's wallet. A replay of the same key returns created = false
  // and nothing booked. A fee that would exceed the withdrawable balance fails with
  // FAILED_PRECONDITION. Kind AD_SPEND is reserved.
  rpc ChargeSellerFee(ChargeSellerFeeRequest) returns (ChargeSellerFeeResponse);
}

message GetPayoutObligationsRequest {
  string user_id = 1;
}

message GetPayoutObligationsResponse {
  int64 available_balance = 1;
  int64 held_balance = 2;
  int32 pending_payouts = 3;
}

// A single wallet ledger movement (settlement, payout, refund, etc.).
message WalletEntry {
  string id = 1;
  string seller_id = 2;
  string type = 3;      // e.g. "ORDER_SETTLEMENT", "PAYOUT", "REFUND_DEDUCTION"
  int64 amount = 4;     // minor units; sign indicates credit/debit
  string status = 5;    // e.g. "PENDING", "COMPLETED", "REJECTED"
  google.protobuf.Timestamp created_at = 6;
  // What the entry is about: the payment for ORDER_SETTLEMENT, the refund for
  // REFUND_DEDUCTION; empty for payouts and legacy credits.
  string reference_id = 7;
}

message GetWalletBalanceRequest {
  string seller_id = 1;
}

message GetWalletBalanceResponse {
  int64 balance = 1; // minor units
}

message ListLedgerEntriesRequest {
  string seller_id = 1;
  platform.common.v1.PageRequest page = 2;
}

message ListLedgerEntriesResponse {
  repeated WalletEntry entries = 1;
  platform.common.v1.PageResponse page = 2;
}

message RequestWalletPayoutRequest {
  string seller_id = 1;
  int64 amount = 2; // minor units
}

message RequestWalletPayoutResponse {
  WalletEntry entry = 1;
}

message CreatePaymentRequest {
  string order_id = 1;
  PaymentMethod method = 2;
}

message CreatePaymentResponse {
  PaymentTransaction transaction = 1;
  string payment_url = 2; // URL to the mock payment checkout page
}

message GetPaymentRequest {
  string id = 1;
  string order_id = 2;
}

message GetPaymentResponse {
  PaymentTransaction transaction = 1;
}

message ProcessMockPaymentRequest {
  string transaction_id = 1;
  bool simulate_success = 2; // true to simulate successful payment, false for failure
}

message ProcessMockPaymentResponse {
  PaymentTransaction transaction = 1;
  bool success = 2;
  string message = 3;
}

message GetSellerWalletRequest {
  string seller_id = 1;
}

message GetSellerWalletResponse {
  SellerWallet wallet = 1;
}

message RequestPayoutRequest {
  string seller_id = 1;
  int64 amount = 2;
  string bank_code = 3;
  string account_number = 4;
  string account_name = 5;
}

message RequestPayoutResponse {
  PayoutRequest payout = 1;
}

message ListPayoutHistoryRequest {
  string seller_id = 1;
}

message ListPayoutHistoryResponse {
  repeated PayoutRequest payouts = 1;
}

message RefundPaymentRequest {
  string payment_id = 1;
  int64 amount = 2;
  string reason = 3;
  // Required. Idempotency key of this refund: 1-64 chars of [A-Za-z0-9._:-]. A retry
  // with the same id returns the same refund; a new id is a new refund.
  string refund_id = 4;
}

message RefundPaymentResponse {
  PaymentTransaction transaction = 1;
  bool success = 2;
  string message = 3;
}
