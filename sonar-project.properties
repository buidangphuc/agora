# SonarQube configuration for Marketplace Polyrepo
sonar.projectKey=marketplace-showcase
sonar.projectName=Marketplace Showcase Polyrepo
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.tests=.

# Exclude generated code, distroless bootstrap lifecycles, and external dependencies
sonar.exclusions=**/generated/**,**/node_modules/**,**/*.pb.go,**/*.pb.gw.go,**/*.connect.go,**/.next/**,**/dist/**,**/build/**,**/migrations/**,**/.venv/**
sonar.coverage.exclusions=**/bootstrap/**,**/observability/**,**/*_pg.go,**/main.go,**/server.go,**/cmd/**
sonar.test.inclusions=**/*_test.go,**/tests/**,**/*.test.ts,**/*.test.tsx

# Go test coverage reports
sonar.go.coverage.reportPaths=team-identity/coverage.out,team-domain/coverage.out,team-search/coverage.out,team-engagement/coverage.out,team-order/coverage.out,team-payment/coverage.out,team-chat/coverage.out,team-notification/coverage.out,team-gateway/coverage.out

# Quality Gate Settings
sonar.qualitygate.wait=true
sonar.coverage.dtdVerification=false
