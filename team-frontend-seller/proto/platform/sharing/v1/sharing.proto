syntax = "proto3";

// Short shareable links with UTM tracking and Open Graph preview metadata.
package platform.sharing.v1;

service SharingService {
  // Create a short link pointing at a target (listing, storefront, etc.).
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  // Resolve a short code back to its target plus OG metadata for previews.
  rpc ResolveShareLink(ResolveShareLinkRequest) returns (ResolveShareLinkResponse);
}

// Open Graph preview metadata for rich unfurling.
message OgMeta {
  string title = 1;
  string description = 2;
  string image_url = 3;
}

message CreateShareLinkRequest {
  string target_type = 1; // e.g. "listing", "storefront"
  string target_id = 2;
  // UTM parameters to stamp on the resolved destination.
  map<string, string> utm = 3;
}

message CreateShareLinkResponse {
  string short_code = 1;
}

message ResolveShareLinkRequest {
  string short_code = 1;
}

message ResolveShareLinkResponse {
  string target_type = 1;
  string target_id = 2;
  map<string, string> utm = 3;
  OgMeta og_meta = 4;
  // Total resolves of this short link (incremented by this call).
  int64 click_count = 5;
}
